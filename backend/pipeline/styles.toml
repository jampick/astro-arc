# CHARTER, 2026-10-13 (written to docs/charter-schema.md; reworked the same
# day from the woodblock "Floating World Noir", key kept as `floating` so
# settings, history and rotation still resolve): Edo's walled pleasure quarter
# as a film noir crime city, painted as a 1970s Japanese period-revenge film
# poster. The world stays 1800s; only the medium moves to the 1970s, the way
# calendario paints Aztec myth as 1940s calendar art. Courtesans and women
# assassins as femmes fatales are the point of the style. Silk, lanterns and
# snow keep it apart from [shinjuku] (leather, neon and motorbikes in 1972),
# and the poster paint keeps it apart from [ukiyoe]. Glamour is sensual and
# suggestive, never explicit, and every woman is a grown adult: the quarter's
# child attendants are written out of this world on purpose. No artist, film,
# actor, studio or play names, since whatever a charter names turns up.
[floating.world]
era = "Edo's walled pleasure quarter in the early 1800s, run like a crime city: one gate in, a moat around it, a main street of teahouses and lattice-fronted houses, alleys behind them, and the river and rice fields beyond the wall. Technology is the paper lantern, the oil lamp, the sedan chair, the abacus and the hidden blade, and nobody trusts any of it."
materials = "Lacquer, silk and wet paper first, then cedar lattice, black roof tile, rain-dark stone, tatami, sake ceramics, tortoiseshell combs, folding screens and smoke."
physics = "Light comes only from lanterns, lamps, a moon behind cloud and lightning, and each throws hard black shadow; nothing glows of its own accord. It is nearly always night or the blue hour before dawn. Ghosts and fox-women are real but show themselves only at the edge of a lantern's reach. Nobody flies, and blood is at most a thin red line on snow or steel, never gore."
society = "The quarter runs on debt and contracts: women bound to houses, the owners and the teahouse mistresses who hold their papers, procurers, gamblers, rich merchants, samurai who left their swords at the gate, and a constable who takes bribes and still wants the truth. Days here are poetry and music parties, sake and gossip, bathhouse hours, festivals and fireworks on the river as much as the hustle."
weather = "Night in every mood: fine rain on lanterns, a downpour that empties the street, a summer night thick with heat and fireflies, fog off the river, a typhoon rattling the shutters, a sickle moon over the gate at dawn, and snow on black tile. Snow is one night among many, not the default. Pick what the day calls for."
inhabitants = "Grown women of the quarter, courtesans, geisha musicians, bathhouse women, the teahouse mistress and the woman who takes money to kill, each with her own face and her own scheme; the men who come to them, merchants, masterless samurai, gamblers, constables and hired swords; cats on the roofs, carp in the moat, crows at dawn; and fox-spirits and the ghosts of women who died in debt. Nobody in this world is a child. They are as often drinking, playing, bathing or asleep as plotting."
strangeness = "The uncanny is part of the trade: a fox-woman working among the courtesans, a lantern that answers back, a ghost who still keeps her appointments. People pour another cup and say nothing."
numinous = "The sacred has a body: a small shrine at the end of an alley with stone guardians and red gates, a stone bodhisattva in a red bib beside the moat, a temple bell heard over the wall, a drowned woman standing in the rain. Painted in the same poster gouache and hard light as everything else, never a beam or an aura."
dread = "This world at its darkest is the double-cross and the debt paid back: a body in the moat, a blade behind a screen, a teahouse burning, two lovers' sandals left on the riverbank, rivals closing in down a lantern-lit street. Shown at the instant before the strike or just after it, with at most a thin red line on snow or steel, never gore, and the frame does not take sides."
favoured_actors = "Beautiful grown women of the quarter out in the night, alone, in pairs or with one man, close enough to fill much of the frame: a woman with a closed paper umbrella waiting at the crown of an arched bridge while her rivals come on behind her, a courtesan stepping off a boat at a river landing with a blade in her sleeve, a woman crossing a snowy street under the lanterns, two women on a rooftop in the rain with the quarter below, a musician walking home along the moat at dawn. Patrons, swordsmen and constables round them out. The procession of the top courtesan on tall clogs is this genre's most worn image and should not be the default; neither is a woman seated in a room at a desk or behind a screen, nor the same woman facing the viewer in every frame, nor a duel in snow every time."
myth = "Kabuki ghost and revenge plays, the puppet theatre's double-suicide plays, the wronged woman's vendetta carried through to the last name on her list, fox and cat-spirit folklore, the woman who counts plates at the well, the floating world's poetry of passing pleasure; and American film noir, with its femme fatale, its doomed men and its rain."
highlight = "The thing the eye finds first: a seduction or a betrayal caught at its sharpest, the blade a breath from being drawn, or the uncanny showing at the edge of the light. Today's kind of wrongness is given with this definition. Painted in the same poster gouache and hard light as everything else."
highlight_modes = [
  "a shadow on a paper screen that does not match the person casting it",
  "a weapon or a poison caught in plain sight",
  "a woman whose reflection is not quite human",
  "a light reaching a face it should not reach",
  "the dead keeping an appointment",
]

[floating.brief]
signature = "SIGNATURE — at least one thing marks this as the noir pleasure quarter of the 1800s, named explicitly: a woman behind a lattice window, a paper lantern or oiled paper umbrella in rain or snow, lacquered hair stuck with combs and pins, a long pipe trailing smoke, or a sword or blade half hidden in a silk sleeve. It may be the highlight or the actor. A frame that could be any modern Tokyo, any 1970s city or any woodblock print is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly beautiful grown woman of the quarter, a courtesan, a musician, a bathhouse woman or a woman who kills for hire, painted with this poster genre's dangerous glamour: a loose silk kimono slipping off one shoulder or open low at the collar and nape, a bare back above a loosened obi, a bare leg through the opening of the robe, hair coming down or wet from the rain or the bath, and a knowing, level look aimed at someone in the scene rather than the viewer. She has something of her trade in hand, a closed paper umbrella, a short blade still sheathed, a long pipe or a fan. She stands, walks, waits on a bridge, runs down a street or climbs onto a roof at least as often as she sits, and most frames are outdoors, in the street, on a bridge, at the river landing or on the rooftops, never seated at a desk. Her kimono is a colour of its own, ink black, snow white, plum, indigo, moss green or gold as often as red. If the actor named below is a man, paint a woman in the same role instead; men stand behind or beside her, never as the subject. She holds the blade or the umbrella herself; she is never bound, held or touched by a weapon. Always clothed in the silk, however loosely; never nudity and never a sexual act. A frame where she sits on the floor in the foreground again, a frame whose lead figure is a man, or a frame of plain, faceless or buttoned-up figures, is a failed response."
adults = "ADULTS — every woman in frame is a grown adult in her twenties or thirties, with an adult face and build and a contract, a debt or a vendetta of her own. A figure who reads younger than twenty is a failed response."
menace = "MENACE — when danger is in the frame it is the instant before the strike: rivals closing in behind her, a hand on a hilt, a blade catching the light, a lantern knocked over. At most a thin red line on snow or steel shows what has already happened. A wound, blood on skin or gore is a failed response, and so is any other woman in frame slumped, fallen, lying down, hurt or dead; the women around her stand, watch or scheme."
crimson = "CRIMSON — the frame is held to crimson, black and snow white: a hard crimson glaze lies over a third or more of the frame, on lantern-lit walls, the street, the water and the shadow sides of the figures, with black shadow and white snow, rain or paper breaking it. The crimson is the poster's ink, not the sky: the scene runs to the top edge with roofs, eaves, lanterns, branches or the night's weather, and an empty band of flat red across the top of the frame is a failed response. The lead woman's kimono does not have to be red and often is not. A frame in even natural colour, or one lit by neon or electric light, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

