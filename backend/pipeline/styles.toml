[hammer.registers]
"botanical" = "Plants of the old country and its protection: wolfsbane by the gate, garlic flowers on a sill, ivy over a tomb, roses in the castle garden. Its highlight: a flower that wilts or blooms at the wrong touch."
"bodily and anatomical" = "The body as allure and as target: a bare throat and shoulders in candlelight, loose hair over a pillow, a hand reaching from the shadows that never quite arrives. Danger is shown, never a wound or a bite."
"fungal and decaying" = "Decay of the old families: a dust-sheeted wing of the castle, a crypt green with damp, a cobwebbed banqueting table, a coffin of rotted wood."
"animal and creaturely" = "Animals that sense it first: wolves at the edge of the forest, bats in the rafters, a black horse rearing, a dog whining at the door, a raven on the gate."
"geological" = "Stone of the mountains and the dead: a crag above the pass, the rough walls of a crypt, a gravestone sunk crooked in the earth, a cave under the castle."
"metallic and ore" = "Metal that guards and binds: a silver crucifix, a silver bullet, an iron key on a ring, a candelabrum, a coffin's brass handles."
"glass and ceramic" = "Glass that shows what should not be there: a mirror over the mantel, leaded windows, the laboratory's retorts and bell jars, a crystal goblet of dark wine."
"architectural" = "The village and the castle: a coaching inn with a painted picture sign and no words on it, a church and its graveyard, a castle hall with a great stair, a vaulted crypt, a laboratory in a tower."
"domestic interior" = "The rooms of the inn and the castle: a bedchamber with heavy drapes and a canopied bed, a taproom with a great hearth, a library of old books, a dressing table with a candle."
"mechanical" = "The machines of the age and of the mad scientist: a coach and its wheels, a clock in the hall, the laboratory's generator and its crackling coils, a winch over a well."
"industrial and infrastructural" = "The workings of the valley: a watermill, a blacksmith's forge, the coach road over the pass, a stone bridge over a torrent, the castle's well."
"agricultural and cultivated" = "The farmed valley: a harvest field at dusk, a hay barn, an orchard by the churchyard, a vineyard on the slope below the castle."
"aquatic" = "Running water that the dead cannot cross: a torrent under the bridge, a mill race, a moat around the castle, rain filling the graves."
"atmospheric" = "The air of the old country: fog through the trees, a storm coming over the pass, mist rising from the graveyard, smoke from the village chimneys."
"glacial and frozen" = "Winter on the pass: snow on the coach road, icicles on the castle gate, a frozen lake where something lies under the ice, breath in a cold crypt."
"fire and ember" = "Fire as the only safety and the only weapon: a candle carried through the dark, a roaring hearth, a mob's torches, a burning mill."
"textile and fiber" = "Cloth as glamour and as shroud: a velvet cloak with a high collar, a white silk shroud, damask hangings, a curtain torn from its rings."
"ritual object" = "The tools of faith and of the hunt: a crucifix, a stake and mallet, a rosary, holy water, a censer, a black-bound book of rites."
"paper and inscription" = "Papers of warning and of science: a journal of a dead traveller, a laboratory notebook, an old map of the pass, a family tree. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and measure in the dark: a harpsichord at the ball, a church bell, a pocket watch counting to midnight, the scientist's gauges and dials."

[hammer]
label = "Gothic One-Sheet"
suffix_base = "A 1960s British horror film poster painting, as printed on a folded one-sheet: lurid, saturated gouache in heavy crimson and sickly acid green against deep black, with a warm sulphur glow where candles or torches burn; the crimson and green sit in drapery, fog, walls and shadow, and the top of the frame is black, storm grey or the room's own ceiling rather than a band of red sky. Faces and figures painted vivid and theatrical in bold planes with green-tinged shadows, the background loose and swirling, the composition stacked like a poster with the menace drawn larger than life behind and above. The poster is folded in a grid: fold lines cross the whole image as pale creases with the ink rubbed away along them, and a fine craquelure of cracked varnish covers the paint. The picture fills the frame edge to edge: no border, no margin, no wall and no blank title panel. Not photographic, not digital and not 3D-shaded. No text, title, credits or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties to forties, painted as a 1960s horror film heroine, voluptuous and glamorous, with bare shoulders and a low neckline, period make-up and a look of alarm, nerve or uneasy trance, each woman with an individual face, hair colour, hairstyle and dress of her own, dark-haired as often as fair, her dress never green or crimson, so it stands apart from the poster's colour; men are gaunt or stern in dark frock coats and cloaks, often half in shadow. Glamour is film-poster sensual and suggestive, never explicit, with no exposed breasts or genitals, and danger never shows a wound."
