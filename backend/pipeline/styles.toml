# CHARTER, 2026-10-12 (new style, written to docs/charter-schema.md): Bosch's
# Brabant around 1500: a crowded, high-viewed world of pleasure and penance
# where sins are built as contraptions, fruit and hybrids. The tree-man and the
# lone tormented sinner in close-up are demoted as the painter's most worn images.
[bosch.world]
era = "Brabant around 1500 as Hieronymus Bosch painted it: a flat, watery Low Countries plain of walled towns, inns, mills and monasteries, seen from high above, in an age that expects the Last Judgment soon. Technology is the hand tool and the household vessel, and any of them may be turned into a body or a house."
materials = "Pink and blue stone grown in bulbous shapes, wicker, earthenware, glassy fruit skin, eggshell, and rough brown homespun. Every surface is crisp-edged and finely painted, nothing is blurred."
physics = "Scale follows meaning, not nature: a person may be smaller than a berry and a musical instrument larger than a barn. Hybrids join at clean seams, a head walking on legs, a body grown from a pitcher. Daylight is high, even and cool; at night only fire gives light, and nothing else glows of its own accord."
society = "Peasants, pilgrims, friars, nuns, quacks, conjurers, merchants and lovers in a crowded world of pleasure and penance. Days here are feasts, bathing parties, card games, courtship, carnival and processions as often as labour."
weather = "The whole range: the pale green-blue distance of a clear spring morning, a still noon over the marsh, storm cloud over the plain, a night sky smoked red by a burning town. Pick what the day calls for."
inhabitants = "Crowds of small people in shifts and homespun, friars and peasants, hybrid demons assembled from animals and utensils, owls, birds and fish larger than the people round them, and the occasional hermit saint. They are as often at play or at rest as at work or punishment."
strangeness = "The monstrous is everyday and busy: demons go about their tasks like tradespeople, and the people beside them are absorbed in their own pleasures or chores. Nobody looks up and nobody is surprised."
numinous = "The sacred is small and exact and has a body: an angel with peacock-coloured wings leading one soul by the wrist, a hermit at prayer while hybrids crowd round him. It is painted with the same care as everything else, never as an aura, a beam or a blur."
dread = "This world at its darkest is the Judgment come true: towns burning on the horizon at night, people punished by the very instruments of their pleasures, a crowd led in procession into a giant mouth. Painted with the same cool precision as a garden, a clean wound at most, and the frame does not take sides."
favoured_actors = "Crowds and swarms of small figures each doing something different, hybrids at work, pairs and small groups, birds and fish. The tree-man and a single tormented sinner in close-up are this painter's most worn images and should not be the default."
myth = "Late-medieval Christian moral allegory: the seven deadly sins, the Garden of Eden and the Last Judgment; the lives and temptations of the desert hermit saints; Netherlandish proverbs, carnival and the Ship of Fools; and the vessels and marriages of alchemy."
highlight = "The thing the eye finds first: a sin or a temptation built as a contraption, a hybrid creature or an outsize everyday thing, with small people busy round it, riding it or carrying it off. Today's kind of wrongness is given with this definition. Painted as crisply as everything else."
highlight_modes = [
  "a hybrid of a creature and a household tool",
  "a musical instrument at the scale of a building",
  "an instrument of pleasure turned into a punishment",
  "a bird or fish that dwarfs the people round it",
  "a cart or boat crowded with fools parading a sin",
]

[bosch.brief]
signature = "SIGNATURE — at least one hybrid demon or impossible contraption, assembled from parts of animals, tools or fruit, is named explicitly and doing something. It may be the highlight. A scene that could be any Flemish landscape or peasant painting is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[bosch.verbs]
process_hard = ["catching fire", "splitting open", "bursting its skin", "swarming over", "keeling into the mire", "impaling", "sinking into the mire", "smoking", "spilling out", "shattering like an egg", "tilting", "blistering", "seething", "slumping into the water", "gnawing", "festering", "skewering", "listing", "being swallowed", "burning down to the frame", "ripping at the seams", "going under"]
