[illuminated.registers]
"botanical" = "Plants as the border and the garden: vine scrolls with flowers in the margin, an enclosed garden with a fountain. Every plant is flat, bright and outlined."
"bodily and anatomical" = "The body as the medieval page knows it: the zodiac man with the signs on his limbs, a martyr's body calm in its legend. Flat and orderly, never gore."
"fungal and decaying" = "Decay as memento mori: the three living meeting the three dead, a corpse in a tomb drawn as a lesson."
"animal and creaturely" = "Animals of the bestiary and the farm: the pelican feeding its young, pigs fattening in an oak wood. Each animal carries its legend."
"geological" = "Rock as the page draws it: stepped cliffs like stacked loaves, a hermit's cave in a hillside."
"metallic and ore" = "Metal as armour, coin and bell: a knight's mail, a goldsmith's bench."
"glass and ceramic" = "Stained glass and rock crystal: a church window in jewel colours, a reliquary's crystal window. Glass is coloured light."
"architectural" = "Walled towns, castles and churches, stacked and bright: the duke's castle with its blue roofs above the fields, a cathedral being built with cranes."
"domestic interior" = "A hall with a fire and a feast, a chamber with a bed under a canopy. The scene is open at the front like a stage."
"mechanical" = "Medieval machines: a water mill's wheel, a treadwheel crane lifting stone."
"industrial and infrastructural" = "Works of the town and the river: a bridge with houses on it, a quarry for the cathedral's stone."
"agricultural and cultivated" = "The labours of the months: ploughing with oxen, the grape harvest. The subject is the season's work."
"aquatic" = "Water as river, moat and sea: a moat round a castle, the sea with a whale mistaken for an island."
"atmospheric" = "The sky is gold or deep blue with stars, sometimes with a zodiac arc across it."
"glacial and frozen" = "Winter's month: snow on the roofs and the fields, a frozen pond with skaters."
"fire and ember" = "Fire as hearth and hellmouth: a winter fire with people warming their legs, the hellmouth open in the margin."
"textile and fiber" = "Cloth as tapestry and garment: a hanging behind a feast, a spinner at her distaff."
"ritual object" = "Relics, reliquaries, processional crosses and books of hours, carried and venerated."
"paper and inscription" = "The page itself: decorated initials, a scroll held by a figure, rubrics in red. Lettering is ornamental, never a readable sentence."
"instrument and measure" = "Measure in the medieval world: an astrolabe, the calendar's zodiac roundel, a merchant's scales."

[illuminated]
label = "Illuminated Manuscript"
suffix = "Illuminated manuscript style: hand-painted in jewel-toned mineral pigments — ultramarine blue, vermilion red, verdigris green — on a warm, slightly imperfect parchment ground, never pure white. Gold leaf is burnished to a mirror shine and reads as a reflective, raised surface, not flat yellow paint. The composition sits inside an ornate decorative border of vegetal scrollwork, small symbolic creatures, and fine linework diagrams, framing the central image without competing with it. Do not add a person, halo, or figure unless one is already described above — plenty of manuscript pages are a decorated object, diagram, or pattern with no one in them. Only if a person is explicitly part of the scene described above: render them flattened and stylized rather than naturalistically proportioned, in the manner of Byzantine icon painting, with a gold halo if the scene calls for it, never modern dress or realistic anatomy."
