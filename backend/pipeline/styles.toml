# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): a
# sibling of [floating] moved to Southern California in 1955 and out into the
# sun: desert motels, citrus groves, oil fields and a beach town with secrets,
# painted as a printed 1950s crime paperback cover in loose, unfinished
# gouache with one hot colour against a bleached ground and the cover stock's
# own wear (crease, rubbed corners, yellowed paper tone). The femme fatale is
# the point of the style. Glamour is pin-up and suggestive, never explicit,
# and every woman is a grown adult: schools, teenagers and children, and the
# period's teen hangouts, are written out of this world on purpose. The
# trench-coated eye under a streetlamp and the blind-striped face are demoted.
# Kept apart from [atomic] (clean airbrushed optimism, ochre and sand) by
# sketchy edges, deep shadow masses and a bone, sage, denim and dust ground,
# and from [backglass] and [lowrider] by its own cast of 1955 working women.
# A [light] lo line keeps night in the open West rather than rainy neon city.
# Revised 2026-10-13 after review: outfit menu removed, motel pool and pier
# held to two fields each, blinds and corpses cut back.
# Revised again after sweep pr-paperback: five of eight women were in a slip
# or nightgown, five stood in a doorway and three were on a motel bed, so the
# slip leaves the textile register, the allure line dresses her for where she
# is, and the room and the doorway are capped.
# No author, artist, publisher, film or studio names, since whatever a charter
# names turns up.
[paperback.world]
era = "Southern California in 1955, a boom country built on oil, oranges and real estate: desert motels strung along two-lane highways, citrus groves being bulldozed for tract houses, oil fields pumping between bungalows, and a beach town where everybody has something to hide. Technology is the two-tone sedan, the phone booth, the telephone switchboard, the portable radio and a small automatic in a handbag, and any one of them can be used to kill a man."
materials = "Sun-hot chrome, white stucco and dry palm fronds first, then cotton sundresses, rayon blouses, seersucker, straw hats, Formica, terrazzo, crude oil, sun-bleached canvas awnings and road dust."
physics = "The sun is the law here: white noon glare, short black shadows under the palms, heat coming off the asphalt. At night the only light is a roadside sign, headlights, a porch bulb or a desk lamp, and nothing glows of its own accord. The Santa Ana wind blows hot and dry and makes people do what they were only thinking about. Cars, guns and telephones behave as they really did; nobody flies, and a shot is a flat flash and a dropped glass, with blood a small dark shape, never gore."
society = "A society of grifters and salesmen: insurance men with a policy to sell, wives with husbands they would rather collect on, private eyes working out of a rented office, oil men, land developers, crooked cops, bartenders, cocktail waitresses, motel clerks and actresses who never got the part. Days here are cocktails in the shade, long afternoons on the sand, grown couples dancing at the beach-town ballroom, card games, the racetrack and drives down the coast road as much as the scheme."
weather = "The California range: white noon glare over the desert, June fog rolling in off the ocean, a brown smog haze over the basin, a heat wave over the oil field, a high thin overcast over the beach town, a cold clear desert night. Pick what the day calls for."
inhabitants = "Grown women at the centre, in their twenties, thirties and forties: a wife with a policy on her husband, a real-estate saleswoman showing model homes in a bulldozed grove, a rancho heiress of an old Mexican-Californian family selling off the last of her land on her own terms, an oil company secretary at the field office, a switchboard operator at the telephone exchange, a woman who works the racetrack rail, a cocktail waitress, a lady private eye, an actress on the way down, each with her own face and her own angle, and women of every background the region had in 1955; the men who fall for them, salesmen, oil men, cops, drifters and the tired private eye; coyotes, lizards, gulls and a lapdog in a convertible; and the ghosts of people who drove into the desert and never came back. Nobody in this world is a child or a teenager. They are as often swimming, drinking, dancing or asleep in the sun as scheming."
strangeness = "The strange is the sun-struck kind: a mirage of water across the highway, a woman in furs at noon in the desert, a sprinkler running on the lawn of a house nobody lives in, a phone that rings in an empty booth. People light a cigarette and look the other way."
numinous = "The sacred has a body: an adobe mission bell tower, a wooden cross on a desert hill, a neon cross over a revival church on the highway. Painted in the same loose gouache as everything else, never a beam or an aura."
dread = "This world at its darkest is the frame-up and the body: a man face-down in a motel pool, a car burning in a dry wash, a shovel by fresh earth between the trees, a hat caught in the surf, the patrol car's headlights coming up the drive. As often in hard sunlight as at night, blood a small dark shape, never gore, and the frame does not take sides."
favoured_actors = "Beautiful grown women alone, in pairs or with one man, cropped big in the foreground and filling much of the frame: a real-estate saleswoman showing a model home among bulldozed trees, a woman in a sundress waiting in a parked car on a grove road, a woman in dark glasses at the racetrack rail, two women plotting over highballs in a bar booth, a woman holding a small automatic at her hip, an oil company secretary at the field office door. Salesmen, cops, drifters and bartenders round them out. The trench-coated private eye under a streetlamp in the rain and a woman's face striped by Venetian-blind shadow are this genre's most worn images and should not be the default, and neither is the same woman facing the viewer in every frame. Most frames are outdoors in the sun or the open night; a woman framed in a doorway or lying on a motel bed is the exception, not the habit."
myth = "Hardboiled crime pulp and its fall guys, the insurance-murder and double-cross story, California's boom-and-bust legends of oil, water and land, the desert's lost mines and the men who died looking for them, the Spanish mission and rancho past, the Old West outlaw, and the picture-business dream that brings people west and leaves them at a motel."
highlight = "The thing the eye finds first: the seduction or the double-cross caught at its sharpest, or something the sun shows that should have stayed hidden. Today's kind of wrongness is given with this definition. Painted in the same loose gouache as everything else."
highlight_modes = [
  "a weapon, a bloodied glove or a second set of car keys left out in plain sunlight",
  "a look that says she knows what nobody else in the frame knows",
  "a shadow cast by someone outside the frame",
  "something meant to stay buried (a car, a suitcase, a gun) showing through sand or water",
  "a mirage that is not quite a mirage",
]

[paperback.brief]
signature = "SIGNATURE — at least one thing marks this as 1955 Southern California noir, named explicitly: a grown woman in a motel room doorway, a strip of motel rooms under a neon sign shape, a phone booth on an empty two-lane highway, a woman in dark glasses in noon glare, an oil pump nodding behind a bungalow, or a citrus grove dulled by dust under hard sun. It may be the highlight or the actor. No more than one of motel, pool or pier per frame. A frame that could be any modern beach town, a rainy big-city noir at night, or the clean, optimistic 1950s advertising world is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a grown woman painted with this cover art's glamour, in clothes that show her off and fit where she is and what she is doing: a halter sundress on the grove road, a swimsuit or a two-piece at the water, a tight sheath dress at the bar, a fitted skirt and an open-collared blouse at work, shorts and a knotted shirt on the highway, bare shoulders and a plunging neckline more often than not. A slip or a nightgown only in a bedroom, and not most days. In a pose of waiting, menace, play or ease rather than one held for the viewer, her expression fitting what she is doing. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, fully covered or faceless figures, is a failed response."
hot = "HOT COLOUR — exactly one hot colour in the frame, in one place, and that place is the highlight or whatever the eye should find first, not a habit: a car, a neon tube, a flame, a mouth, a dress, a glove. Everything else stays in the muted ground of bleached bone, sage, faded denim blue and dust grey. Skies, fires and fruit stay muted: a dusk is dusty rose and grey, a brush fire is brown smoke with one line of flame, oranges in the grove are dulled by dust and shade; only the one chosen thing is hot. Two competing saturated colours, or a frame saturated all over, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[paperback.light]
lo = "Night in the open West: one roadside sign, headlights or a porch bulb on stucco and palms, with the dry dark landscape visible beyond. A rain-slick city street, or a frame lit only by neon, is a failed response."

