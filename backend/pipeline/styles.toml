[kowloon.registers]
"botanical" = "Green squeezed into the concrete: a banyan splitting a retaining wall, potted kumquats on a rooftop at New Year. Its highlight: a plant that heals or poisons."
"bodily and anatomical" = "The body as weapon and glamour: a bare shoulder above satin, taped wrists, a jade bangle. Bruises and a split lip at most, never gore."
"fungal and decaying" = "Decay as the city's crowding: black mould down a tenement wall, a dried-goods shop of mushrooms and sea cucumber, a condemned block."
"animal and creaturely" = "Animals of the street and the market: songbirds carried out in cages for an airing, a cat asleep on a sack of rice."
"geological" = "Rock under the city: granite hills behind the tenements, a quarry face, a sea wall of stacked boulders."
"metallic and ore" = "Steel and brass of the street: a hawker's brass scale, a training hall's gong, a gold ring."
"glass and ceramic" = "Glass and porcelain of the day and the night: a smashed mirror behind a bar, a teapot on a dim sum trolley, bowls stacked at a noodle stall."
"architectural" = "The vertical city: tenements with iron-grilled balconies, bamboo scaffolding round a new tower block, a temple roof of green tile among them."
"domestic interior" = "Rooms the size of a cupboard: a bunk and a fan, a family shrine on a shelf, a dance hall dressing room with one mirror."
"mechanical" = "Machines of the hustle: a jukebox in a bar, a pinball machine in an arcade, a printing press turning out racing tips."
"industrial and infrastructural" = "The working port: container cranes, the airport runway pushing into the harbour, a cargo lighter loading in mid-stream."
"agricultural and cultivated" = "The New Territories past the hills: rice paddies and duck ponds, a walled village, fish ponds by the border."
"aquatic" = "The harbour and the rain: a floating restaurant lit up at night, a flooded street, a rooftop water tank."
"atmospheric" = "City air: wok smoke from a street stall, steam off a wet road after rain, the haze of a hot afternoon, a storm sky."
"glacial and frozen" = "Cold as a luxury: a block of ice delivered to a fishmonger, frost on a bar's bottle of beer, a cold store full of hanging ducks, the air-conditioned chill of a nightclub."
"fire and ember" = "Fire as celebration and as payback: a string of firecrackers at a shop opening, a squatter fire on the hill, a nightclub torched for a debt."
"textile and fiber" = "Clothes as armour and as bait: a tailor's bolt of brocade, a fighting school's black sashes."
"ritual object" = "The sacred of the street: spiral incense coils, divination blocks, a paper house to burn for the dead, a triad's oath flag."
"paper and inscription" = "Papers of the hustle and the gods: betting slips, a protection receipt, a temple fortune stick's verse. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and the odds: an erhu and clappers at the opera, a nightclub band's trumpet, dice in a bowl, an abacus at the cashier."

[kowloon]
label = "Kowloon Billboard"
suffix_base = "A 1970s Hong Kong cinema hoarding painted by hand at enormous scale in matte poster paint on plywood boards. The painted boards fill the frame edge to edge, with no building, scaffold, frame or street around the hoarding. Brushstrokes as wide as a hand at this scale, unblended dry-brush drags with the bare board showing through, edges left ragged, and sharp speed streaks behind anything in motion. Forms built from bold flat planes edged in thick dark outline, figures stacked in tiers up the boards. The paint has gone chalky and pale in the sun and is streaked with city grime. Colours straight from the tin: cinnabar red, jade green, cobalt blue and temple gold, with charcoal and hard chalk-white glints. Not photographic, not digital and not airbrushed. No text, title, Chinese or Latin characters, or lettering of any kind, on the hoarding or on any sign in the scene."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties, painted with the glamour of the period's own action posters, in mid-1970s Hong Kong clothes cut to show her off, in any colour but the board's cinnabar, each woman with an individual face, build, hairstyle and outfit of her own, and a cool, knowing look. Faces and limbs are modelled in a few bold planes of flesh, highlight and shadow. Men are lean, hard figures in vests, sharp suits or work clothes. Glamour is suggestive, never explicit, with no exposed breasts or genitals. People are painted with affection, never caricatured or exoticised."
space = [
  "from a Star Ferry's open deck across the harbour to the island under its peak",
  "down a hillside of squatter huts to the tenements and the harbour",
  "along the tram line under a flyover to the waterfront godowns",
  "from a racecourse grandstand over the crowd to the tower blocks",
  "through a tea house's bead curtain to the wet street outside",
  "from a sampan in the typhoon shelter across the moored boats to the shophouses on the shore",
  "over a block of flat roofs with their pot gardens and shacks to the ridge of Lion Rock",
  "down a walled-city passage narrow enough to touch both walls to a shaft of daylight on a dentist's chair",
]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md; revised
# the same day after review). v1 and v2 painted Bombay in 1976 as its own
# hand-painted film hoardings showed it; the previous text is kept at
# .work/drafts/masala-v2-before-rework.toml.
#
# REWORK v3, 2026-10-13, after the user's review of sheet-masala-v2 ("too much
# like tele novela, smooth, sexy, exotic, foreign, no cheez"). The style was
# playing as a soap opera: a giant brooding face beside a tiny figure, crude
# billboard enamel, bruises, handprints, a ruined stage and a woman cracking a
# safe. It is now the same city and era painted the way its glossy
# film-magazine covers and glamour calendars were: smooth airbrushed gouache
# and oil, silky gradients, luminous skin, jewel colour and soft glow, one
# consistent scale like a single camera. The mood is cool, languid and
# confident: the city as a place you want to be in (terraces over the sea,
# monsoon bungalows, jazz clubs, the sea-face pool, a dhow at night), its
# textures (rain, silk, brass, jasmine, lamps on water) doing the work that
# costume or caricature would otherwise do. The two-scale giant-face rule is
# gone, and so are the melodrama physics, the brooding hero, tears, bruises
# and fights; a COOL rule names them as failures. The label is now "Bombay
# Silk" because the label reaches Stage 2 ("Rendering style for this image:
# <label>") and "masala" there cues the melodrama genre; the key stays
# `masala`. Wet silk is allowed again but must stay opaque (v1 went
# see-through when it was unregulated). A conditions list keeps hard days
# from drawing "ruined", which was where the broken mirrors and wrecked
# stages came from. Unchanged house rules: a grown woman leads whenever
# people are in frame, nobody is a child, glamour is suggestive and never
# explicit, no gore, no artist, film, studio, star or brand names, no
# lettering, and outfit examples live in allure only, two of them.
#
# v4 after sweep pr-masala-v3 (smooth and cool, no cheese, but): letting rain
# darken her silk made two of eight frames see-through (a wet white shirt, a
# wet cream slip), so cloth is dry, opaque and never white or pale again; the
# jewel-colour list in the suffix put 5/8 women in the same teal-green sari,
# so the list is gone and her clothes avoid the night's blue-green; and 7/8
# were a woman at a window or rail with her back turned, looking out at the
# lit bay, so that image is demoted by name, most space lines no longer look
# out over the sea, and she may face the viewer.
[masala.world]
era = "Bombay in 1976, a modern island city on the Arabian Sea, rich and easy at the top: hotel terraces and supper clubs, sea-face apartment blocks in Art Deco cream, hill bungalows with deep verandas, film studios in the northern suburbs, yacht moorings under the stone gateway on the harbour, and quiet smugglers' coves up the coast. Technology is unhurried and handsome: a round-backed black-and-yellow taxi with the rain on its chrome, a long imported convertible, a record player in a teak cabinet, a reel-to-reel in a recording room, a trunk call booked through the exchange, an air-conditioned lounge where the windows fog."
materials = "Silk and chiffon first, then brass, polished teak, marble, wet black basalt and rain on glass, then jasmine, cut crystal, mother-of-pearl, cane furniture, Mangalore roof tile, sea water and lamplight, and last a little gold."
physics = "An ordinary city in heavy sea air: rain arrives off the sea in grey sheets and stops as suddenly, wet stone holds every lamp twice, and heat makes the far shore swim. Light comes from the sky and from lamps, neon, candles, a pool's underwater lights and the moon on the water; nothing glows of its own accord. Nobody here fights, faints or weeps in public; feeling shows in a look held a moment too long."
society = "Old money and new money: film people from stars to session musicians, hotel bands and their singers, shipping families, smugglers who run gold and watches in off dhows and dress better than the customs men, journalists, models for the film magazines, Koli fishing families on the shore, Irani café owners, neighbours of every community and language, all dressed as 1970s city people. Days here are a swim at the sea-face pool, a long lunch, a matinée, a drive along the bay with the roof down, a card evening on a terrace, a party that moves to the beach at two in the morning, as much as a deal at the jetty or a recording session."
weather = "The whole coast in its seasons: the monsoon arriving as a grey wall over the sea, warm rain on a veranda, the clear washed light after a storm, a hazy white noon, a violet dusk over the bay, a humid night of lamps and still water, a cool clear winter evening with smoke on the air. Pick what the day calls for."
inhabitants = "Grown women at the centre, each with her own face, complexion and build: singers, film stars, models, smuggler queens, a shipping heiress, a jazz pianist, a radio announcer, a fish trader who owns three boats; the men round them, in wide collars and safari suits, as bandleaders, boatmen, admirers and rivals; crows on a balcony rail, pigeons under the gateway, a pair of greyhounds on a terrace, egrets on the mudflats. Nobody in this world is a child. They are as often swimming, dancing, idling or asleep in the afternoon as at work."
strangeness = "The strange is quiet and expensive: something precious lying where it should not be, the sea or the rain in a place it cannot reach, a light from the wrong direction. People glance at it, light a cigarette and go on talking."
numinous = "The sacred is part of the city's evening: a white shrine on the water reached by a causeway at low tide, oil lamps floated on the sea at a festival, a hilltop church where people leave wax shapes of what they want healed, a jasmine garland on a taxi's dashboard, a tall clay idol walked down to the sea by a crowd of grown men and women. Painted in the same smooth glow as everything else, never an aura or a beam."
dread = "This world at its darkest is quiet and close: a launch running without lights across black water, a customs searchlight sweeping the cove, a car waiting with its engine running under a streetlamp, a storm warning flag over hauled-up boats, a door left open on an empty suite. Risk and secrecy, never violence, bodies, injuries or tears, and the frame does not take sides."
favoured_actors = "Grown women alone, in pairs or with one companion, at ease and in charge of the frame, busy with something: a singer sharing a cigarette with the bandleader between sets, a smuggler queen at the tiller of a dhow, a film star reading a script on a monsoon veranda, a swimmer climbing out of a pool, a pianist in a basement jazz club, two friends in the back of a taxi in the rain. A woman alone at a window or rail with her back turned, looking out at the lit bay, is this world's most worn image and is not the default. A hero in a bell-bottom suit fighting a room full of men is this genre's most worn image and is not used, and neither is a woman weeping, pleading or brooding, a dancer performing for a villain, or a giant face looming over a small figure."
myth = "The Ramayana and the Mahabharata as the city retells them, the Koli fishing people's sea goddess and the city's own goddess Mumbadevi, the Sufi saints' shrines on the water, the Parsi, Goan and Marathi festivals of the island's calendar, the smugglers' legends of the coast, and the Urdu love poetry of the film songs and the ghazal."
highlight = "The thing the eye finds first: one impossible thing, beautiful and cool, that nobody in the frame is upset about. Today's kind of wrongness is given with this definition. Painted in the same smooth gloss and soft light as everything else."
highlight_modes = [
  "something precious in a quantity or place no one could afford",
  "the sea or the monsoon somewhere indoors, behaving calmly",
  "light coming from somewhere it cannot come from",
  "two hours of the day in one frame",
  "a song or a scent made visible in the air",
]

[masala.brief]
signature = "SIGNATURE — at least one thing marks this as 1970s Bombay, named explicitly: a black-and-yellow taxi, the curve of the bay with its lamps, a sea-face apartment block in Art Deco cream, the stone gateway on the harbour, a dhow with a lateen sail, or a 1970s supper club with a band. It may be the highlight or the actor. A frame that could be any Indian city of today, or a costume fantasy of palaces and the distant past, is a failed response."
cool = "COOL — the frame is calm, languid and self-possessed, a place the viewer would want to be. The lead is in the place today's space line names and doing what the verbs say; a woman standing at a window or terrace rail looking out at the bay with her back turned is a failed response. Everyone in it is composed: no crying, shouting, pleading, swooning, fighting, gun-pointing or clutching, no bruises, wounds, tears or handprints, no shattered glass or ruined rooms. All figures share one consistent scale and perspective, as through a single camera; no giant face, bust or object looms over smaller figures. A frame that reads as a melodrama or soap-opera climax, or that uses a two-scale film-poster layout, is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly beautiful grown woman in her twenties or thirties with her own face, sensual and sure of herself, in what a glamorous Bombay woman of 1976 would really wear for this place and hour, Western clothes as often as Indian (for example a chiffon sari worn low at the waist with a sleeveless blouse, or bell-bottoms with a halter top), in a strong colour of her own and never the blue-green of the night, with bare shoulders, back or midriff, kohl-lined eyes and a knowing, unhurried look. Her clothes are dry and fully opaque, in solid cloth that holds its colour, never white, cream or pale, never wet or clinging; rain beads on skin, glass and stone, not on her clothes. She is at ease and never in distress, as likely to meet the viewer's eye as to be absorbed in what she is doing. If the actor named below is a man, paint a woman in the same role instead; men may appear beside her, never as the lead. Never nudity, never a see-through garment, never a sexual act. A frame whose lead figure is a man, or a frame of plain, faceless or costume-party figures, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, takes this temper in the world's cool register (unease, risk, secrecy, a storm on the way; never injury, rage or grief on a face): {wonderTone}"

