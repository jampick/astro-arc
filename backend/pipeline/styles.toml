"bodily and anatomical" = "The body as bait and as evidence: a bare shoulder in the sun, a sunburnt neck, a lipstick mark on a glass, a bruise under dark glasses. Blood is a small dark shape, never gore."
"fungal and decaying" = "Decay as the boom gone bad: a model home with the paint peeling, a dead grove left standing, a gas station closed since the highway moved."
"animal and creaturely" = "Creatures of the coast and the desert: a coyote at the edge of the headlights, a lizard on hot stucco, gulls over the beach, a lapdog on a satin cushion."
"geological" = "The dry ground: a sandstone canyon, a dry wash, the brown hills before the rain, the bluffs above the beach."
"metallic and ore" = "Metal of money and murder: a chrome bumper, a gold cigarette case, a compact mirror, a room key on its tag."
"glass and ceramic" = "Glass that sees and breaks: a highball glass sweating on a bar, dark glasses, a windshield, a plate-glass window over the street."
"architectural" = "The built West of 1955: a strip of motel rooms under a neon sign, a stucco bungalow court, a mission-revival train depot, a cocktail lounge with a cantilevered roof."
"domestic interior" = "The rented room: a bed with a chenille spread, a ceiling fan, slatted blinds, a telephone on the nightstand, a suitcase half packed."
"mechanical" = "Machines of the getaway: a two-tone sedan, a convertible, a jukebox, a pay phone."
"industrial and infrastructural" = "What the boom runs on: oil derricks and pumps, a refinery's tanks, an aqueduct through the desert, a railway yard, a new freeway half built."
"agricultural and cultivated" = "The groves and ranches: a citrus grove in dusty rows, a packing house, a date palm farm, a smudge pot between the trees."
"aquatic" = "Water as luxury and as grave: the motel pool, the surf under the pier, a reservoir, a sprinkler on a lawn."
"atmospheric" = "California air: heat haze, the Santa Ana, ocean fog, smog over the basin, cigarette smoke in a closed room."
"glacial and frozen" = "Cold as luxury and as alibi: ice in a cocktail shaker, a meat locker, a cold desert night, snow on the far mountains seen from a hot street."
"fire and ember" = "Fire as cover-up and as threat: a brush fire on the hills, a car burning in a wash, a lighter held to a letter, a match struck in the dark."
"textile and fiber" = "Clothes as bait and disguise: a halter dress, a swimsuit, a sheath dress, a fur stole in the heat, seamed stockings, a man's hat left behind."
"ritual object" = "Faith and luck: a rosary on a dashboard, a mission bell, a lucky silver dollar, a pair of dice kept from a winning night."
"paper and inscription" = "Papers that hang a man: an insurance policy, a guest register, a love letter, a photograph torn in half. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Time and luck measured: a portable radio, a wristwatch, a gas pump's dial, a phone's rotary face, a stopwatch at the racetrack rail."

[paperback]
label = "Paperback Noir"
suffix_base = "The cover art fills the frame edge to edge, seen flat and straight on, with no book, hands, table or margins around it and no blank title area. It is a 1950s crime paperback cover painting in gouache as printed on cheap cover stock: loose, confident, unfinished strokes with chalky matte edges, figures cropped big in the foreground and modelled in a few broad planes, backgrounds left sketchy and washed out, deep masses of cast shadow. A fine offset halftone shows in skin and sky, and the colour is slightly flattened by the press. Hard California light: white sun with short black shadows, or at night a single sign, headlights or a porch bulb. A muted ground of bleached bone, sage, faded denim blue and dust grey, broken by one hot colour (lipstick red or neon pink) used in a single place. The cover coating is cracked white along one vertical crease and rubbed through at the corners, the paper tone yellowed toward one edge, with a few foxing spots. Not photographic, not clean airbrushed advertising art, not digital and not 3D-shaded. No text, title or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties, thirties or forties, painted as a 1950s cover femme fatale with a knowing look that can turn dangerous, in 1950s clothes cut to show her off and chosen for where she is and what she is doing, each woman with an individual face, hair colour, build and outfit of her own, dark-haired as often as fair; men are hard-faced in rumpled suits and hats, often half turned away. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals."
