[giallo.registers]
"botanical" = "Plants of the villa and the florist: a lakeside garden of cypress and oleander, a hothouse of orchids, a wreath delivered with no name on it. Its highlight: flowers arranged as a message."
"bodily and anatomical" = "The body as glamour and as target: a bare back in an evening gown, loose hair on a shoulder, an eye at a keyhole, a hand on a door handle from the far side. Danger is shown, never a wound and never gore."
