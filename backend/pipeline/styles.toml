  "down a candlelit corridor of the castle to a door standing open at the end",
  "from the coaching inn's lit taproom out through the window to the dark forest road",
  "across the graveyard between leaning stones to the church door",
  "down the crypt steps past stone coffins to a single torch",
  "along a ballroom of dancers under chandeliers to a tall figure at the far end",
  "through the laboratory's retorts and coils to a shape under a sheet",
  "along a fog-filled forest road where the coach lamps shrink into the trees",
  "from a bedchamber's open window over the village roofs to the pass",
]

# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# European spy-film world of 1966 as its posters painted it: the Riviera and
# its corniche roads, Alpine cable cars and ski chalets, a casino town, yachts
# in the bay, the ferries of Istanbul and a villain's lair inside a volcano on
# an island. A grown woman agent with a small pistol is at the centre of the
# action, dressed for wherever the action is. Painted as a glossy gouache
# film poster on a steep diagonal, with flat pop-art colour blocks, print
# grain and fold lines. Menace and action, never gore. Glamour is
# film-poster sensual, never explicit, and every woman is a grown adult.
# Kept apart from [giallo] (1971, coloured gels, suspense indoors, a killer
# nobody sees) by sunlight, open air, speed and gadgets: no gels and no
# stalking. Kept apart from [atomic] by menace and action, and from the beach
# styles by the yacht, the casino and the gun. The man in evening dress at
# the card table and the woman aiming straight out at the viewer are demoted.
# The sea is one setting among five, so the bay of yachts is capped; outfits
# follow the situation instead of a list; the sky and the colour blocks
# never set the colour of her clothes; sunset and a full moon are not
# defaults. No artist, film, studio, actor, character, brand or car-maker
# names, since whatever a charter names turns up.
#
# REVISION 2, 2026-10-13 (after sweep pr-eurospy, 8/8, no refusals): Stage
# 1.5 took "a woman crossing a ferry deck" from favoured_actors, so all eight
# frames were on a ferry, and the allure line's "short trench on the ferry"
# put a trench coat on seven of eight. The ferry left favoured_actors, the
# trench left the outfit list and a coat is ruled out except in snow. All
# eight women were the same wavy brunette, so suffix_figures now changes hair
# colour and cut; only one frame showed the pop-art colour blocks, so the
# suffix gives them a fifth of the picture.
[eurospy.world]
era = "Europe in 1966 at the height of the spy craze, richer, faster and more glamorous than it ever was: the Riviera coast and its cliff roads, a casino town on the sea, Alpine resorts with cable cars and chalets, the ferries and waterfront palaces of Istanbul, and somewhere offshore a volcanic island the maps leave blank. Technology runs a little ahead of the year: sports cars with hidden tricks, a cigarette case that is a camera, a wristwatch with a wire inside, a lipstick that transmits, a monorail inside a mountain, and everybody treats the gadgets as perfectly normal."
materials = "Sun-hot lacquered car paint, chrome, white yacht hulls and snow first, then sequins, silk jersey, quilted nylon ski wear, black rubber wetsuit, polished brass, green baize, smoked glass, poured concrete and riveted steel of the lair, volcanic rock, terracotta roof tile and the blue sea."
physics = "The sun is strong and the shadows are hard. Things move fast: cars leave the road, skiers leave the ground, speedboats leave the water, and everyone lands. A gadget does exactly one surprising thing. Nothing glows of its own accord except the lair's machines, a laser beam and the lava under the island. A shot is a flash and a puff of smoke, a fall is a figure in the air, and nobody is ever shown wounded."
society = "Agents of rival services who know each other by sight, defectors, double agents, a scientist with a formula, a countess who owns half the coast, croupiers, ski instructors, yacht crews, ferry captains, chauffeurs, and the villain's men in matching jumpsuits. Days here are long lunches on a terrace, a swim off the yacht, après-ski by the fire, a night at the tables, a drive along the coast with the top down and dancing on a hotel roof as much as the mission."
weather = "The whole range: hard noon sun on the coast, a mistral whipping the bay white, snow falling on a chalet, a blizzard closing a mountain pass, fog over the Bosphorus at dawn, a summer storm over the island, a clear cold night above the snowline. Pick what the day calls for; a sunset is not the default."
inhabitants = "Grown women at the centre, in their late twenties to forties, each with her own face, build and hair: agents of both sides, a defector, a scientist, a countess, a croupier, a photographer, a ski instructor, a yacht captain, a smuggler; the men around them, rival agents, the villain whose face stays half hidden, chauffeurs, croupiers and henchmen in matching jumpsuits; gulls, a borzoi on a yacht deck, Alpine choughs, dolphins off the bow, a falcon on a glove; and the old ghosts of the casino and the mountain. Everyone in this world is a grown adult. They are as often swimming, dancing, skiing for fun or asleep in the sun as on the job."
strangeness = "The strange is engineered: a swimming pool that slides open to a rocket, a painting with a camera behind its eyes, a car that sprouts something it should not. People raise an eyebrow, light a cigarette and keep going."
numinous = "The sacred has a body: a whitewashed chapel on a cliff above the corniche, a wooden crucifix at an Alpine pass hung with snow, the great domes across the water in Istanbul, an icon in an island chapel the villain's men walk past. Painted in the same glossy gouache as everything else, never a beam or an aura."
dread = "This world at its darkest is the trap closing: a cable car stopped over the gorge with a man on its roof, a car going over the cliff edge, a time bomb under the baccarat table, a yacht burning in the bay, the lair's doors sliding shut, a henchman's rifle in the snow. Menace and action and what is left after, never a wound and never gore, and the frame does not take sides."
favoured_actors = "A grown woman agent in the thick of it, alone or with one other person, cropped big and filling much of the frame: a woman leaping from a speedboat to a yacht ladder, a woman skiing down a run with henchmen behind her, a woman at the wheel of an open sports car on the cliff road, a woman climbing out of the sea with a small pistol, a woman slipping through the lair's corridors. Where she is follows the day, and no one setting or vehicle is hers. Rival agents, the villain, croupiers and henchmen round her out. A man in evening dress at the card table is this genre's most worn image and should not be the default, and neither is a woman aiming her pistol straight out of the frame at the viewer."
myth = "Cold War legend (the defector, the stolen formula, the agent who comes in from the cold), Odysseus and the island of Circe, Faust's bargain, the gambler's ruin and the run of luck, the Alpine legends of avalanches and smugglers, the long intrigue of Byzantium and the Ottoman court, and the modern fear of the bomb and the man who would hold the world to ransom."
highlight = "The thing the eye finds first: the instant of action at its peak, or the gadget, the trap or the double-cross that turns the scene. Today's kind of wrongness is given with this definition. Painted in the same glossy gouache as everything else."
highlight_modes = [
  "an ordinary object that is secretly a weapon or a device",
  "a figure caught in mid-air between two moving things",
  "a machine in the lair doing something machines should not do",
  "a familiar face on the wrong side",
  "a trap a moment from springing that only one person has noticed",
]

[eurospy.brief]
signature = "SIGNATURE — at least one thing marks this as the European spy world of 1966, named explicitly: a woman agent with a small pistol, an open sports car on a cliff road above the sea, an Alpine cable car on its wire, a casino terrace, a white motor yacht, a ferry on the Bosphorus, or the steel and rock of a lair inside a volcano. It may be the highlight or the actor. Use no more than one sea-and-yacht element per frame, and a bay full of yachts is not the default backdrop: the Alps, the casino town, Istanbul and the lair are as likely as the coast. A frame that could be any modern action film, a 1970s thriller lit by coloured gels, or a beach party is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly glamorous grown woman agent, in clothes that fit where she is and what she is doing and still show skin: a bikini or a wet swimsuit at the sea or the pool, a ski suit unzipped low on the snow, a backless or plunging evening gown at the casino, a close-fitting catsuit with a zip open at the throat in the lair or on a night job, a sleeveless shift and a headscarf in the open car, a sundress cut low at the back in town. No coat over any of it unless she is in the snow. Bare shoulders, back or legs in every frame, even in work clothes. She carries a small pistol, held low or at her thigh, or in a holster at her stocking top under an evening gown, never pointed at the viewer. Her look is aimed at someone or something in the scene, in a pose of action, nerve, pursuit or ease rather than one held for the viewer. Her hair is her own and changes with the day: a bob, a long fall, a high backcombed set, wet and slicked back, cropped short, under a ski hat. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Never nudity and never a sexual act; she is never bound or held, and no weapon touches her. A frame whose lead figure is a man, a frame where she is fully covered with no skin showing, or a frame of plain or faceless figures is a failed response."
action = "ACTION — the main line of the frame is a steep diagonal: a ski run, a cable car's wire, a road falling to the sea, a boat's wake, a body in a leap, a car heeling into a bend. A level, static, centred composition is a failed response."
menace = "MENACE — danger is shown by what is about to happen or has just happened: a gun in a henchman's hand, a fuse, a car in the air, smoke over the water. A wound, blood on skin or gore is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global lo and mid lines let night fall back on a full moon and
# mid fall back on a sunset; this world's nights are lit by its own lights
# and its days by a sun that is high or slanting, not setting.
[eurospy.light]
lo = "Night lit by the scene's own lights: casino windows spilling onto a terrace, a yacht lit along its rail, headlights on a mountain road, floodlights on a ski run, the red light of the lair's machines. The sky is deep flat night blue with no moon in it, and at least half the frame is dark. A rain-slick neon street, a moonlit sea, or a frame washed in one coloured gel is a failed response."
mid = "Morning or afternoon sun, snow glare or a bright interior, from one clear direction, with lit areas and hard shadows both substantial. A sunset, a sun on the horizon or an orange and pink sky is a failed response."

