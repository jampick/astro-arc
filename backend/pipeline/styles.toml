[backglass.registers]
"botanical" = "The desert's few plants and the casino's false ones: sagebrush and rabbitbrush along the highway, a plastic palm in a casino lobby. Its highlight: something blooming where nothing should."
"bodily and anatomical" = "The body as show and as stake: a dancer's long legs, a bare back in a low-cut gown, a fighter's split brow. Never gore."
"fungal and decaying" = "Decay as what the boom left behind: a shut-down wedding chapel with its windows boarded, a ghost town's collapsed hotel, a rusted ore cart in the weeds."
"animal and creaturely" = "Animals of the high desert and the town: white pelicans on the lake, a coyote at the edge of the parking lot, a jackrabbit in the headlights."
"geological" = "The ground under the glitter: white rock towers in a desert lake, a red canyon wall, the silver mine's tailings on the hill."
"metallic and ore" = "Silver and chrome: a chrome bumper, a bucket of nickels, the hood ornament of a convertible, a rodeo buckle."
"glass and ceramic" = "Glass that light comes through: a marquee bulb, a cut-glass ashtray, a mirrored ceiling over the tables, a neon tube bent into a shape."
"architectural" = "The town built for a weekend: casino fronts of bulbs, a wedding chapel, a motel sign of arrows and bulbs, the arena on fight night."
"domestic interior" = "Rooms by the night: a dressing room of mirrors and bulbs, a high roller's suite with the curtains open on the lights, a motel room with the door open on the snow."
"mechanical" = "Machines of chance and speed: a wheel of fortune, a keno board, a jukebox, a convertible's engine."
"industrial and infrastructural" = "Roads and their furniture: the interstate east into the desert, a railway crossing downtown, a truck stop, power lines over the sagebrush."
"agricultural and cultivated" = "The ranch country around the town: a cattle ranch, an alfalfa field under a pivot, sheep on the hills, a dude ranch for the divorcées."
"aquatic" = "Water as the desert's luxury: a motel pool, the river through downtown, the desert lake."
"atmospheric" = "Desert and casino air: cigarette smoke under the lamps, a dust storm on the highway, heat shimmer, a thunderhead over the hills."
"glacial and frozen" = "Winter in the high desert: snow on the Sierra, icicles off a marquee, frost on a windshield at dawn."
"fire and ember" = "Fire as show and as ruin: a flaming dessert in the showroom, a burning sign, a cigarette ember, a campfire out in the desert."
"textile and fiber" = "Costume as armour and bait: rhinestones, ostrich plumes, fishnet stockings, a satin robe, a fighter's trunks."
"ritual object" = "Charms and sacraments of luck: a rabbit's foot, a silver dollar worn as a pendant, a rosary on a rear-view mirror."
"paper and inscription" = "Papers of the trade: a keno ticket, a fight card, a pawn ticket, a marriage licence. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and the odds: a revue band's brass, a roulette wheel, a ringside bell."

[backglass]
label = "Backglass"
suffix_base = "A late-1970s pinball backglass: a picture screen-printed in reverse on glass and lit from behind, the printed picture alone, cropped inside the glass edge to edge. No score windows, no digits, no game title or logo, no flippers or playfield. Flat, opaque areas of saturated ink with bold black keylines and coarse halftone dots in skin and sky. The light comes through the picture rather than falling on it, so the colours glow like a lit transparency, the ink translucent where it is thin, hottest in soft uneven pools where hidden bulbs sit and dimmer between them, with no visible bulbs, lens flare or light circles. A palette of cherry red, hot pink, tangerine, lemon yellow, electric blue and turquoise against black ink. Toward the edges the paint has flaked and lifted in small crazed patches, letting bare glass and raw light through, and the glass carries faint dust and a dull sheen, with nothing reflected in it. Not photographic, not oil on canvas and not digital. No text, numbers, title or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties to forties, a glamorous late-1970s pin-up knockout with a confident, knowing look, in late-1970s Reno clothes cut to show her off, each woman with an individual face, hair, build and outfit of her own chosen for the scene; men are kept to the side. She is posed for what she is doing (seated, mid-stride, leaning, at work), not turned away with her back to the viewer. On stage a showgirl wears a fully covered rhinestone costume or a sequinned leotard, never pasties or a bare chest; off stage she wears her own clothes for the place she is in, never the stage costume, plumes or headdress. Her skin is unmarked, with no bruises or cuts. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals. Figures have confident ink outlines and are lit from behind like everything else, with a rim of light round hair and shoulders."
space = [
  "down the main street under a bulb-studded arch with no lettering to the snowy mountains",
  "across the casino floor past the blackjack pits to the showroom stage",
  "from a hot-springs pool steaming in the snow to the casino towers",
  "along the interstate out of town across the sagebrush flats to the far mountains",
  "from ringside across the lit ring to the crowd in the dark",
  "over the river bridge to the lit downtown at night",
  "from the alkali shore across the desert lake to a bare ridge",
  "up the grade from the town's lights to the old mining town on the hill",
]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# Day of the Dead in Mexico, first painted as an ex-voto on tin (revisions
# 1 to 5, see drafts/muertos-before-noir.toml for that history).
#
# REVISION 6 "Muertos Noir", 2026-10-13, after user review of pr-muertos-v4:
# "cheezy, basic image, nothing sexy. skulls look like weak halloween
# decorations. lets get this noir, sexy, brooding, forbidden". The naive tin
# ex-voto read as folksy, and sugar skulls, papel picado and dressed
# skeletons read as party-store Halloween. The medium is now a hand-painted
# Mexican cinema poster of about 1950 (gouache and oil, hard chiaroscuro,
# one light source, marigold and blood red on black, worn paper, no
# lettering). The dead are no longer skeletons: they come back as they were
# at their best, pale, in evening clothes, known by calavera paint or the
# shadow they stand in. Sugar skulls, cut paper, bones as objects and
# skeleton figures are written out everywhere and named as a failure. The
# night is a cover for forbidden meetings, debts and guilt; remembrance
# stays, horror stays out, saints keep living faces and no death figure.
# Label changed from "Noche de Muertos" to "Muertos Noir" (key unchanged;
# Model.js label needs the same change at install).
# REVISION 7, after pr-muertos-noir (8/8, no refusals, $0.22; the pinned
# actor was a cabaret singer at a bar, so all eight frames were cantinas):
# a small skull on a bar ofrenda (frame 01) is now banned by size, the
# thin satin slip in five of eight frames is named as the worn gown, and
# cantina mentions are trimmed with most of her nights put elsewhere.
# Cross-charter flags not applied here: lowrider still has the "dead home for
# one night" mode and the skull-face procession, and calendario still has
# the altar of marigolds and candles for the dead.
[muertos.world]
era = "Mexico City and the Oaxaca valley around 1950, on the nights of the first and second of November when the dead come home: the capital's rain-slick avenues, cantinas, cabarets and walled cemeteries, and the village graveyards of the valley lit by candles. Technology is the candle, the kerosene lantern, the streetlamp, the radio in a back room, the taxi and the last trolley. People keep the old habits without comment, and a candle left burning in a window still means someone is expected."
materials = "Candle wax and marigold petals first, then black lace, wet satin and rain on stone, then mezcal in glass, copal smoke, wrought iron, whitewashed tombs, adobe walls and velvet curtains."
physics = "For this one night the road between the dead and the living is open. The dead come back as they looked at their best: pale, unhurried, dressed for an evening out, solid enough to take a hand or pour a drink, their faces finished in black and white calavera paint like the living who paint themselves to meet them. They cast no reflection and leave before dawn. There are no bare skeletons, no loose bones and no rot. Light comes only from candles, lanterns, streetlamps, a brazier or a lit doorway, one at a time, and nothing glows of its own accord. Nobody flies. It is always night."
society = "The city sits up with its dead in secret as much as in public: families keep vigil behind the cemetery wall, but lovers also use the night as cover, widows come to settle accounts, cabaret singers sing to a table nobody else can see, cantina keepers set out a glass for a man buried three years, gravediggers are paid to leave a gate unlocked and the cop on the beat knows better than to ask. The night is drink, music, secrets and promises kept late as much as it is prayer."
weather = "The whole range of an autumn night: rain on the cobbles and the tombs, a warm wet wind that bends every flame one way, fog lying on the canals, a thunderstorm over the volcanoes, a still cold sky after midnight, the last black hour before dawn when the dead must go. Pick what the day calls for, and it is always night. The moon appears only if the scene names it."
inhabitants = "Grown women at the centre, each with her own face: a widow with unfinished business, a cabaret singer, a mezcal smuggler, a rich man's wife slipping out for the night, a healer who talks to the dead, the lead among them in her twenties to forties and older women round her; men in pressed suits and hats, bandsmen, cantina keepers, a cop in a raincoat; the dead in their best evening clothes, men and women, pale and painted; hairless dogs at the cemetery gate, monarch butterflies, owls and black cats. Nobody in this world is a child. People are as often drinking, dancing, waiting or smoking in a doorway as praying."
strangeness = "The dead are expected. A man three years buried takes his old stool at the bar and nobody moves his glass; a widow's husband asks her to dance and she does not refuse. The living keep their voices low and let it happen."
numinous = "The sacred has a body and keeps its distance: the Virgin of Solitude in her black cloak worked with gold, carried through the rain in a candlelit procession; a saint's statue in a dark side chapel with candle stubs at its feet; the ofrenda with its photographs, its marigolds and its candles. The Virgin and every saint have a living woman's or man's painted face and hands, never a skull or bones, carry no scythe and stand no larger than life; no hooded figure of death appears in this world. Painted in the same oil and gouache as everything else and lit by the candles round them, never a beam or a glow."
dread = "This world at its darkest is guilt that comes home: a rival's grave and the woman who put him in it, a debt to the dead come due, a candle that tips and sets the ofrenda burning, a revolver on a cantina table, a knife drawn in a cabaret, a husband at the window who should not be there, a chair kept for someone who does not come. Menace and aftermath kept in shadow, never gore and never horror-film skeletons, and the frame does not take sides."
favoured_actors = "Beautiful grown women, alone or with one partner who may be living or dead, close enough to fill much of the frame and caught in one hard light: a woman meeting a dead lover at the cemetery wall at midnight, a singer in a cantina where the living and the dead drink together, a woman alone with the ofrenda in an empty house who is not alone, a woman at the back of a procession in the rain. Most of her nights are spent outside the cantina: at the cemetery, in a house, in the street, on a canal or in a chapel. Older women, bandsmen and the elegant dead round them out. A woman in full skull makeup staring straight at the viewer and a grinning skull close-up are this genre's most worn images and should not be the default; vary who she is, what she is doing and where."
myth = "The Mexica underworld of Mictlán with its nine levels and its river; Zapotec and Mixtec custom of the Oaxaca valley; Catholic All Saints and All Souls and the Virgin of Solitude; the ghosts of the roads and the weeping woman of the canals; the corrido and the bolero; and the Mexican cabaret melodrama of around 1950 with its fatal women, doomed men and debts that are always paid."
highlight = "The thing the eye finds first: the moment the living and the dead touch, tender, guilty or fatal, or a sign that the dead have already been here. Today's kind of wrongness is given with this definition. Painted in the same lush poster oil as everything else and caught in the scene's one light."
highlight_modes = [
  "a dead guest doing something only the living should",
  "an offering on the ofrenda already eaten, drunk or smoked",
  "the bone showing through a living face, in paint, shadow or a mirror",
  "someone in the scene who casts no reflection",
  "a photograph on the ofrenda whose sitter has stepped out of it",
  "a promise to the dead being kept, or broken, in secret",
]

[muertos.brief]
signature = "SIGNATURE — at least one thing marks this as the Night of the Dead in Mexico around 1950, named explicitly: marigold petals on a path, a grave or a floor, a candlelit ofrenda or cemetery, calavera paint worn as makeup on a living or a dead face, or one of the pale, elegant dead among the living. It may be the highlight or the actor. Skulls of any kind or size (sugar, ornamental, carved or a small one tucked among the offerings), skeleton figures, bones as objects, cut or tissue-paper flags (hung or laid on a table) and party decorations do not count and must not appear. A frame that could be a Halloween scene, a horror picture or any Mexican street on an ordinary night is a failed response."
allure = "ALLURE — whenever people are in frame, the central figure is a living grown woman, an adult in her twenties to forties, painted with noir glamour and lit by the scene's one hard light, in a pose of waiting, meeting, drinking, dancing or slipping away rather than one held for the viewer, with a knowing look at someone in the scene or back over her shoulder. Her dress is cut to show her off and follows who she is tonight: low at the neckline or open to the waist at the back, bare shoulders, a slit to the thigh, satin or lace clinging in the rain, a lace mantilla slipping back off her hair; black is common but not the rule, and a gown of blood red, marigold or a deep jewel colour is as likely. When she wears calavera paint it is sculpted, glamorous makeup over her own face, smoky and precise and often on only half of it, never a cartoon, a mask or a plumed hat. Her gown is her own and not a uniform: a thin-strapped satin slip is the worn image and should not be the default, and velvet, lace, crepe, beaded silk, a tailored evening suit or a rain-soaked cotton dress are as likely. If the actor named below is a man, paint a woman in the same role instead. Never nudity and never a sexual act. A frame whose lead figure is a man or a skeleton, or a frame of plain, faceless or covered-up figures, is a failed response."
remembrance = "REMEMBRANCE — the dead in frame are loved and missed, elegant and at ease: pale, dressed for the evening, half in shadow or known by the paint on their faces. A frame with bare skeletons, decorative skulls, rotting bodies, gore, demons or the dead as monsters is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global high band is full daylight, which is Calendario's world and
# not this one. Every band stays night and keeps one hard source; exposure only
# changes how much of the frame that source reaches.
[muertos.light]
lo = "Deep night. One small flame picks out a face, a shoulder and a hand, and everything else falls into black. A frame with daylight, a lit sky or even fill light is a failed response."
mid = "One hard light source, a lantern, a streetlamp through rain or a lit doorway, thrown from one side: about half the frame is black shadow, smoke or wet dark. A frame in daylight or evenly lit is a failed response."
hi = "A wall of candles, a bonfire or a cabaret stage light, warm and hard from one side, with the night still black behind it. Daylight, dawn colour or a blue sky is a failed response."

