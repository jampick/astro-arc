# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Rome
# and Lake Como in 1971 as the Italian thrillers of the period painted them on
# their posters: fashion houses, villas, galleries and piazzas, a killer
# nobody sees whole, and a fashionable woman in danger at the centre, lit by
# one saturated primary gel. Menace and aftermath, never gore. Glamour is
# film-poster sensual, never explicit, and every woman is a grown adult: the
# genre's boarding schools and children are written out of this world on
# purpose (and left unnamed, since a named thing turns up). The gloved hand
# raising a blade in close-up is demoted. The famous Scotch is a
# yellow-labelled bottle in the signature only, never a brand. No artist,
# film or studio names.
#
# REVISION 2, 2026-10-13 (after sweep pr-giallo, 8/8, no refusals): six of
# eight women wore green because "emerald" in the gel list was being read as
# a dress colour, so the gel colours now light the room and her clothes take
# a colour of their own. Seven of eight frames were lake villas with the lake
# in the window and Rome never appeared, so the signature, the space array
# and favoured_actors now lean on Rome and the lake is one place among
# several. Stage 2 named a couture house once, so labels are ruled out.
#
# REVISION 1, 2026-10-13 (review before first sweep): undress and threat are
# kept apart (no baths anywhere; ALLURE says she is dressed for the street
# when a killer or blade is in frame, never bound or held, and the threat
# stays off her body); weather has no default and rain is one verb per
# process array; Scotch, the glove, the fountain, mannequins, the enlarged
# photograph and the darkroom each live in one field; the outfit menu became
# a principle; GEL ties red to hard days and green or blue to soft days; the
# surface was rewritten around the gouache locandina so it stops overlapping
# backglass, cabaret and kowloon; the killer clause left suffix_figures;
# "kid" gloves and "nobody is a child" are gone, so no age word reaches the
# prompt.
[giallo.world]
era = "Rome and Lake Como in 1971, richer and more dangerous than they ever really were: fashion houses and photographers' studios, art galleries, modernist villas and crumbling old ones on the lake, a hotel by the station and the lake steamer. Technology is the rotary telephone, the reel-to-reel tape, the camera with a long lens, the photograph enlarged until it shows what the eye missed, and the sports car, and everybody trusts the evidence more than they should."
materials = "Silk, lamé, patent leather and fur first, then smoked glass, chrome, white marble and travertine, op-art wallpaper, velvet curtains, cobbles, lake water and cut crystal."
physics = "Colour behaves like weather: a room is lit by one saturated primary, red, green or blue, from a lamp with a coloured shade, stained glass or a theatre gel, and the colour changes from room to room without explanation. Nothing else glows of its own accord. The killer is never seen whole, only a hand, a hat brim, the hem of a dark coat or a shadow on a wall. Doors open by themselves and blades glint, but no wound is ever shown: danger is told by a scream, a fallen glass or a sudden change of light, never by blood."
society = "Fashion designers and their models, photographers, gallery owners, a titled family on the lake with debts and secrets, a tired police inspector, a crime reporter, a medium, a foreign writer in town for the season and the servants who see everything. Days here are fittings and shoots, gallery openings, cocktail parties, séances, nights at a jazz club, drives along the lake, long lunches and boat trips as much as the investigation."
weather = "The whole range: a thunderstorm over the lake, rain on a piazza, fog on the water at dawn, a sirocco afternoon behind closed shutters, the white glare of a Roman August, a clear cold winter night. Pick what the day calls for."
inhabitants = "Grown women at the centre, each with her own face: a model, a designer, a gallery owner, a countess, a photographer, a jazz singer, a translator, a woman who saw something from her window; the men around them, lovers, husbands, an inspector, a photographer, a butler; the killer, never seen whole; a black cat, pigeons on a cornice, swans on the lake; and the dead a medium calls up. Everyone in this world is a grown adult. They are as often dressing, drinking, dancing, swimming or asleep as being followed."
strangeness = "The strange is the clue nobody can read: a painting that changed overnight, a tape with a dead woman's voice on it, a portrait turned to face the wall. People light a cigarette, pour a drink and go upstairs alone anyway."
numinous = "The sacred has a body and is in on it: a medium at a séance table, a church of candles with a saint's relic in a glass case, an Etruscan tomb under a villa, a priest who knows too much. Lit by the same coloured gels as everything else, never a beam or an aura."
dread = "This world at its darkest is the stalk and what is found after it: a woman alone in a flat as the lights go out, a door ajar onto a room lit the wrong colour, a shattered glass on the marble, a sheet over a shape on the lake shore under police lamps, a hat left on the stairs. Menace and aftermath, never a wound and never gore, and the frame does not take sides."
favoured_actors = "Fashionable grown women alone or in pairs, close enough to fill much of the frame: a model between shoots, a woman on the telephone in a lit window, a countess at a palazzo party, two friends in a sports car on a Roman street at night, a woman climbing an ochre stairwell as the lights go out, a swimmer at a villa pool. Inspectors, lovers, photographers, servants and the party crowd round them out. A hand raising a blade in close-up is this genre's most worn image and should not be the default, and neither is the same woman screaming in every frame."
myth = "Greek tragedy and its Furies, the Roman and Etruscan cult of the dead, Catholic saints, relics and the confessional, the Gothic novel, psychoanalysis and the return of the repressed, the yellow-covered crime paperback and its trick solution, and the old Italian stories of vendetta and inheritance."
highlight = "The thing the eye finds first: the moment a fashionable woman knows she is in danger, or the clue that gives the killer away, caught in one saturated light. Today's kind of wrongness is given with this definition. Painted in the same poster gouache as everything else."
highlight_modes = [
  "a detail in a painting or a mirror that should not be there",
  "a black glove or a blade left in plain sight among ordinary things",
  "a room lit a colour no lamp in it could give",
  "a mannequin or a statue standing where a person should be",
  "something out of place that says the killer was here first",
]

[giallo.brief]
signature = "SIGNATURE — at least one thing marks this as Rome or the lake in 1971, named explicitly: a woman in early-1970s fashion lit by a red, green or blue gel, a black leather glove, a Roman piazza with a fountain, an ochre palazzo stairwell, a white op-art flat in the new Roman suburbs, or a yellow-labelled bottle of Scotch on a sideboard. It may be the highlight or the actor. Rome is the usual setting and the lake is one place among several, so a lake or lake view is not the default backdrop. A frame that could be any modern thriller or any period costume drama is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly glamorous grown woman in early-1970s Italian fashion of her own, from couture to swimwear, cut to show her off, in a colour and fabric chosen for her and never matched to the colour of the light; no designer, label or brand is named: bare shoulders or back, a plunging neckline, and a look aimed at someone in the scene, or over her shoulder at the dark, rather than at the viewer, in a pose of nerve, ease, pursuit or flight. If the actor named below is a man, paint a woman in the same role instead. When the killer, a blade or a glove is in the frame she is dressed for the street or the evening, alert and acting, never in a slip, a towel or a bath; she is never bound, gagged, held or touched by a weapon, and the threat is kept at a distance from her body. Always clothed; never nudity and never a sexual act. A frame that combines undress with a threat, a frame where she stares out at the viewer, or a frame whose lead figure is a man, plain or faceless is a failed response."
gel = "GEL — one saturated primary light falls on the lead figure or the heart of the scene, and its colour fills at least a quarter of the frame; a second primary may answer it from the far side. On hard days the light is red; on soft days it is green or blue, never red. A soft-day frame lit red, or a frame lit only in white, warm or natural light, is a failed response."
menace = "MENACE — danger is shown by what is about to happen or has just happened: a glint, a shadow, a fallen glass, an open door. A wound, blood on skin or gore is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global hi line asks for even, natural daylight, which takes the
# gel away. Every band keeps one saturated primary; exposure only changes how
# much of the frame is black.
[giallo.light]
lo = "Night, a blackout or a shuttered room. At least two thirds of the frame is black, and the rest is lit by one saturated primary from a lamp with a coloured shade, stained glass or a theatre gel. A frame that is mostly lit, or lit in white or warm light, is a failed response."
mid = "Dusk, a storm or a lit interior in the evening: one saturated primary light from one side, with lit and black areas both substantial, and a second primary allowed on the far side. A frame in flat or natural-coloured light is a failed response."
hi = "Bright day, the white glare of a Roman street, an overcast lake or a white modern gallery, lit hard and clear; one saturated primary still owns at least a quarter of the frame as coloured glass, a gelled lamp, a painted wall or a lacquered car. A frame in natural colour alone is a failed response."

