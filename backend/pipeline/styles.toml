# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the black
# velvet paintings of Tahiti from the 1940s and 50s, as Edgar Leeteg made them
# and the tiki bars hung them: everything comes out of black, lit warm from one
# side, and the people in it are beautiful. Their glamour is kept at the level
# of the reference prompt (bare shoulders, a pareu, partly draped, never
# explicit). People are individuals, never a type.
[velvet.world]
era = "Tahiti and the islands around it between about 1940 and 1955: Papeete with its wharf, copra schooners and a few battered cars, and beyond it villages of thatched houses, reefs and lagoons. Technology is the outrigger canoe, the fishing spear, the hurricane lamp, the ukulele and the steamer that comes once a month."
materials = "Warm skin, black water and wet basalt first, then palm thatch, pandanus matting, carved wood, tapa cloth, printed cotton pareu, shell, flowers and fruit. Every surface either catches the one warm light or sinks into black."
physics = "Light comes from one side only: a fire, a lamp, a low moon or the last of a sunset. Skin, petals and wet things take that light so strongly they look lit from within; nothing else glows, and anything turned away from the light dissolves into the black."
society = "Fishermen, copra cutters, market women, dancers, drummers, pastors, Chinese shopkeepers, sailors and the odd European beachcomber. Days here are feasts, dances, canoe races, Sunday church, songs on the porch and nights of fishing by torchlight as much as work."
weather = "The whole range of the dark hours: a full moon on a still lagoon, a red sunset sinking into the sea, a hot night under black palms, a squall coming in off the reef, a hurricane night with the lamps blown out. The sky is black velvet or the end of a sunset, never day. Pick what the day calls for."
inhabitants = "Tahitian men, women, children and elders of every age, each with their own face, plus sailors and beachcombers; reef fish, turtles, frigate birds, crabs, dogs and pigs; carved ancestral figures; and the tupapa'u, the spirits of the dead who walk at night. They are as often singing, eating or asleep as at work."
strangeness = "The spirits are part of the night like the surf: people leave a lamp burning against them and go on talking. Nobody is surprised."
numinous = "The sacred has a body of wood, stone and flesh: a carved tiki on a stone marae platform, a tupapa'u standing just outside the lamplight, a moon that seems to watch the lagoon. It is painted in the same velvet dark and warm glow as everything else, never as a beam or an aura."
dread = "This world at its darkest is the hurricane night, a capsized canoe in black water, a schooner breaking on the reef, a lamp guttering out with a tupapa'u at the door. Painted with the same calm warm glazes as a feast, and the frame does not take sides."
favoured_actors = "Beautiful young island women, alone or in pairs, close enough to fill much of the frame: a woman with a tiare behind her ear, a woman spearing fish by torchlight, two sisters paddling a canoe, a dancer by the fire. Men, elders, children and reef creatures can share the frame, never as the subject. The same half-length girl facing the viewer in every frame is the worn version; vary the pose, the setting and who she is."
myth = "Polynesian tradition: Maui and his deeds, Hina who went to live in the moon, Tangaroa of the sea, Oro and the arioi, the voyaging canoes and star navigation; and the paradise the South Seas became in the stories of sailors, missionaries and painters."
highlight = "The thing the eye finds first: something caught warm and brilliant out of the black velvet. Today's kind of wrongness is given with this definition. Painted in the same glazes as everything else."
highlight_modes = [
  "a carved figure that seems to be watching someone in the scene",
  "a light falling from a source that is not in the frame",
  "a flower or fruit brighter than its light allows",
  "the sea lit from beneath by something unseen",
  "a shadow that does not belong to what casts it",
]

[velvet.brief]
signature = "SIGNATURE — at least one thing marks this as the islands, named explicitly: a carved tiki, an outrigger canoe, a tiare or hibiscus flower worn in the hair, a thatched house on the shore or palm fronds against the dark. It may be the highlight or the actor. A scene that could be any tropical beach or any night landscape is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly good-looking young island woman painted with this genre's glamour: bare shoulders and arms, a printed pareu, flowers in her hair, skin glowing in the warm light, in a pose of ease, work or dance rather than one held for the viewer. If the actor named below is a man, paint a woman in the same role instead. Always partly draped; never full nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, fully clothed or faceless figures, is a failed response."
velvet = "VELVET — the black of the velvet is the largest area of the frame, and the lit subject comes out of it from one side. A frame where the background is a lit sky, a landscape in daylight or any colour but near-black is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global lines put the high-exposure band in full daylight, which
# black velvet cannot hold. Every band stays mostly dark; exposure only changes
# how bright and wide the one light is.
[velvet.light]
lo = "Deep night. At least three quarters of the frame is black, lit only by a lamp, a fire or a thin moon from one side. A frame with any evenly lit area is a failed response."
mid = "Moonlight or firelight: one warm light from one side, with at least two thirds of the frame black. A frame in flat light is a failed response."
hi = "A blazing sunset, a full moon or a bonfire: one strong warm light raking across the scene, with at least half the frame still black. Daylight or a lit blue sky is a failed response."

