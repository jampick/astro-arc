[shinjuku.registers]
"botanical" = "Green squeezed into the concrete: a potted morning glory on a bar's step, weeds through the tracks. Its highlight: a flower worn or left as a message."
"bodily and anatomical" = "The body as nerve and history: a bandaged knuckle, a scar along a jaw."
"fungal and decaying" = "Decay as the old city going under: a shuttered cinema, a bar boarded up after a raid."
"animal and creaturely" = "Animals that live off the city night: a stray dog trailing the bikes, a festival goldfish in a plastic bag."
"geological" = "Stone and grit underfoot: the riverbank gravel and the concrete embankment."
"metallic and ore" = "Steel kept close: a straight razor, a coiled bike chain."
"glass and ceramic" = "Glass of the bar and the fight: a beer bottle swung by the neck, the mirror behind the bar."
"architectural" = "1972 Shinjuku built cheap and fast: the clan office over a shop, the new towers rising on the west side."
"domestic interior" = "The rooms behind the bars: a tatami flat over a shop, a gang's hideout full of posters and bikes."
"mechanical" = "Machines of noise: a jukebox lit from inside, a bowling alley's pin-setter."
"industrial and infrastructural" = "The city's hard bones: the elevated expressway, a freight yard at night."
"agricultural and cultivated" = "The country beyond the last train stop: rice paddies past the city's edge, a farm truck of watermelons stuck in city traffic."
"aquatic" = "Water as getaway: the canal, the sea at the end of a long ride."
"atmospheric" = "City air: smoke hanging in a bar, exhaust off a pack of bikes."
"glacial and frozen" = "Winter in the city: ice in a highball glass, breath steaming at a bus stop."
"fire and ember" = "Fire as payback and as warmth: a burning motorbike, a bonfire on waste ground."
"textile and fiber" = "Clothes as armour and as colours: a long leather coat, a summer kimono."
"ritual object" = "Luck and loyalty made into things: a sworn sister's cup, a fortune slip tied to a branch."
"paper and inscription" = "Papers of the street: a gang's challenge letter, a wanted notice. Writing appears as marks, never a readable word."
"instrument and measure" = "Music and the hustle: an electric guitar on a club stage, flower cards and dice."

[shinjuku]
label = "Shinjuku 1972"
suffix_base = "A 1970s Japanese exploitation film poster: the lead figures painted in flat poster colour with hard black shadow, never photographic; around them, cut-out fragments of black-and-white film stills of crowds, bikes and street signs, printed in coarse halftone in a single red ink, with white paper showing along their scissor-cut edges, pasted in at skewed angles. A hard red tint washes across large parts of the frame, over the walls, the street and the shadow sides of the figures; the scene and its cut-outs run to the top edge, with no empty band of flat colour above them. Printed in two inks, black and red, on white poster stock with a slight gloss, the paper white left bare in the highlights, with one acid colour used in a single place. Dramatic low angles, diagonal compositions and crowded edges. A printed poster, not a photograph and not digital. No text, title, kanji or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties with an adult face and figure, painted with this poster genre's tough glamour, in 1972 clothes cut to show them off, bare shoulders, plunging necklines and short hems, each woman with an individual face, hair, build and outfit of her own; men are hard-faced, in dark suits. Glamour is film-poster sensual and suggestive, never explicit, with no exposed breasts or genitals."
