actor_soft.work = ["picking fruit from", "grading ore", "stitching", "repainting the stripes on", "coiling cable", "herding", "fuelling"]
actor_soft.rest = ["dozing beside", "eating on the ledge of", "lying back on", "sharing a flask with"]
actor_soft.play = ["tossing a ball in low gravity", "flying a kite off the edge of", "swimming in the falls of", "playing cards on"]
