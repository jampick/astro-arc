[floating.registers]
"botanical" = "Plants kept for pleasure and for poison: a potted plum by a window, iris in a lacquer vase, a willow at the gate. Its highlight: a flower that is also a weapon."
"bodily and anatomical" = "The body as currency and as weapon: the bare nape above a collar, a hand inside a sleeve, a tattoo on a gambler's back. Blood is at most a thin red line, never gore."
"fungal and decaying" = "Decay as debt come due: a house gone to ruin after a scandal, a moat gone green, a mouldering letter, a grave nobody tends."
"animal and creaturely" = "Animals of the night quarter: a black cat on the tiles, carp in the moat, a caged songbird, a crow at dawn."
"geological" = "Stone as the quarter's floor and its markers: wet paving under the lanterns, a boundary stone at the gate, a garden rock in a courtyard."
"metallic and ore" = "Metal kept small and hidden: a hairpin sharpened to a point, a coin purse, a blade in a fan, a bronze mirror."
"glass and ceramic" = "Ceramic and glass of the party and the poisoning: sake flasks and cups, a blue-and-white bowl, a rare Dutch glass, a cracked teacup."
"architectural" = "The walled quarter: the great gate, the moat, the lattice fronts of the houses, the upstairs rooms with screens slid open on the street."
"domestic interior" = "The upstairs room: folding screens, tatami, a lacquer pipe tray, a mirror stand, a quilt laid out, one lamp."
"mechanical" = "The quarter's few machines: an abacus, a clockwork doll that serves tea, a lock on the moneybox, a pulley at the well."
"industrial and infrastructural" = "What feeds the quarter: the river boats that bring patrons, the bridge to the gate, the well, the night-soil carts, the storehouses of the owners."
"agricultural and cultivated" = "The country the women came from: rice fields just past the wall, a farmhouse they were sold out of, a crop paid as debt."
"aquatic" = "Water as escape and as grave: the moat, the river at night, a bath, rain running off the eaves."
"atmospheric" = "The quarter's air: pipe smoke, incense, steam from the baths, river fog, the haze of a hot night."
"glacial and frozen" = "Winter in the quarter: snow on black tile, ice on the moat, breath in lantern light, a woman in a snow-dusted cloak."
"fire and ember" = "Fire as light and as ruin: lanterns, a brazier, a charcoal pipe ember, a teahouse burning, fireworks over the river."
"textile and fiber" = "Silk as armour and bait: a kimono slipping from a shoulder, an obi loosened at the back, a sleeve hiding a blade, an oiled paper umbrella in the rain."
"ritual object" = "The sacred and the superstitious: a love charm, a votive tablet, a straw curse doll nailed to a tree, a mirror kept covered."
"paper and inscription" = "Papers that bind and betray: a contract of debt, a love letter, a lantern with a house's mark. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and money: a shamisen, a koto, a hand drum, an abacus, a set of dice in a cup."

[floating]
label = "Crimson Edo"
suffix_base = "A painted 1970s Japanese period-revenge film poster: the lead figures in near-photographic gouache with hard black shadow, smaller painted figures and fragments of the scene massed behind and around them at different scales, overlapping like a collage, all in one painted surface. One hard key light from a lantern, the moon or lightning, raking from the side; whatever turns from it falls into solid black. A palette of crimson, ink black and snow white, with one muted second colour carried by her clothes. Rain as long slanting white streaks, snow as white flecks, a crimson glaze over walls and shadows; the scene fills the frame to the top edge. Printed on poster stock with film grain, a little ink bleed, worn corners and the creases of a folded poster. Dramatic low angles and diagonal compositions. Not photographic and not digital. No text, title, kanji, credits or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties with an adult face and figure, painted with this poster genre's dangerous glamour, in a loose silk kimono slipping from a shoulder or open at the collar, bare shoulders, back or a leg through the robe, hair coming down or wet, a knowing level look, each woman with an individual face, hair, build and kimono colour of her own; men are hard-faced swordsmen and patrons in dark kimono, often half in shadow. Glamour is film-poster sensual and suggestive, never explicit, with no exposed breasts or genitals, and danger never shows a wound."
