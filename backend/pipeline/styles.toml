[lowrider]
label = "Lowrider"
suffix_base = "An airbrushed candy-paint mural on the hood or trunk lid of a late-1970s lowrider, seen close from a slight three-quarter angle: the scene is painted across the sheet metal in smooth airbrush gradients, soft overspray edges and crisp masked lines, under a deep wet clearcoat full of fine metalflake that sparkles wherever light falls. The image bends slightly over the hood's swell and its raised centre ridge, the clearcoat pooling in a long soft highlight along the crown; along one or two edges the panel's rolled lip, a panel gap and a sliver of chrome are visible, with the bodywork dropping away out of focus, and thin tapered hand-laid pinstripes frame the picture, sometimes with a stepped Aztec border. Candy colours over a base that suits the scene, midnight black, pearl white, silver or gold flake, glowing like stained glass where they are laid over a metallic base, with faint reflections of whatever light the scene holds sliding across the gloss. The painted scene is airbrush illustration, not photographic and not digital. No text, lettering, plaques or club names."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties, painted in the glamour manner of 1970s hood murals and van art, with smooth airbrushed skin and a confident, knowing look, late-1970s hair feathered, curled or piled high, and clothes cut to show her off; her clothes are 1979 clothes, never a feathered costume; each woman has an individual face, skin tone, build, makeup and outfit of her own, never a type or a costume. Men are drawn as individuals too, in the clothes of their day. The Virgin and any saint are painted robed and with reverence, as on a home altar, never as glamour figures; the glamour belongs only to living women. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals. People are painted with affection, never caricatured."
space = [
  "down a boulevard of cruising cars and storefront neon to the hills under a white sky",
  "from a backyard garage door across the yard and the clothesline to the freeway on its pillars",
  "down the concrete river channel under its bridges to the downtown towers",
  "across a park car show of raised hoods to the palm trees and the mountains",
  "through a banquet hall's open doors across the dance floor to the band",
  "from a hilltop street over the rooftops and the freeway interchange to the city lights",
  "along a row of parked cars at a burger stand to the traffic on the boulevard",
  "under a freeway overpass past painted pillars to a mural on a project wall",
]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Shinjuku
# in 1972 as a 1970s Japanese exploitation film poster, painted figures in a
# two-ink black and red print with halftone film-still collage. Women's gangs
# run the night against each other and the clans. Floating Noir's grandchild
# 170 years on.
#
# Revised 2026-10-13 after review. The working name was "sukeban", a Japanese
# word for a schoolgirl gang boss. Stage 2 receives the label as style_label
# (llm_pipeline.py load_style_info), and the key is its fallback, so both are
# now "shinjuku" / "Shinjuku 1972" and the old word lives only in this comment
# and the file name. Use label "Shinjuku 1972" for the Model.js dropdown entry.
# "Shinjuku Razor" was the other suggestion; it would send a weapon to Stage 2
# on every run, which the review itself was trying to stop, so it was not used.
#
# House rules: the lead figure is a woman (as [velvet] ALLURE and [floating]
# suffix_figures), every woman is stated as a grown adult, and "Nobody in this
# world is a child" closes inhabitants as in [floating]. No school object is
# named anywhere a model reads. Glamour is film-poster sensuality, never
# nudity; the one bathhouse mention is a woman on its steps in a robe.
# Violence is menace and aftermath, and the cut is named once, in physics.
# No light table: the global night, raking and full-day lines hold, and the
# RED rule says the red is ink, not a sunset. No artist, film or studio names.
#
# Revised after sweep pr-sukeban (v1): Stage 2 picked "gang queen" with her
# hands in her jacket pockets in 6 of 8 frames, and every frame had an empty
# band of flat red sky across the top. favoured_actors now leads with women
# busy at something and names the jacket-and-pockets pose as the worn image;
# ALLURE stops offering biker leather first; RED and suffix_base keep the red
# on walls and shadow sides with the sky carrying weather.
#
# Cross-style note: giallo's metallic register also has a straight razor.
# The review keeps it here, so giallo's draft needs its razor swapped out.
[shinjuku.world]
era = "Shinjuku in 1972, hotter and meaner than it ever really was: Kabukicho's neon blocks, a warren of tiny bars under the railway arches, go-go clubs and bowling alleys, and the first skyscrapers going up on the west side over it all. Women's gangs hold the streets against each other and against the clans. Technology is big motorbikes, pink public phones and transistor radios, and all of it is loud, cheap and a little dangerous."
materials = "Pachinko steel and chrome, enamel signboards, corrugated iron and soot-black brick first, then leather, denim, wet asphalt, concrete, paper lanterns and beer glass."
physics = "Nerve is a law of nature: a woman walks into a rival gang's bar and the room goes quiet, a motorbike takes a flight of steps and lands running, a fight is over before the onlookers have turned round. Light comes from the sun and sky by day, and at night from neon, headlights, bare bulbs and the occasional police lamp; nothing glows of its own accord. Violence is menace and aftermath: a blade held still, a cut shown as a thin flat red line, never gore."
society = "The street runs on territory and loyalty: rival women's gangs with their own colours and codes, the clan bosses who own the halls and the bars, their men, a bar mistress who knows everything, and cops who can be bought. Days here are bowling, dancing at the go-go club, the batting cages, the summer festival, the boat races and long rides out of the city as much as the rumble."
weather = "The whole city sky: rain on neon at three in the morning, a white-hot summer noon, a typhoon emptying the streets, a smoggy dusk behind the new towers, a sticky night with paper lanterns lit, a first snow, grey dawn over the tracks. Pick what the day calls for."
inhabitants = "Grown women in their twenties and thirties at the centre: gang queens and their lieutenants, bike riders, bar hostesses, a card dealer, a club singer and a woman just out of prison, each with her own face, build, hairstyle and reason to be here; the clan men, a drunk salaryman and a fortune-teller, and against them all the rival gangs and the bosses. Crows on the wires, pigeons at the station and the restless dead of the old pleasure quarter round them out. They work in the bars, factories and dance halls, and are as often bowling, singing, eating or asleep in a booth as fighting. Nobody in this world is a child."
strangeness = "The strange is film-poster excess nobody questions: a gang that appears out of the rain all at once, a stare that stops a fight. People order another drink and say nothing."
numinous = "The sacred has a body: a fox shrine squeezed between two bars, a lucky charm hung from a bike's mirror, a dead gang sister standing in the line where she always stood. Painted in the same red and black as everything else, never a beam or an aura."
dread = "This world at its darkest is the betrayal and its aftermath: a rumble under an iron bridge, a woman cornered in a dead-end alley by a whole rival gang, the clan's men waiting in the office, a gang jacket left on the gravel, a motorbike on its side in the shallows with its headlight still on, a bar's shutter pulled down with the rival gang's mark chalked on it. Menace held still like a poster, never gore, and the frame does not take sides."
favoured_actors = "Striking grown women alone, in pairs or in a gang, close enough to fill much of the frame and busy with something: a club singer in a backless dress at the microphone, a hostess on her break on a fire escape with her shoes off, two riders on a motorbike at a crossing, a card dealer leaning over the table, a woman on the bathhouse steps in a cotton robe with wet hair and a tattoo showing at the shoulder, a bar mistress pouring for the clan, a gang facing another gang across a street. Clan men and bar crowds round them out. The gang boss is one of these women, not all of them: a woman in a jacket standing with her hands in her pockets is this genre's most worn image and should not be the default, and neither is a lone woman facing the viewer with a weapon raised."
myth = "The clan code of duty and feeling and the wandering gambler's tale, the vengeful woman of the ghost plays, sworn-sisterhood oaths, enka and street ballads of heartbreak and prison, the loyal retainers who waited years for their revenge; and the femmes fatales of the old pleasure quarter, 170 years back."
highlight = "The thing the eye finds first: a stare-down held a second too long, or a moment of nerve the whole street stops to watch. Today's kind of wrongness is given with this definition. Painted and tinted the same as everything else."
highlight_modes = [
  "a razor caught at the instant before it moves",
  "a whole crowd of rivals stopped dead",
  "a tattoo that seems to move on the skin",
  "every ball in a pachinko hall rolling uphill",
  "a dead gang sister keeping her place in the line",
]

[shinjuku.brief]
signature = "SIGNATURE — at least one thing marks this as the 1972 Shinjuku of the women's gangs, named explicitly: a pachinko hall's wall of machines, a bar wedged under the railway arches, a big four-cylinder motorbike, or a gang's emblem stitched on a jacket back. It may be the highlight or the actor. A frame that could be any modern Tokyo, or any 1970s city, is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a striking grown woman painted with this poster genre's glamour, dressed for what she is doing today, from a halter top and hot pants to a backless bar dress, a slip under an open coat or a summer kimono loose at the shoulder; a black leather jacket is one outfit among many, never the uniform. She has a hard, knowing look, in a pose of nerve, menace or ease rather than one held for the viewer. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Always dressed; never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, faceless figures, is a failed response."
adults = "ADULTS — every woman in frame is a grown adult in her twenties or thirties, with an adult face and build, a working woman with a job, a lease and debts of her own. A figure who reads younger than twenty is a failed response."
red = "RED — a hard red tint lies across at least a third of the frame, over walls, the street or the shadow sides of the figures, with black and the halftone cut-outs breaking it. The red is the poster's ink, not the hour: it lies over walls and shadow sides at any time of day, and the sky, where it shows, holds the day's weather printed in the red and black inks, never an empty band of flat red across the top of the frame. A sunset sky used to supply the red, or a frame in even natural colour, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

