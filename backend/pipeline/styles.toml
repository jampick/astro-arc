[almeria.registers]
"botanical" = "The desert's few plants and what they mean: prickly pear along a wall, an agave spike against the sky, an olive tree in a mission yard. Its highlight: a plant that is the only shade for miles."
"bodily and anatomical" = "The body as nerve and heat: sweat on a collarbone, a squint against the glare, a hand hovering at a holster, a dusty bare shoulder. Never a wound in close-up and never gore."
"fungal and decaying" = "Decay as the desert dries it: a wagon bleached to grey boards, a ghost town's sagging balconies, a mission roof fallen in. Dry and sunlit, never damp."
"animal and creaturely" = "Animals of the dry country: a horse lathered from the ride, a mule under a load, vultures on a fence, a scorpion on a boot."
"geological" = "The ground itself: eroded grey-ochre gullies, a dry riverbed of white stones, a canyon where the trail narrows, a rock outcrop over the town."
"metallic and ore" = "Metal that kills or pays: gold bars in a strongbox, cartridge brass on a belt, a revolver's cylinder, a sheriff's star dropped in the dirt."
"glass and ceramic" = "The cantina's and the house's things: bottles on a shelf, a clay water jar sweating in the shade, a broken mirror, painted tiles on a fountain."
"architectural" = "The built frontier: a whitewashed adobe street with a bell tower, a cantina with a balcony, a mission with a cracked bell, a walled ranch yard, a station house by a water tower."
"domestic interior" = "Inside thick adobe walls where the light comes in slices: a cantina's back room with a card table, a bedroom with shutters half closed, a kitchen with chillies hanging, a jail cell."
"mechanical" = "The few machines out here: a steam locomotive taking water, a Gatling gun on a wagon, a windmill pump, a pocket watch that plays a tune."
"industrial and infrastructural" = "Railway and mine: a water tower on stilts, a single track to the horizon, a mine head with ore carts, a telegraph line with one wire down."
"agricultural and cultivated" = "Dry farming: a threshing floor of beaten earth, an olive grove, a corral of horses, a well with a bucket on a rope."
"aquatic" = "Water as the thing worth fighting for: a horse trough in the plaza, a river shrunk to pools, a well, a cloudburst flooding the riverbed."
"atmospheric" = "Desert air: heat haze over the badlands, dust blowing down the street, a dust storm closing in, gun smoke hanging in a doorway."
"glacial and frozen" = "Cold as the desert keeps it: a frost on the stones at dawn, a cold night at the campfire, snow on the far sierra. Rare and brief."
"fire and ember" = "Fire as signal and threat: a campfire in the riverbed, a burning ranch house, a lit dynamite fuse, a cigar end in the dark."
"textile and fiber" = "Cloth as the frontier wears it: a worn poncho, a bandolier, a lace mantilla, a saddle blanket. Each is one choice among many, never everyone's outfit."
"ritual object" = "The sacred and the superstitious: a rosary hung on a gun, a candle in a wall niche, a wooden grave cross with a hat on it, a holy medal."
"paper and inscription" = "Papers that put a price on someone: a nailed-up reward notice with only a drawn face on it, a treasure map, a letter, a deed to the land. Writing appears as marks, never a readable word."
"instrument and measure" = "Music and timing: a guitar, a trumpet from the bell tower, a pocket watch, a compass, a telegraph key."

[almeria]
label = "Almería Western"
suffix_base = "A 1960s Italian western film poster painting, the picture alone filling the frame edge to edge with no border, margin or title panel: faces and figures painted big and close in confident tempera with hard edges, the landscape behind them small and flat, lit by a hard white sun, or at night by one campfire or lantern, with black shadows laid as solid masses. A dusty palette of ochre, sand, bone white and sun-bleached sky, with black and one blood-orange used in a single place. Printed on cheap matte poster paper: coarse halftone dots visible in the darks, colour a little off-register at the edges, the sheet worn soft, folded into eighths with whitened crease lines and a small tear at one corner. Not photographic, not glossy, not airbrushed and not digital. No text, title, credits or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties, thirties or forties, painted as a frontier outlaw with a hard, knowing look, sun-browned skin shining with sweat and dust, dressed for what she is doing in clothes cut to show her off, each woman with an individual face, colouring, build, hair and outfit of her own; Mexican and Spanish people are painted as individuals, never in costume; men are stubbled and squinting, often half in shadow under a hat brim. Glamour is film-poster sensual and suggestive, never explicit, with no exposed breasts or genitals."
