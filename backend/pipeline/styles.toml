[eurospy.registers]
"botanical" = "Gardens of the rich and the hidden: bougainvillea on a villa wall, umbrella pines over the cliff road, a hothouse inside the lair. Its highlight: a flower or plant that hides a device."
"bodily and anatomical" = "The body as the agent's tool: a bare back at the casino, a hand on a hidden holster, a diver's shoulders breaking the surface. Danger is shown, never a wound and never gore."
"fungal and decaying" = "Decay behind the glamour: a casino's shut-up wing, a wrecked seaplane on the rocks, an old fort the villain bought, rust bleeding down a lair's steel."
"animal and creaturely" = "Animals of the rich and the wild: a borzoi on a villa lawn, a falcon on a glove, gulls over the harbour, ibex on a ridge above the pass."
"geological" = "Rock of the coast, the mountain and the island: limestone cliffs over the sea, a glacier's blue ice, the black rock and steam of the volcano."
"metallic and ore" = "Metal that does something: chrome on a sports car, a gold lighter, a small pistol, the riveted doors of the lair."
"glass and ceramic" = "Glass of the high life and the trap: a champagne coupe, a casino chandelier, a cable car's windows, the domed control room glass, a two-way mirror."
"architectural" = "Five places: a white villa or grand hotel on the coast, an Alpine chalet or summit station, a casino with a terrace, a waterfront palace or ferry pier in Istanbul, the concrete halls inside the volcano."
"domestic interior" = "The 1966 rich interior: a yacht's teak saloon, a chalet's fur rugs and open fire, a hotel suite with a sunken bath, a villa's white living room with a hidden panel."
"mechanical" = "Machines that chase and conceal: a sports car with hidden tricks, a speedboat, a cable car's gears, a mini-submarine, a rocket on its pad."
"industrial and infrastructural" = "The working world under the glamour: a dam high in the Alps, a ferry terminal, a harbour crane, an oil tanker, the lair's reactor room."
"agricultural and cultivated" = "The country behind the coast: lavender fields above the sea, a vineyard on terraces, an olive grove where a car hides, an Alpine dairy farm."
"aquatic" = "Water as a road and an escape: the bay, the strait, a mountain lake, a villa pool. Its highlight: something coming up from beneath."
"atmospheric" = "Air of the chase: spray off a speedboat, powder snow thrown up by skis, the mistral, smoke over the water, steam from the crater."
"glacial and frozen" = "The high Alps: a glacier, a frozen lake, an ice cave the villain uses, frost on a cable car window, a fur collar in the snow."
"fire and ember" = "Fire as signal and ruin: a chalet's fireplace, a speedboat burning in the bay, a flare over the sea, lava under the island, a lit fuse."
"textile and fiber" = "Clothes as part of the job: a sequinned gown that hides a holster, a quilted ski suit, a diving suit, a silk scarf blown off in the open car."
"ritual object" = "The sacred and the superstitious: a votive candle in a cliff chapel, a lucky chip, a saint's medal on a chain, an icon in an island chapel."
"paper and inscription" = "Papers worth killing for: the plans in a briefcase, a microfilm, a passport with the wrong name, a coded telegram. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Instruments of the trade: a radio set in a suitcase, a Geiger counter, a roulette wheel, a ship's compass, a countdown clock on the lair's console."

[eurospy]
label = "Eurospy"
suffix_base = "A painted 1966 European spy film poster in glossy gouache: crisp, confident figures and vehicles with bright hard highlights on skin, chrome and water, set on a bold steep diagonal with the action frozen at its peak. Behind and between the figures, big flat pop-art blocks of colour (tangerine, turquoise, magenta, lemon, cobalt) slash across the scene as hard-edged diagonal shapes covering at least a fifth of the picture, never a rectangle or a box. A high-key, full-colour palette in natural sunlit colour, with deep blue shadows. Slight print grain, one or two faint fold lines across the sheet. The picture fills the frame edge to edge: no border, no margin, no blank title panel. Not photographic and not digital. No text, title, credits or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman agent, a grown adult in her late twenties to forties, athletic and glamorous in mid-1960s clothes that suit the scene and show skin, in a colour of her own rather than the colour of the sky or the colour blocks, with an individual face and build; her hair colour and cut change from picture to picture (black, red, brown or blonde; bobbed, long, piled high or cropped), never the same wavy brunette by default; holding or wearing a small pistol; men are lean and dressed for the scene. Glamour is film-poster sensual and suggestive, never explicit, with no exposed breasts or genitals, and nobody is ever shown wounded."
space = [
  "down a cliff road of hairpin bends to a bay far below",
  "from a cable car hanging over a gorge down to a chalet in the snow",
  "across a casino terrace and up the lit streets of the town on the hill",
  "from a ferry's rail across the strait to domes on the far shore",
  "along a steel gantry inside the volcano to the launch pad below",
  "down a ski run past pine trees to a frozen lake",
  "from the lair's glass control room down to the crater lake",
  "through a villa's open glass wall to the pool and the sea",
]

# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# optimistic space opera of 1952 pulp science-fiction magazines, out among the
# planets: finned rockets, jungle moons, crystal cities, domed colonies, an old
# Martian canal city, bug-eyed monsters and robots. Painted as the cover art
# of a pulp magazine, saturated oil on board printed on rough pulp paper,
# slightly off register, with one browned and chipped edge. The marker is a
# space heroine at the centre of the cover with a ray gun in her hand; she is
# the hero of the story and never the monster's prize, so the monster carrying
# off a swooning woman is demoted. Glamour is pin-up and pulp-cover, never
# explicit, and every woman is a grown adult. Menace comes from monsters and
# robots; a ray blast leaves scorch and smoke, never gore.
# Kept apart from [atomic] (a post-bomb wasteland on Earth in ochre and mint)
# by being off Earth, never ruined by war and always hopeful; from [cosmic]
# (1970s floating islands, airbrushed, technology in hazard stripes) by its
# 1952 chrome, fins and brass, its oil-paint pulp surface and its people at
# the centre; from [frazetta] by ray guns and rockets, never swords, fur or
# sorcery; from the sibling [jungle] by alien jungle (violet, crimson and teal
# growth, monsters no Earth naturalist would name), never an Earth jungle or
# its animals; and from [paperback] by saturated colour all over rather than
# one hot colour on a bleached ground. A ringed planet is capped at one sky in
# four, and her outfit is never the sky's colour.
# Revised after sweep pr-planetpulp: a glass dome was in 8 of 8 frames, red
# Mars ground in 6, auburn pin-up waves in 6 and the ray gun named in only 1,
# so domes are cut back and capped, the red desert is capped, hair is varied
# away from auburn waves, and the ray gun must be named.
# Revised after sweep pr-planetpulp-v2 (tamer, a belted tunic in 4 of 8, alien
# glyphs carved on a machine): midriff or neckline on most days, tunic capped,
# glyphs and carved symbols ruled out in the suffix.
# Real pulp covers carry a masthead, cover lines and a price; this one
# carries none. No author, artist, magazine, film or studio names, since
# whatever a charter names turns up.
[planetpulp.world]
era = "The solar system of 1952 as the pulp magazines dreamed it: every planet has air, weather and somebody living on it, rockets with fins and portholes cross between them in days, and a colonist can buy a ray gun at the general store. Technology is chrome, brass, dials, vacuum tubes and big levers, built bold and bright, and everyone trusts it to get them home."
materials = "Polished chrome and gleaming brass first, then glossy enamel, riveted hull plate, curved glass domes, raw crystal, glistening alien foliage, red sand, ancient carved sandstone and a jewelled belt or two."
physics = "Most worlds have breathable air and a helmet is needed only on an airless moon or in open space. Gravity is lighter on small worlds, so leaps are long and falls are slow. Ray guns fire a visible beam of coloured light that leaves scorch, smoke and a molten edge; rocket exhaust flares, crystals and alien fungus give off their own glow, and nothing else does. A ray blast or a monster's grip is menace and aftermath, never gore."
society = "Frontier colonies, a space patrol stretched thin, prospectors and freight crews, scientists at remote stations, and the old native civilisations: a Martian canal city of nobles and merchants older than Earth's history, a crystal city whose people trade in light, tyrants with robot armies. Days here are landing parties and launch-day crowds, dances at the dome, canal-side markets, swims in alien lakes, card games on long voyages and parties at a nobleman's court as much as the fight."
weather = "The whole range of other worlds: a lemon-yellow noon on a desert planet, warm rain steaming off a jungle moon, a dust storm rolling over the dunes, a violet dusk with two small moons, a methane fog, an aurora over an ice world, a meteor shower, a black sky full of stars on an airless rock. A ringed planet hangs in the sky no more than one day in four; most skies show a different body, several small moons, a giant sun or no planet at all. A red desert under a warm sky is one world among many and no more than one day in three; jungle moons, ice worlds, alien seas, crystal fields, swamps and canal cities are as likely. Most frames are out in the open air of the world; a frame inside a glass dome or framed by its struts is no more than one day in four. Pick what the day calls for."
inhabitants = "Glamorous grown women at the centre, in their twenties, thirties and forties: a rocket pilot, a space patrol officer, a prospector, a scientist from a remote station, a smuggler captain, a Martian noblewoman of the canal city, a colony doctor, each with her own face and her own mission, and women of every background, since the future of 1952 belongs to everyone; around them square-jawed rocket jockeys, scientists in white coats, chrome robots both loyal and menacing, bug-eyed monsters, scaled and tentacled things, tall gaunt Martians and grazing beasts no one on Earth has seen. Nobody in this world is a child or a teenager. They are as often dancing, swimming, exploring or asleep in a hammock as fighting."
strangeness = "Wonder is everyday here: a robot pours the coffee, a flower turns to watch a stranger, a lizard the size of a bus pulls a barge. People admire it, holster the ray gun and carry on."
numinous = "The sacred has a body: a colossal stone head of a vanished race half buried in red sand, a sandstone temple lined with carved serpents, an idol of a monster god in a jungle clearing. Painted in the same thick oil and saturated colour as everything else, never a beam or an aura."
dread = "This world at its darkest is the invasion and the wreck: a colony's air lock blown open, a rocket on its side in the swamp, a robot army marching over the ridge, a monster's shadow across the camp, a ray gun with its charge spent. Lurid and bright like a cover, never gore, and the frame does not take sides."
favoured_actors = "A glamorous grown woman at the centre of the cover, alone, with her crew or with one man, close enough to fill much of the frame: a pilot climbing out of her hatch on a new world, an officer standing off a robot with her ray gun drawn, a prospector at the lip of a crystal cave, a noblewoman on the canal steps, two crewmates back to back against something in the fronds. Robots, monsters, rocket crews and colonists round them out. A bug-eyed monster carrying off a swooning woman in a torn gown is this genre's most worn image and must never be used; she is the hero, never the prize. Neither is the same woman facing the viewer under the same ringed planet in every frame."
myth = "Golden Age space opera, the planetary romance of a dying Mars of canals and a steaming Venus of swamps, the lost-race adventure, first contact and the friendly or murderous robot, the space patrol as the frontier cavalry, and the old sea-voyage tales of monsters at the edge of the map."
highlight = "The thing the eye finds first: a wonder of another world or a menace about to strike, caught at the peak of the adventure. Today's kind of wrongness is given with this definition. Painted as boldly and brightly as everything else."
highlight_modes = [
  "a monster or a robot looming over the scene, menace held at the moment before it strikes",
  "a machine of the far future doing something no machine should",
  "a ruin of a vanished race still working",
  "an alien plant or crystal that is alive and aware",
  "something from Earth turned up somewhere it could never have reached",
]

[planetpulp.brief]
signature = "SIGNATURE — at least one thing marks this as 1952 pulp space opera, named explicitly: a chrome rocket with tail fins and portholes, a crystal city, a canal city of carved sandstone, a ray gun, a fishbowl helmet, or a bug-eyed monster or a riveted robot. It may be the highlight or the actor. A frame that could be any modern space art, an Earth jungle, or a ruined Earth after the bomb is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a glamorous grown woman at the centre of the cover, the hero of the story with a chrome ray gun named in the scene and shown in her hand or at her hip, painted with pulp-cover glamour that shows skin: on most days, at least five days in eight, she shows a bare midriff or a plunging neckline (the brass top counts), with bare shoulders and long bare legs; a frame where only her legs are bare is the exception, not the habit. Her clothes fit where she is and what she is doing, and change from day to day: a glossy skin-tight spacesuit with a clear fishbowl helmet only on an airless moon or in open space, a brass-cupped bra top and a short metal-plated skirt in an alien city or at a court, a cut-away flight suit in the cockpit, a short belted tunic and high boots on patrol, a swimsuit at an alien lake, a jumpsuit unzipped to the waist over a halter for work on a hull. The brass top is one choice in several, not the default; a belted tunic is no more than one day in four; the same outfit frame after frame is a failed response, and her outfit is never the colour of the sky or the light. Her hair and face change too: auburn or red pin-up waves are the worn default and no more than one day in four; as often she is platinum blonde, black-haired, ash brown or silver, with a sleek bob, a short crop, a high ponytail or a long straight fall, and a face, age and build of her own. In a pose of action, defiance, wonder or ease rather than one held for the viewer, never fainting, never carried and never bound. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, fully covered or faceless figures, is a failed response."
colour = "COLOUR — saturated all over like a pulp cover: at least three strong colours (cadmium red, chrome yellow, ultramarine, viridian, magenta-violet) set against each other, with no bleached or muted ground. The sky is one colour family and her outfit and the rocket are others. A frame washed in one colour, or a dusty desert of ochre and rust under a pale sky, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[planetpulp.light]
lo = "Night on another world: light from a near moon or a planet in the sky, a city's crystal glow, a campfire or rocket exhaust, with the figure, the ground and the horizon all readable in saturated night colour (deep violet, teal, crimson). A frame that is mostly black, or an empty starfield, is a failed response."

