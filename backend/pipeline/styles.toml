"glass and ceramic" = "Glass as the stage for violence and style: a plate-glass window about to shatter, mirrored shades, a glitter ball."
"architectural" = "The 1970s city: tenements and brownstones, a soul club's marquee, a storefront church, an elevated railway over the street."
"domestic interior" = "The 1970s home and pad: shag carpet, wood panelling, a waterbed, a hi-fi console, a kitchen with a pot on the stove."
"mechanical" = "Machines of style and speed: a muscle car, a jukebox, a pinball machine, a motorcycle with long forks."
"industrial and infrastructural" = "The hard city: the docks, a warehouse, the subway, a freeway overpass, a junkyard of crushed cars."
"agricultural and cultivated" = "The South the city came from: a sharecropper's field, a family farm, a church picnic under pecan trees."
"aquatic" = "Water in the city: an open hydrant in a heat wave, rain on neon, a public pool, the river by the docks."
"atmospheric" = "City air: smog at dusk, steam from a manhole, cigarette smoke in a club, a heat haze over the asphalt."
"glacial and frozen" = "Winter in the city: snow on a muscle car, breath steaming outside a club, ice on the river."
"fire and ember" = "Fire as payback and as warmth: a car going up, a burning warehouse, a trash-can fire on a corner, candles on an altar."
