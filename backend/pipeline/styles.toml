# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Havana
# in 1957, the casino years, printed as a chromolithographed cigar-box label:
# a scene in a cartouche inside embossed gold borders with rosettes in the
# corners. The marker is a glamorous woman of 1957 standing in for the
# label's allegory by what she is doing, never a classical goddess in drapery
# or a gold statue. Glamour is the period's own commercial art (pin-up,
# cabaret, beach), never explicit, and every woman is a grown adult: the
# children who worked the tobacco fields and sold on the street are written
# out of this world on purpose. The women are Cuban women of many ancestries,
# each one an individual, and ancestry is never tied to role. The Virgin and
# the orishas are sacred: never the lead woman, never glamorous, and Afro-Cuban
# religion is never shown as revenge magic. Real labels carry lettering,
# banners and coin-headed medals; this one carries none. Gold belongs to the
# border; the scene inside is turquoise, blue, green and carmine. Tobacco, Old
# Havana and the sea are this style's own ground; the casino is pushed back
# so it does not repeat [backglass]. No artist, film, hotel or brand names,
# since whatever a charter names turns up. The gangster with a tommy gun is
# demoted.
#
# REVISED 2026-10-13 after sweep pr-havana: wet white slips went see-through
# (now opaque even when wet), the red sequined gown repeated in 5 of 8 frames
# (sequins dropped from materials, outfit rotation added), full moon capped.
#
# REVISED 2026-10-13 after review: allegory goddesses removed (nudity
# attractor), sacred figures fenced off from ALLURE, cigars cut back to the
# rollers and the fire and air registers, composition and colour counts added,
# medallions replaced with headless rosettes, surface rewritten as a flat
# print, sunset capped, the outfit menu cut, repeated nouns and verbs shared
# with sibling styles rewritten.
[havana.world]
era = "Havana in 1957, at the height of the casino years, richer and more dangerous than it ever really was: new hotel towers on the Vedado seafront built with money from the north, casinos lit like ocean liners, mambo clubs open to the stars, the arcades and iron balconies of Old Havana, the harbour and its fortress, and west of the city the tobacco valleys of Pinar del Río. Technology is the two-tone American car with fins, the big band and the jukebox, the roller's curved blade and the overnight ferry from Key West, and everyone treats all of it as if it were built for a party."
materials = "Warm skin, white linen, silk, tobacco leaf, pastel stucco and sea water first, then Spanish cedar and mahogany, chrome, marble, wrought iron, stucco peeling in the salt air and rum."
physics = "Luck is a force of nature here: a wheel stops where a glance told it to, a hand of cards turns on a whisper, and the sea knows when to come over the rocks. Light is sun, moon, neon, stage light, lightning over the Gulf or a struck match, and nothing glows of its own accord; the gold of the border is printed, never a source of light. Violence is quick and off to one side, a shape in a doorway or a car pulling away, never gore."
society = "The city runs on sugar, tobacco, tourists and the casino skim: hotel men from the north and their quiet partners, bandleaders, women of the floor show, cigar rollers at long benches while a reader reads them the news and novels aloud, dockers, police on the take, agitators with pamphlets, and in the eastern mountains a rebellion everyone talks about in low voices. Days here are beach days, baseball, carnival with its paper lanterns and congas in the street, Sunday mass, rumba in a tenement courtyard, long lunches and dancing until dawn as much as work."
weather = "The whole Caribbean sky: a white noon glare off the harbour, a hot night with the club roofs rolled back to the stars, a downpour that floods the street and stops in ten minutes, a winter norther throwing waves over the coast road, a hurricane coming up from the south, morning mist lying in the tobacco valleys, and now and then a pink sunset over the harbour mouth. Sunset or golden hour is no more than one day in four, and a full moon no more than one night in four (most nights are moonless, clouded or lit by the city); noon glare, night, storm and morning mist are as likely. Pick what the day calls for."
inhabitants = "Glamorous grown women at the centre: dancers, singers, croupiers, cigar rollers, a casino widow who now runs the room herself, a smuggler with her own boat, a card reader at a café table, a courier for the rebellion with a pistol in her handbag; their faces carry the island's many ancestries and each is an individual, never a type, and ancestry is never tied to role: any woman may own the room, roll leaf, sing or run the boat. Around them, men in white linen and dinner jackets, gangsters, bandleaders and drummers, tobacco farmers in straw hats, sailors and sunburnt tourists; frigate birds over the harbour, a parrot in a cage by the bar, a fighting fish in a bowl; and now and then a woman of 1957 who steps out of the label's gold border into the scene. Nobody in this world is a child. They are as often dancing, swimming, gambling or asleep in the afternoon heat as working."
strangeness = "The strange is luck and legend that nobody questions: a winning streak that empties the house's vault, a roulette ball that keeps spinning after the wheel stops, a singer whose last note holds off the rain over an open-air club. People order another round."
numinous = "The sacred has a body: an altar to the orishas dressed in their colours with fruit, candles and flowers, the Virgin of Charity in her shrine in her yellow mantle, sacred drums in a courtyard, a melon and molasses left at the sea's edge for the mother of the waters. Printed in the same stipple and colour as the scene, with gold belonging to the border only, never a beam or an aura; a holy figure is never a glamour figure, and the women near it are devotees dressed for church or ceremony."
dread = "This world at its darkest is the hit, the raid and the storm: a dropped hat and a spilled drink in a hotel corridor, a car burning on the coast road, men in suits at the counting-room door, police trucks outside a club at dawn, a hurricane surge in the harbour, a tobacco barn going up in the night. Menace and aftermath, never gore, and the frame does not take sides."
favoured_actors = "Glamorous grown women alone, in pairs or with a crowd behind them, close enough to fill much of the cartouche: a woman leaning over the gaming table to place her stake, a singer at the microphone with the band behind her, a dancer mid-turn on an open-air floor, a roller at her bench with a leaf across her knee, a woman at the wheel of a launch. Musicians, gamblers and tobacco farmers round them out. A gangster in a fedora with a tommy gun is this genre's most worn image and should not be the default, and neither is the same woman facing the viewer in every frame."
myth = "Afro-Cuban tradition and the tales of the orishas as Cuba keeps them, the Virgin of Charity and the three fishermen who found her floating in the bay, the tall tales of the tobacco country, the son, the bolero and the mambo with their songs of love and ruin, the gambler's luck and the gangster tale, and the allegories the old labels were full of, shown only as emblems (a wheel, a cornucopia, a laurel wreath), never as women."
highlight = "The thing the eye finds first: a turn of luck, a seduction or a legend caught at its most dazzling, as a label would make an allegory of it. Today's kind of wrongness is given with this definition. Printed in the same stipple and colour as the scene; gold belongs to the border only."
highlight_modes = [
  "a woman of 1957 stepping out of the gold border into the scene",
  "luck turning in plain sight",
  "the sea coming where it should not",
  "the night air taking a shape of its own",
  "an offering answered before anyone has left",
  "a glance that has just decided someone's fate",
]

[havana.brief]
signature = "SIGNATURE — at least one thing marks this as Havana in 1957, named explicitly: a bundle of cured tobacco leaf, Old Havana's iron balconies over a colonnade, a rollers' hall with the reader at his lectern, or the Malecón sea wall with spray over it. It may be the highlight or the actor. A frame that could be any tropical city or any 1950s nightclub is a failed response."
cartouche = "CARTOUCHE — the scene sits inside a cartouche framed by embossed gold borders, with gold rosettes or sunbursts in the corners, in the wide landscape format of an old inner-lid label. The cartouche may be oval, arched, shield-shaped or a pair of vignettes, and the lead woman is off centre or turned away in at least half the frames; a centred frontal portrait in a centred oval every day is a failed response. The gold frame takes no more than a quarter of the image and the scene inside carries the depth. Inside the cartouche at least half the colour is turquoise, blue, green or carmine; a scene washed gold or sepia is a failed response. A frame with no gold border, or one that is all border around a small scene, is a failed response. The label carries no words, numbers, monograms, banners or ribbons anywhere."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a glamorous grown woman standing in for the label's allegory by what she is doing, not by posing, in the period's own glamour of the cabaret, the beach and the dance floor, cut to show shoulders, back and legs, with a knowing, confident look, in a pose of work, dance, play or ease rather than one held for the viewer. Her clothes change with the day and her work (a halter swimsuit, a white linen sundress, a strapless cocktail dress, a backless evening gown, a roller's blouse with the sleeves rolled, a two-piece rumba costume), in any colour of the label's palette; a red sequined gown is not her default, and the same dress frame after frame is a failed response. She is a woman of 1957 in the period's own clothes, never a classical goddess in drapery or a gold-painted statue. A holy figure (the Virgin, an orisha) is never the lead woman and is never glamorous; when the sacred is in frame, the woman is a devotee beside it, dressed for church or ceremony, and her glamour is in her face and bearing only. If the actor named below is a man, paint a woman in the same role instead. Always dressed; never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, sexless or faceless figures, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

