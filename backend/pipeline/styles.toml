[frazetta.registers]
"botanical" = "Jungle and dark forest as an enemy and a hiding place: vines as thick as a body, a carnivorous flower in a temple courtyard. Its highlight: a plant that hunts."
"bodily and anatomical" = "The body as this world's great subject: muscle under strain, sweat-lit skin, a warrior's scars. Blood where the day calls for it, never mutilation."
"fungal and decaying" = "Rot as the mark of sorcery and age: a dead god's swamp, a ruined palace gone soft with moss and bones."
"animal and creaturely" = "Beasts at full strength and far larger than life: a war-cat, a giant serpent, a wolf pack in snow, a war-horse rearing."
"geological" = "Wild country as the painter's dark backdrop: crags against a storm, a cave mouth, a rocky hill crowned with the fallen."
"metallic and ore" = "Steel and gold as the age's two loves: a notched broadsword, a heaped treasure, a bronze helm, chains."
"glass and ceramic" = "Rare and decadent: a jewel the size of a fist in an idol's eye, wine jars in a palace, a sorcerer's crystal."
"architectural" = "Cyclopean ruins and decadent cities: a temple stair, a tower of black stone, a palace terrace over the sea."
"domestic interior" = "Throne rooms, taverns and tents opened onto the night: furs over a couch, a feast table, a window over a burning city."
"mechanical" = "The few machines of a savage age: a war chariot, a siege tower, a galley's oars, a trap in a temple."
"industrial and infrastructural" = "The great works of tyrants: a quarry worked by slaves, a city wall under siege, a bridge over a chasm."
"agricultural and cultivated" = "Settled land as something to defend or burn: a barbarian village's fields, a palace garden of strange fruit."
"aquatic" = "Water as danger: a swamp with something under it, a pirate galley in a storm, a sacred pool in a temple."
"atmospheric" = "The sky as the painting's drama: storm cloud boiling orange and violet, smoke from a burning city, a blood-red sun."
"glacial and frozen" = "The frozen north: a blizzard on a pass, warriors in furs, a frost giant's ice."
"fire and ember" = "Fire as battle and as sorcery: a burning city, torches in a cave, a sorcerer's brazier."
"textile and fiber" = "Fur, hide, silk and banners: a cloak of wolf pelt, a dancer's veils, a torn war banner."
"ritual object" = "The apparatus of dark worship: an altar stained dark, an idol, a sacrificial dagger, a skull cup."
"paper and inscription" = "Scrolls and carved tablets of forbidden lore, and runes on a stone or a blade. Writing appears as marks, never a readable sentence."
"instrument and measure" = "War horns, drums and the sorcerer's tools: a war horn sounding from a hill, a bronze astrolabe in a tower."

[frazetta]
label = "Barbarian Pulp"
suffix_base = "A dramatic oil painting in the manner of Frank Frazetta's 1960s and 1970s fantasy paperback covers: loose, energetic brushwork, forms modelled in strong warm light against deep, murky shadow that dissolves into dark umber and olive, with hot accents of orange, crimson and gold. Turbulent sky, smoke and mist painted wet into wet. A strong diagonal composition with much of the frame lost in darkness. Visible canvas texture, not digital or photographic. No text or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, heroic and sensual, with powerful anatomy and weight and tension in every limb, skin glowing warm against the dark, partly draped in fur, hide, silk or armour, painted with the same loose energy as everything else, never photographic."
