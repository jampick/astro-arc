# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# adventure world of the 1958 men's adventure magazines, in the modern day of
# 1958: river steamers, seaplanes, lost temple ruins, rope bridges, smugglers'
# camps, a crocodile river, an expedition camp at night and rival treasure
# hunters, painted as a lurid gouache magazine illustration printed on pulp
# paper, with the page's stapled gutter along one edge. The marker is a grown
# woman explorer or pilot at the centre of the danger, armed and never
# helpless, with an animal or a rival looming. Glamour is pin-up and
# suggestive (torn shirts, bare midriffs and legs, wet skin), never explicit,
# and every woman is a grown adult; nobody in this world is a child.
# The genre's "savage natives" are written out entirely: the country is a
# made-up one so no real people stands in for the jungle, local people are
# guides, pilots, scholars, traders and rivals with their own faces, and the
# menace comes from animals, the land and named villains, never a tribe or a
# crowd. The woman held helpless by a beast, or tied up waiting for rescue,
# is demoted out of existence. Violence is menace and aftermath, never gore.
# Kept apart from [frazetta] by the modern world (planes, guns, maps,
# radios), animals at their real size and no sorcery or monsters; from
# [velvet] by daylight and jungle green; from [smokeshow] by the tropics.
# Default sunsets and full moons are ruled out by the [light] lines, the
# outfit follows the situation so the khaki is not in every frame, and the
# palette's hot accents are kept off her clothes.
# Revised 2026-10-13 after sweep pr-jungle: the same dark wavy-haired woman in
# 8 of 8 frames (Stage 2 now names hair colour and cut), the knotted khaki in
# 7 of 8 (now for the trail only), a wet halter dress went see-through (wet
# means a swimsuit), and a full moon and two orange skies got through (each
# light line now makes Stage 2 name the sky). Stage 2 called her "young"
# twice; the allure line now forbids it.
# After sweep pr-jungle-v2 (fixed: no moon, no orange sky, nothing
# see-through, khaki down): copper red, the first hair colour in the list,
# took 7 of 8 frames, so the hair line became a principle with no menu.
# That last edit is unswept. No artist, magazine, film
# or brand names, since whatever a charter names turns up.
[jungle.world]
era = "A made-up tropical river country in 1958, the country of the adventure magazines rather than any one real nation: a brown river a mile wide winding up from a mangrove coast to mountain gorges, a river town of tin roofs with a customs house, a hotel bar and a grass airstrip, and inland cloud forest, limestone cliffs and the overgrown ruins of a forgotten city. Technology is war surplus and hard used: the seaplane, the twin-engine transport on a grass strip, the paddle steamer, the outboard canoe, the jeep, the shortwave radio, the flare pistol, the rifle and the folding camera, and none of it can be trusted to start twice."
materials = "Sweat-dark khaki, wet skin, river mud and rope first, then canvas, oiled gun steel and machete edges, the aluminium of a seaplane's floats, mossy cut stone, brass, mosquito netting, tin roofing, kerosene and a little gold."
physics = "The world of 1958 with the heat turned up: no magic, no monsters and nothing supernatural. Animals are real species at their real size; the painting makes them loom by angle and closeness, never by scale. Heat and wet are a presence: steam off the river, sweat on every face, rain that comes down like a wall. Light comes from the sun, the green gloom under the canopy, lightning, a campfire, a kerosene lantern or a flare, and nothing glows of its own accord. Guns, planes and boats behave as they really did; a shot is a flat flash and a puff of smoke, and an injury is a torn sleeve and a bandage, never gore."
society = "A frontier of chancers and specialists: expeditions with permits and expeditions without, bush pilots who fly anything for cash, river traders, customs men open to an offer, a museum in the capital that wants the ruins left alone, and smugglers running gold, orchids and stolen carvings downriver. Days here are swims in a waterfall pool, cards and cold beer on the steamer deck, dancing at the hotel bar when the plane comes in, fishing off the jetty and a long sleep in a hammock as much as the chase."
weather = "The tropical range: white noon glare on the river, the green half-dark under the canopy, a wall of monsoon rain coming down the valley, steam rising after a storm, river mist at dawn, a lightning storm over the gorge, a black night of insects round a lantern. Pick what the day calls for; a sunset or a full moon is a rare day, not the default."
inhabitants = "Grown women at the centre, in their late twenties, thirties and forties: a bush pilot, an archaeologist from the capital's museum, a wildlife photographer, a steamer captain, a snake scientist with a collecting bag, a rival treasure hunter, a smuggler running the river, each with her own face, and women of every background the river country holds, local women as often pilots, scholars and captains as anyone. The men around them are rival treasure hunters, ex-soldiers hired as muscle, a smuggler in a stained linen suit, a river pilot, a camp cook, a customs officer and a doctor who drinks. Crocodiles, big cats, snakes, river hogs, monkeys, parrots and hornets share the country with them. Nobody in this world is a child or a teenager. They are as often swimming, drinking, playing cards or asleep in a hammock as running for their lives."
strangeness = "The strange is the country's own: a carved face the size of a house in a cliff, a war-time plane hanging in the canopy with its paint still bright, a crocodile older than the town. People check their pistol, light a cigarette and keep moving."
numinous = "The sacred has a body of stone and candle: a carved god's face half swallowed by roots, a temple stair climbing into cloud, a riverside shrine a boatwoman keeps with candles and flowers. It is treated with respect, painted in the same gouache as everything else, and it never moves, glows or wakes."
dread = "This world at its darkest is the bad day on the river: a canoe overturned in crocodile water, a plane down in the trees with a wisp of smoke, a camp torn apart in the night, a rope bridge parting with someone on it, a rival's rifle on the ridge, a partner who sank in the quicksand. Painted at the moment before or the moment after, never gore, and the frame does not take sides."
favoured_actors = "One grown woman at the centre of the danger, or two women, or a woman with a partner or a rival, cropped big in the foreground and filling much of the frame: a pilot swimming for her plane's float with something moving in the water behind her, an archaeologist holding a rival off with a pistol in a collapsed tomb passage, a photographer crouched in a hide as a river hog charges the blind, a smuggler poling a raft through the mangroves at night. Guides, pilots, traders and rivals round them out, each an individual. A woman held helpless by a beast or tied up waiting for rescue is this genre's most worn image and is not allowed here: she is the one with the gun and the plan. The same temple stair or rope bridge in every frame is the next most worn, and neither is the same woman facing the viewer in every frame."
myth = "The lost-city and lost-mine legends of the tropics, river pilots' tall tales and ghost boats, the treasure map and the double-cross, the expedition that went missing and the search party sent after it, the war's crashed planes and buried caches, and the true-adventure yarn told over drinks on a steamer deck."
highlight = "The thing the eye finds first: the danger at the instant before it lands, or the prize at the instant it is found. Today's kind of wrongness is given with this definition. Painted in the same lurid gouache as everything else."
highlight_modes = [
  "an animal far closer than anyone in the frame knows, a moment before it moves",
  "a rival's weapon or shadow where nobody is looking",
  "a sign someone got there first: a cut rope, a fresh cigarette end, a boot print in the mud",
  "the ground giving way under her: a riverbank, a rotten plank, a ledge of wet stone",
  "a map, a compass or a radio telling her something the land contradicts",
]

[jungle.brief]
signature = "SIGNATURE: at least one thing marks this as the 1958 adventure country, named explicitly: a seaplane on a jungle river, a paddle steamer, an expedition camp of canvas tents and lanterns, a rope bridge over a gorge, cut temple stones gripped by roots, a treasure map in oilcloth, or a pistol or machete in her hand. It may be the highlight or the actor. No more than one of temple ruin, rope bridge or waterfall per frame, and a frame needs none of them. A frame that could be a mythic barbarian past, a modern eco-tour or a holiday beach is a failed response."
allure = "ALLURE: the subject is always a woman. Whenever people are in frame, the lead figure is a grown woman painted with this magazine's pin-up glamour, at the centre of the danger and in charge of it, armed with a pistol, a rifle, a machete or a flare gun, never helpless. Dress her for where she is and what she is doing, and change it with the place: the genre's torn khaki shirt knotted at the waist with short shorts is for the trail on foot only; on a boat, a sleeveless cropped blouse and rolled sailcloth shorts; in or by the water, a two-piece or halter swimsuit; at the plane, a flight jacket open over a bandeau top and cut-off trousers; at the hotel bar or on the steamer at night, a strapless or halter cocktail dress; at camp, a sleeveless cotton top and a wrap skirt. Camp, boat and water clothes come in any colour except olive or khaki. Every frame shows skin: a bare midriff, bare shoulders and arms or bare legs, sweat or river water on her skin. Her clothes stay opaque: when she has been in the water she is in a swimsuit, never thin pale cloth wet against her body. Name her hair colour and cut in the prompt and make them this woman's own rather than a house look, any natural colour from black to platinum and any cut from cropped to long; dark shoulder-length waves and a copper-red bob are both house looks to avoid. Never call her young or a girl. Her look is fierce, knowing or amused, never frightened. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, fully covered or faceless figures, is a failed response."
menace = "MENACE: the frame holds a threat named explicitly, an animal or a rival, close to her and not yet struck: a snake coiled on the stone beside her hand, hornets pouring from a split trunk, a rival's pistol in the reeds. On a soft day it is farther off or asleep, across the water or back up the trail, and she has not seen it yet. The threat is never a tribe, a war party or a crowd of local people; local people in frame are individuals in the clothes of 1958, a guide, a pilot, a trader, a scholar or a rival, each with a face of their own. Violence is the moment before or the aftermath; no blood, no open wounds and no dead animals on show. A frame with gore is a failed response."
temper = "TEMPER: the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global lines allow the default sunset and full moon that wrecked
# earlier batches; every band here names its own light and rules those out.
[jungle.light]
lo = "Night in the tropics under an overcast, moonless sky: a campfire, a kerosene lantern, a red flare or lightning lights the scene, with the dark wall of the jungle or the black river visible around it. Name the sky in the prompt as overcast and moonless; a moon of any size in the sky is a failed response."
mid = "Storm light, river mist or the green half-dark under the canopy, with shafts of sun breaking through. Name the sky in the prompt as storm grey, white mist or hidden by the canopy; a sunset, orange or golden-hour sky is a failed response."
hi = "Hot tropical sun high overhead: white glare on the water, short hard shadows, sweat shining. Name the sky in the prompt as white-hot noon haze or hard blue; a sunset, orange or golden-hour sky is a failed response."

