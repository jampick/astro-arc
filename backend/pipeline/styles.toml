[ukiyoe.registers]
"botanical" = "Plants as the season's sign: cherry blossom over a crowd, pines bent by wind on a cliff road. Each print knows its season by what is in flower."
"bodily and anatomical" = "The body as the kabuki and kaidan prints show it: an actor's tattooed back, a ghost's long hair and hanging hands. Strong pose and pattern, never gore."
"fungal and decaying" = "Decay as the ghost prints know it: a ruined temple with grass on its roof, a lantern rotted until a face appears in it. Rot is where the dead come back."
"animal and creaturely" = "Animals that are often more than they seem: a fox at a crossroads, carp crowding a river. Some of them are yōkai."
"geological" = "Mountains and cliffs as the landscape prints build them: a peak seen from every station, a cliff road with travellers on it. Rock is shaped by line and flat colour."
"metallic and ore" = "Metal is for swords, kettles and temple bells: a sword's edge in a duel, a bronze bell in a snowy yard. It is rare and precious."
"glass and ceramic" = "Fired clay and the few glass things of Edo: sake flasks at a teahouse, a glass wind-chime on a summer veranda. Each is a small, handled thing."
"architectural" = "Wooden Japan seen from a high oblique angle, roofs as pattern: a temple gate, a shop front behind cloth curtains."
"domestic interior" = "A room with sliding paper walls opened onto a garden or a street: tatami and a brazier. The world is always visible through an opening."
"mechanical" = "The few machines of Edo, wood and rope worked by hand: a water wheel, a mechanical doll at a festival."
"industrial and infrastructural" = "The works of the great roads and rivers, crowded with the people using them: a long bridge, a timber raft on a river."
"agricultural and cultivated" = "The season's field work: rice paddies flooded for planting, farmers under straw raincoats."
"aquatic" = "Water as pattern and force, the most drawn thing in this world: waves rising into claws, rain on a river crowded with boats."
"atmospheric" = "Sky and air as bands of colour, where bokashi belongs: a red dawn, mist hiding a valley."
"glacial and frozen" = "Snow drawn as soft white masses and falling dots: snow on travellers' hats, icicles at a temple's eaves."
"fire and ember" = "Fire as festival and as disaster: fireworks over the river, a burning ward with fire brigades on the roofs."
"textile and fiber" = "Cloth as the print's richest pattern: kimono, umbrellas in rain."
"ritual object" = "Ritual woven into daily life: a torii at a road's turn, a festival float pulled through a street."
"paper and inscription" = "Paper lanterns and poem slips tied to branches. Writing appears as calligraphic marks, never as a readable sentence."
"instrument and measure" = "Measure in the floating world: an abacus at a shop counter, the distance markers of the post roads."

[ukiyoe]
label = "Ukiyo-e"
suffix = "Ukiyo-e Japanese woodblock print style: flat, unmodulated color fields bordered by confident, uniform-weight black outlines (the hand-carved key-block line), never digitally smooth or painterly-blended within a shape. Skies, water, and distant landscape may use bokashi — a soft hand-inked gradient — but this is the only place gradients belong; everything else stays flat. Compositions favor asymmetrical framing, bold cropping at the frame's edge, and a high oblique viewpoint rather than single-point perspective. Rain, snow, water, and textile patterns render as repeating graphic motifs (parallel diagonal lines for rain, stylized wave crests) rather than naturalistic texture. Palette leans toward deep indigo and Prussian blue alongside warm earth tones and muted reds. Do not add a person or figure unless one is already described above — many ukiyo-e prints are pure landscape, still life, or pattern with no one in them. Only if a person is explicitly part of the scene described above: render them with the same flat color planes and confident outline as everything else, never photorealistic shading."
