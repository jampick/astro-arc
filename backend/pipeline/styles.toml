  "along a snowy mountain pass to a far fortress",
  "through a cave mouth onto a red sunset",
  "down a jungle river to a drowned ruin",
  "across a desert to a walled city at dusk",
  "over a galley's prow into a storm at sea",
]


# CHARTER, 2026-10-12 (new style, written to docs/charter-schema.md): the
# 1970s Black action cinema of the grindhouse era and the gonzo homages it
# inspired: Black heroes at the centre of a funk-scored city, cool as a law
# of physics, violence fast and theatrical. No character, film or director
# names, since whatever a charter names turns up in the image. The pimp in
# furs and the lone hero's gun-pointing poster pose are demoted.
[funk.world]
era = "An American city in 1973 that is louder and cooler than the real one ever was: brownstones, tenements, soul clubs, pool halls, storefront churches and elevated trains, run by a syndicate and crooked cops and taken back block by block. Technology is the muscle car, the pay phone, the hi-fi, the switchblade and the snub-nosed revolver."
materials = "Black leather, suede and fur trim, wide-lapelled polyester in loud prints, chrome and candy paint, gold chains and big rings first, then brick, neon tube, wood panelling, shag carpet, vinyl booths and wet asphalt."
physics = "Cool is a law of nature: a hero's coat falls right in the middle of a fight, the righteous walk through crossfire, a muscle car clears an impossible gap. Violence is fast, staged and bright, with blood the red of a poster, never gore. Conjure is real in the old neighbourhoods and works through roots, graves and candles. Light comes from streetlamps, neon, headlights, club lights and a hot summer sun, and nothing else glows."
society = "Neighbourhoods that look after their own, with block parties, Sunday church, rent parties, barbershops, record stores and corner games, under a syndicate that runs the numbers and the precinct. Days here are music, dancing, cookouts, card games and long cruises down the avenue as much as the fight."
weather = "The whole range: a heat wave with hydrants open, rain on neon at three in the morning, a smoggy orange dusk over the skyline, a snowy night outside a club, a storm over the docks. Pick what the day calls for."
inhabitants = "Black heroes at the centre: private eyes, nurses and women out for revenge, kung fu masters, ex-soldiers, musicians, preachers and community organisers; their crews and their neighbours; root doctors and the restless dead; and against them, syndicate men and crooked cops. They are as often dancing, eating or holding court as fighting."
strangeness = "The strange is gonzo excess that nobody questions: a fight that stops a whole street, an entrance that turns every head, a car that does what no car can. People react to it with a nod, as if this is what Tuesdays are for."
numinous = "The sacred has a body and a voice: a storefront preacher whose sermon shakes the windows, a soul singer holding a room still, a root doctor's altar of candles and photographs, the dead risen to settle a debt. Never an aura or a beam."
dread = "This world at its darkest is the shakedown and the payback: a shootout in a stairwell, a burning tenement, a body in the river, the syndicate's men at the door. Fast and theatrical, blood bright as poster paint, never gore, and the frame does not take sides."
favoured_actors = "Crews and pairs, crowds at a club or a block party, a hero against a room full of enemies, neighbours, musicians, and the dead come back. A pimp in furs and a lone hero pointing a gun in a poster pose are this genre's most worn images and should not be the default."
myth = "Black American folklore and its heroes, from Stagolee and John Henry to the trickster who outwits the powerful; Southern hoodoo and conjure; the Western and the revenge tale; Hong Kong kung fu cinema; crime pulp; the gospel church; and the cosmic jazz of Afrofuturism."
highlight = "The thing the eye finds first: a moment of cool or of payback at its peak, or a conjure made flesh. Today's kind of wrongness is given with this definition. Painted as boldly and brightly as everything else."
highlight_modes = [
  "an entrance so cool the whole street stops for it",
  "a car doing what no car can",
  "a fight frozen at its peak",
  "an ordinary object turned into a weapon",
  "a conjure or a curse made flesh",
]

[funk.brief]
signature = "SIGNATURE — at least one thing marks this as the 1970s funk city, named explicitly: a towering afro or a leather maxi coat, a candy-painted muscle car, platform boots, a soul club's marquee, or a kung fu kick on a city street. It may be the highlight or the actor. A frame that could be any modern city or any period drama is a failed response."
