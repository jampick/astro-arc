"botanical" = "Green in a hard city: a rooftop garden of tomatoes and collards, a root doctor's herbs hung to dry, weeds through a vacant lot. Its highlight: a plant used for conjure."
"bodily and anatomical" = "The body as style and as power: an afro, a fighter's poised muscle, sweat on a dancer. Blood is bright poster red, never gore."
"fungal and decaying" = "Decay as the city's neglect: a condemned tenement, a boarded-up theatre, a cemetery gone to weeds where the dead stir."
"animal and creaturely" = "Animals of the city and the conjure: a pit bull on a chain, pigeons on a rooftop, a black cat at the root doctor's door, a snake in a jar."
