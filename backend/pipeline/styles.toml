# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Hong
# Kong in 1975 as the action pictures painted it on the cinema hoardings:
# rooftops, street markets, gambling dens, the walled city, the harbour and the
# martial arts halls, by day as much as by night. The medium is the hoarding
# itself, matte poster paint on plywood boards gone chalky in the sun, figures
# stacked in tiers; it deliberately says none of what [masala] owns (gloss,
# seams, pink-and-turquoise modelling, wild scale cut-outs). Signs carry no
# characters. The lead figure is a woman fighter or triad queen; a strike is
# in frame only when the actor is fighting (FIGHT). Glamour is the city's own
# poster glamour, suggestive and never explicit, and every woman is a grown
# adult. The halls train grown fighters only and society names no families:
# nobody in this world is a child, on purpose. Women are individuals, never
# an exotic type; no sailors-and-bar-girls. Two worn images are demoted: the
# lone bare-chested man fighting a crowd and the flying-kick woman facing the
# viewer. A frame that could pass for cyberpunk fails the signature.
# v2 2026-10-13: menu-free suffix_figures, no night in the suffix, no-text
# rule, mahjong and other repeated nouns cut to one or two fields.
# v3 2026-10-13: sweep pr-kowloon put the lead in a red satin dress in 6 of 8
# frames; the allure clothes menu is gone and her clothes keep off the red.
# No artist, film or studio names, since whatever a charter names turns up.
[kowloon.world]
era = "Hong Kong in 1975, louder, hotter and more crowded than it ever really was: Kowloon's tenements, the walled city's lightless passages, the street markets, the squatter huts on the hills and the harbour with the island's towers across it. Technology is the neon tube, the double-decker bus, the bamboo scaffold and the butterfly knife, and everyone knows how to make all of it do something it was not built for. Nothing electronic goes past the transistor radio and the pay phone, and no screen is bigger than a cinema's."
materials = "Wet concrete and enamel paint first, then steel roller shutters, bamboo poles, red lacquer, satin and brocade, jade, brass, terrazzo floors, iron window grilles, tin cans and harbour water."
physics = "Kung fu is a law of nature here: a fighter can run up a wall, cross a street from rooftop to rooftop, catch a blade between her palms and take on twenty men. Light comes from a hard subtropical sun, sodium streetlamps, neon, bare bulbs, lanterns, headlights and lightning, and nothing glows of its own accord. Signs are colour and traced shape, seen edge-on, from below or blurred by rain and distance; invent the shapes for the scene, never legible words or characters. Ghosts are real in the seventh month. Violence is menace and aftermath, never gore."
society = "The triads run the gambling, the protection and the walled city, and the police run a syndicate of their own while the new anti-corruption men start knocking on doors. Grown refugees build huts on the hills, factory women work twelve-hour shifts, boat people crew the junks and dockers work the piers. Days here are dim sum mornings, afternoons at the cinema, late nights at the cards, beach weekends, opera in a bamboo theatre, dragon boat races and mid-autumn lanterns as much as the fight, and everyone in these streets is a grown adult."
weather = "The whole subtropical year: a sticky summer night with air as thick as soup, a monsoon downpour flooding the street, the typhoon signal hoisted and the shutters banging, a white-hot noon on the rooftops, winter fog over the harbour, a red sunset behind the hills, lightning over the Kowloon peaks. Pick what the day calls for."
inhabitants = "Grown women at the centre: kung fu fighters, a triad queen who inherited the gang and runs its books from her father's herbal shop, gambling-house bosses, nightclub singers, dance hall hostesses, fortune tellers, street cooks and a cop who cannot be bought, each with her own face and her own reason; the men around them, triad soldiers, crooked sergeants, martial arts masters and boatmen; caged songbirds, rooftop pigeons, alley cats, a rooster in a crate at the wet market and fighting crickets; and hungry ghosts, fox spirits and the gods of the street shrines. The halls train grown fighters only, and nobody in this world is a child. They are as often eating, gambling, dancing or asleep as fighting."
strangeness = "The strange is kung fu excess nobody questions: a woman walking up the side of a tenement, a palm strike that cracks a pillar, a fight that runs the length of a market street without upsetting the fish. People step round it and go on eating."
numinous = "The sacred has a body of red paint and smoke: a red-faced war god in a shrine with a red bulb and a plate of oranges, worshipped by triads and police alike; the sea goddess's temple by the water; paper offerings burning at the kerb for the hungry ghosts. Painted as boldly as everything else, never an aura or a beam."
dread = "This world at its darkest is the hit and the raid: a cleaver left standing in a tea-house table, a body under a sheet on a wet street, a tenement stairwell burning, red paint thrown across a debtor's door, a squatter hut torn off the hill in a storm, men with choppers at the foot of the stairs. Menace and aftermath, never gore, and the frame does not take sides."
favoured_actors = "Striking grown women alone, in pairs or against a crowd, close enough to fill much of the frame: a triad queen settling a debt over tea, two sisters back to back on a rooftop, a singer stepping off the stage into a brawl, a street cook facing down a gang across her stall. Rivals, crews, masters and the market crowd round them out. Two images are this genre's most worn and should not be the default: the lone bare-chested man fighting a crowd, and a woman at the top of a flying kick facing the viewer. Neither is the same woman in the same dress in every frame."
myth = "Chinese martial-arts legend of the wandering knight and the temple fighters, the triad brotherhood's oaths and initiation rites, the red-faced god of loyalty and brotherhood, the sea goddess of the fishing people, the Monkey King, the hungry ghosts of the seventh month and fox-spirit lore; Cantonese opera; and the revenge tale and the gambler's legend."
highlight = "The thing the eye finds first: a showdown at its tightest, a kung fu feat no body could perform, or a god of the street stepping in. Today's kind of wrongness is given with this definition. Painted as boldly as everything else."
highlight_modes = [
  "a body standing where no body could stand, up a wall or along a wire",
  "one woman holding a whole crowd of men at bay",
  "something from the market or the kitchen doing a weapon's work",
  "a street shrine's god taking part in the day",
  "a painted opera face on a fighter that moves on its own",
]

[kowloon.brief]
signature = "SIGNATURE — at least one thing marks this as Hong Kong in 1975, named explicitly: laundry on bamboo poles across a tenement face, a red taxi in a street hung with signboards, a mahjong table in a back room, or a junk's battened sail on the harbour. It may be the highlight or the actor. By day the signs are unlit enamel and painted boards. A frame that could pass for a cyberpunk future (screens, holograms, cyberware, glowing tech), any modern Asian city or any period costume drama is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a striking grown woman in her twenties or thirties, painted as the city's own cinema painted its stars, never as a foreigner's fantasy of the East: dressed for what she is doing today, in mid-1970s clothes whose cut and colour change from frame to frame, with a cool, knowing look, at work, at the cards or at ease rather than posed for the viewer. If the actor named below is a man, paint a woman in the same role instead. She is her own person with her own face, never an exotic type. Suggestive, never explicit: no nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain or faceless figures, is a failed response."
fight = "FIGHT — a strike is in frame only when the actor named below is fighting. When the actor is doing anything else, nobody in the frame is mid-strike, and such a frame with a kick or a blow in it is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

