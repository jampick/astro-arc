[planetpulp.registers]
"botanical" = "Alien growth in colours no Earth plant has: fronds of violet and crimson taller than a rocket, a flower that turns to follow a passer-by. Its highlight: a plant that hunts."
"bodily and anatomical" = "The body as heroism: a bare shoulder braced against the recoil, sweat on a collarbone under a hot alien sun, a ray burn bound with a torn sleeve. Never gore."
"fungal and decaying" = "Decay as the age of other worlds: glowing fungus in a cave under an old city, a derelict rocket overgrown, a vanished race's halls gone soft with mould."
"animal and creaturely" = "Creatures of other worlds: a thing with too many limbs and eyes on stalks, a great lizard in harness, a flock of leathery fliers. Its highlight: a monster with a mind of its own."
"geological" = "Ground no one has walked: red Martian sand, a field of glittering crystal, a cratered plain, a cliff of banded stone."
"metallic and ore" = "Chrome and brass of the space age: a rocket's polished flank, a riveted robot, a brass belt and wrist cuffs, a raw vein of alien ore."
"glass and ceramic" = "Glass that keeps people alive: a fishbowl helmet, a porthole full of stars, a ray gun's glass coil."
"architectural" = "Built worlds: a Martian canal city of carved sandstone and arched bridges, a crystal city's spires, a domed colony, a launch tower on a pad."
"domestic interior" = "Living between the stars: a rocket's bunk room with a porthole, a colony kitchen with a robot at the stove, a noble's hall of carved stone."
"mechanical" = "Machines of 1952's tomorrow: a finned rocket, a chrome robot, a rocket sled, a control panel of dials and levers."
"industrial and infrastructural" = "The frontier's works: a mining rig on an asteroid, a launch field, an atmosphere plant, the great locks of a canal."
"agricultural and cultivated" = "Farming another world: hydroponic racks in a colony greenhouse, a herd of alien grazers, an orchard of strange fruit on a jungle moon."
"aquatic" = "Water of other worlds: an ancient canal, a warm alien sea with something under it, a hot spring on an ice moon, a methane lake."
"atmospheric" = "Alien air: a violet dusk, a red dust storm, a methane fog, an aurora, a meteor shower."
"glacial and frozen" = "Ice worlds: blue glaciers under a small sun, a frozen moon with geysers, a crew frozen in a sleep pod."
"fire and ember" = "Fire as launch and as battle: rocket exhaust on the pad, a volcano on a young world, a ray blast, a burning wreck."
"textile and fiber" = "Clothes for the space age, changing with the day: a glossy spacesuit, a cut-away flight suit, a Martian noblewoman's jewelled draping, a crewman's flight jacket."
"ritual object" = "Faith and luck out among the stars: a vanished race's idol, a lucky charm hung over the controls, a stone that sings when touched."
"paper and inscription" = "Papers of the frontier: a star chart, a captain's log, a treasure map of a dead world. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Instruments of exploration: a radar scope, a brass spyglass, a sextant aimed at three moons, a ray gun's charge dial."

[planetpulp]
label = "Planet Pulp"
suffix_base = "The cover art fills the frame edge to edge, seen flat and straight on, with no magazine, hands, table or margins around it and no blank band left for a title. It is a 1952 pulp science-fiction magazine cover painting in saturated oil on board: thick, glossy, confident brushwork, bold forms modelled in strong light, lurid, saturated colour all over (cadmium red, chrome yellow, ultramarine, viridian, magenta-violet) with gleaming highlights on chrome, brass and skin. Dynamic diagonal composition with the lead figure at the centre of the cover. Printed on rough pulp paper: visible paper fibres and specks, coarse halftone dots, colour plates slightly off register so a thin fringe of cyan or magenta shows along some edges, and the paper browned and chipped along one edge. Not photographic, not digital, not airbrushed and not 3D-rendered. No masthead, title, logo, cover lines, price, issue number, insignia or lettering anywhere, and no glyphs, carved symbols or marks on any machine, wall or stone, not even unreadable ones."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties, thirties or forties, painted as a 1952 pulp-cover space heroine with a bold, knowing, fearless look and a ray gun in her hand or at her hip, in space-age clothes cut to show her off and chosen for where she is, each woman with an individual face, hair colour and style, build and outfit of her own, blonde, black-haired or cropped as often as auburn-waved; men are square-jawed and secondary to her; monsters and robots are menacing and painted with relish. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals. Spacesuits and clothes are opaque; a helmet's glass is clear so her face shows."
space = [
  "down a Martian canal between carved sandstone towers to a bridge and a dusty pink horizon",
  "from a rocket's open hatch across a jungle moon's violet fronds to a smoking volcano",
  "across a cratered plain to a colony of round huts and a launch tower",
  "up a stair of crystal terraces to a crystal city's spires",
  "from the lip of a canyon on a red world to a dust storm rolling in",
  "along an ice moon's glacier to geysers and a small cold sun",
  "from a jungle moon's warm shallows across a lagoon to a rocket standing on the far beach",
  "past a colossal half-buried stone head across red dunes to a crashed rocket",
]

# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# frontier of 1967 as the Italian-made westerns shot in the deserts of southern
# Spain imagined it: a whitewashed border town, a cantina, a desert mission, a
# railway water tower, eroded badlands and dry riverbeds, bounty hunters,
# bandit gangs and a gold shipment, painted as a 1960s Italian western film
# poster on worn, folded paper (dusty ochre, bleached sky, one blood-orange,
# black shadow with halftone in it). An outlaw woman with a gun is the centre
# of the standoff. Menace and aftermath, never gore. Glamour is film-poster
# sensual (open shirts, bare shoulders, sweat), never explicit, and every
# woman is a grown adult. Mexican and Spanish characters are individuals,
# never sombrero costume. The duel in the main street at noon is demoted, and
# the sunset is ruled out as the default sky because a western reaches for it.
# Kept apart from [smokeshow] (1977 South, cars, chrome, airbrush) by having
# no engines but the train, and from [giallo] (1971 Italian poster, coloured
# gels, gloss) by matte sun-bleached paper and no coloured light at all; from
# [calendario] by its dust, its grime and its ruined frontier rather than the
# calendar's clean ancient valley. No artist, director, actor, composer, film
# or studio names, since whatever a charter names turns up.
#
# REVISION 1, 2026-10-13 (own review before the first sweep): the outfit list
# in ALLURE became situations, the poncho is one choice among several rather
# than the uniform, the blood-orange is tied to one object and kept off skies
# and clothes, hair varies by name, the noon duel and the sunset each live in
# one field, and a gun is held by her or holstered and never aimed at her;
# the bell tower, the poncho and the bandolier are held to fewer fields, the
# reward poster lost its writing, and the watch is in one register only.
#
# REVISION 2, 2026-10-13 (after sweep pr-almeria, 8/8, no refusals): all
# eight women wore the same cream open linen shirt (copied from the first
# item in ALLURE and from materials), so the shirt left materials and the
# textile register and ALLURE leads with other clothes and names the pale
# shirt as not the habit. Three of eight night frames had a full moon, so the
# lo light line now asks for stars, cloud or a crescent. Every woman was
# dark-haired, so the hair line asks for fair, red, chestnut and grey too.
[almeria.world]
era = "The borderland frontier of 1967 as the westerns of that year imagined it, a desert that looks like southern Spain standing in for somewhere between Texas and Mexico some time after the Civil War: whitewashed adobe towns with one street and a bell tower, cantinas, a desert mission, ranch houses with walled yards, a mining camp, and a railway line with a water tower in the middle of nowhere. Technology is the repeating rifle, the six-gun, the Gatling gun on a wagon, the dynamite stick, the telegraph and the steam train, and every one of them is worth more than a man's life."
materials = "Sweat-damp skin, sun-bleached adobe and grey-ochre dust first, then worn leather, cartridge brass, gun steel, coarse wool, rope, splintered wood, prickly pear and agave, iron strongboxes, black lace and the gold itself."
physics = "The sun is a weight: white noon glare, short black shadows, heat shaking off the stones, every face shining with sweat. Light is the sun, the moon, a campfire, a lantern or a muzzle flash, and nothing glows of its own accord. Guns behave as the posters told it, the fastest hand wins and a hat can be shot off a head, but nobody flies and nothing is magic. A wound is a dark stain on a shirt and a man fallen in the dust at most, never gore."
society = "A lawless country run on bounties, gold and grudges: bounty hunters, a bandit chief and his gang, a crooked land baron and his hired guns, a tired sheriff, a revolutionary general who needs money, cantina keepers, priests, railwaymen, gold-mine workers, families who farm the dry ground and the undertaker. Days here are fiestas in the plaza, weddings, card games, siestas in the shade, baths in the river and guitar music at the cantina as much as robbery and pursuit."
weather = "The whole dry range: white noon glare, a hot wind blowing dust down the street, a grey dust storm closing over the badlands, the first light on a dry riverbed, a cold desert night of stars, a rare cloudburst that turns the riverbed to mud, an overcast afternoon the colour of bone. Pick what the day calls for. A sunset sky is one day in many, not the default."
inhabitants = "Grown women at the centre, in their twenties, thirties and forties, each with her own face, build, colouring and hair: an outlaw with a price on her head, a bounty hunter, a bandit chief's partner who means to take his place, a widow who hired a gun, a cantina owner, a revolutionary with a bandolier, a rancher's widow gone bad, a card sharp, Mexican, Spanish, American and mestiza women alike, none of them a type. Everyone in this world is a grown adult. Around them the gunmen, bandits, bounty hunters, priests and old men of the plaza, each with a face of his own; horses and mules, vultures, scorpions, a dog in the shade; and the dead, who wait in the cemetery. They are as often eating, dancing, washing at the trough, gambling or asleep under a hat as riding or fighting."
strangeness = "The strange is legend told as fact: a woman nobody can outdraw, a man who comes back from his own grave, a stranger whose name nobody has heard and everybody fears, a bell that rings with nobody in the tower. People drink, cross themselves and keep their hand near the gun."
numinous = "The sacred has a body of whitewash, wood and bone: a mission church with a cracked bell, a wooden cross on a hill, a shrine to the Virgin in a wall niche with candles, a cemetery of wooden crosses and stones, a priest who blesses the guns. Painted in the same dusty poster colour as everything else, never a beam or an aura."
dread = "This world at its darkest is the ambush and what is left after it: a burned ranch house, a robbed train standing silent on the line, empty boots and a hat in the dust, a rope over a tree branch with nobody on it yet, vultures circling a dry riverbed, a grave dug and waiting. Menace and aftermath, never a wound in close-up and never gore, and the frame does not take sides."
favoured_actors = "Grown women alone, in pairs or at the centre of a standoff, cropped big in the foreground and filling much of the frame: an outlaw with a rifle across her shoulders on a mission wall, a bounty hunter drinking at the bar with her back to the door, two women dividing gold in a dry riverbed, a woman watering her horse at a trough in the plaza, a woman leaning in a railway station doorway while the train takes water. Gunmen, bandits, villagers and priests round them out. Two gunfighters facing each other down a main street at noon is this genre's most worn image and should not be the default, and neither is the same woman staring out of the frame every day. Most frames are not a duel."
myth = "Frontier legend and the outlaw ballad, the bounty on a head, the Mexican Revolution's corridos, the Spanish and Mexican folk Catholicism of saints and processions, the treasure-hunt story and its double-cross, the vendetta, and the Greek tragedies of revenge the westerns borrowed without saying so."
highlight = "The thing the eye finds first: the moment before the guns, or the thing that changes who will win, caught under the hard sun. Today's kind of wrongness is given with this definition. Painted in the same poster colour as everything else."
highlight_modes = [
  "a hand an inch from a holster while everyone else is still talking",
  "a glint of gold, a key or a map where it should not be",
  "a shadow on the ground from someone who is not in the frame",
  "a bell, a watch or a guitar that has stopped the whole scene",
  "the aftermath, left in the sun for someone to find",
]

[almeria.brief]
signature = "SIGNATURE — at least one thing marks this as the 1960s Italian western's frontier, named explicitly: a whitewashed adobe town, a cantina with its doors open on the glare, a railway water tower on an empty line, eroded grey-ochre badlands or a dry riverbed of white stones, prickly pear and agave, or a woman in a gunbelt with a rifle or a revolver. It may be the highlight or the actor. Not every frame is the main street: the badlands, the riverbed, the mission, the station, a ranch yard and the inside of the cantina are just as much this world. A frame that could be any modern desert town, or a costume fiesta, is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a grown woman painted with this poster's glamour, dressed for where she is and what she is doing, never in the same outfit as yesterday and never in a default one: a low-cut embroidered blouse slipping off one shoulder at the cantina, a fitted black bodice and a split riding skirt in the saddle, a dark dress cut low with a lace mantilla at a funeral or a wedding, a corset under an open leather vest at the card table, a vaquero's short jacket over a bare midriff on the trail, a wet camisole after the river, a poncho thrown over bare shoulders at a night camp. A pale open shirt is one choice in many and not the habit. Skin shows: a bare shoulder, an open collar, a plunging neckline or bare arms, with dust and sweat on it, most days. Her hair is her own and as often fair, red, chestnut or grey-streaked as black: a braid, loose waves, cropped short, under a flat hat, pinned up in the heat. A gun is in her hand, across her shoulders or on her hip; no gun is ever pointed at her. In a pose of nerve, menace, ease or rest rather than one held for the viewer, with a look aimed at someone in the scene. If the actor named below is a man, paint a woman in the same role instead. Men may stand beside her or face her, never as the subject. Never nudity and never a sexual act. A frame whose lead figure is a man, a frame of plain, fully buttoned-up or faceless figures, or a pale shirt or a poncho by default, is a failed response."
sun = "SUN — one blood-orange in the frame, in one place, and it is the highlight or the thing that matters most: a bandana, a flame, a strongbox's painted lid, a muzzle flash, a cantina door. The sky is bleached white, pale bone or dust-grey, never orange; her clothes are their own colour (white, black, rust, indigo, faded red), never the sky's. A sunset sky, an orange sky, or a frame washed orange all over is a failed response."
menace = "MENACE — violence is the moment before or the moment after: a hand at a holster, a cocked hammer, a fallen hat, a man face-down in the dust at a distance. A wound in close-up, blood on skin or gore is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global lines are fine for lo and mid, but a western reaches for
# the sunset whenever it can, so every band says what its sky is.
[almeria.light]
lo = "Night in the desert: one campfire, a lantern or a lit cantina doorway, with the dark country visible beyond it under stars, cloud or a thin crescent, and at least two thirds of the frame dark. A full moon is one night in many and never the default. A sunset or a twilight orange sky is a failed response."
mid = "Early morning, late afternoon, a dust storm or the shade of a cantina or a church: light from one clear direction with lit and black areas both substantial, under a pale, grey or dusty sky. A frame lit evenly from everywhere, or a sunset sky, is a failed response."
hi = "The white noon sun: a bleached, nearly white sky, the ground blazing and the shadows short and black under hats, eaves and horses. An orange, golden or sunset sky is a failed response."

