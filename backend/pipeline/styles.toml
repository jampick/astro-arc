[jungle.registers]
"botanical" = "The jungle as obstacle and hiding place: a strangler fig splitting a cut stone wall, an orchid a smuggler would kill for. Its highlight: a plant hiding something or someone."
"bodily and anatomical" = "The body under strain and on show: sweat on a bare shoulder, mud to the knee, a sunburnt back, a bandage on a forearm. Injury is a bandage or torn cloth, never gore."
"fungal and decaying" = "Rot in the heat: a crashed plane furred green in the canopy, a steamer hull going soft on a mudbank."
"animal and creaturely" = "Animals at their real size, made to loom by angle and closeness: a crocodile's eye just above the water, a big cat on a branch over the trail. Its highlight: an animal a moment before it moves."
"geological" = "Hard country: a limestone gorge with white water at the bottom, a quicksand flat at the river's edge, a cave mouth behind a waterfall."
"metallic and ore" = "Steel and gold, the gun and the prize: an oiled pistol, a machete's edge, a gold figurine in the mud."
"glass and ceramic" = "Glass of the expedition and the bar: a compass with a cracked face, a field camera's lens, a seaplane windscreen starred by a bullet."
"architectural" = "The forgotten city and the river town: a temple stair choked with roots, a customs house on stilts over the water, a hotel veranda with a fan turning."
"domestic interior" = "Rooms of the frontier, open to the heat: a steamer cabin with louvred shutters, a tent with a camp table and a lantern."
"mechanical" = "Machines that might not start: a seaplane's radial engine, an outboard motor, a jeep up to its axles in mud, a hand-cranked radio."
"industrial and infrastructural" = "What the frontier runs on: a dump of fuel drums on the bank, a gold dredge working the river, a rail line half eaten by the forest, a sawmill at the landing."
"agricultural and cultivated" = "Clearings cut from the forest: a rubber plantation gone wild, a banana boat being loaded at the jetty, a garden behind the trading post."
"aquatic" = "The river as road and as threat: brown water with something under it, rapids in a gorge, a waterfall pool, a mangrove channel at low tide."
"atmospheric" = "Tropical air: steam after rain, a wall of monsoon rain coming down the river, smoke from a burning camp hanging under the canopy."
"glacial and frozen" = "Cold as the tropics know it: ice in a glass at the hotel bar, cloud forest mist on the high pass, a snowcap seen from the airstrip."
"fire and ember" = "Fire as signal and threat: a red flare over the canopy, a fuel drum burning on the water, a campfire with eyes beyond it."
"textile and fiber" = "Rope, canvas and net: a rope bridge's frayed strands, a tent torn open, a mosquito net, a patched sail on a river trader. Its highlight: a rope at its breaking point."
"ritual object" = "The sacred as found in the ruins and as still kept: a carved stone face swallowed by roots, a riverside shrine with candles a boatwoman keeps. Treated with respect, never a curse come to life."
"paper and inscription" = "Papers worth killing for: a treasure map in oilcloth, an explorer's journal, a forged permit, a photograph of the dig. Writing appears as marks, never a readable sentence."
"instrument and measure" = "The expedition's measures: a brass compass, a shortwave radio, an altimeter in a cockpit, binoculars, a depth line over the side."

[jungle]
label = "Jungle Adventure"
suffix_base = "A lurid 1950s adventure-magazine illustration painted in gouache on illustration board: high-key drama with bold, confident brushwork, figures modelled in hot light with cool green shadow, crisp highlights on sweat, wet skin, gun steel and river water, the action foreshortened and caught at its peak, and dense jungle foliage painted looser behind. A saturated palette of jungle greens, river brown and khaki, with hot accents of orange, scarlet and chrome yellow coming from fire, flares, flowers and animals rather than from clothes. The image is the printed magazine page itself, seen flat and square on and filling the frame: coarse, slightly yellowed pulp paper with visible fibres and soft ink spread, a faint halftone in the sky, and along the left edge a narrow gutter where the page curves into the spine, with two wire staples. Not photographic, not digital and not 3D-shaded. No text, headline, caption, title or lettering anywhere."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her late twenties, thirties or forties, painted with the magazine's pin-up glamour: athletic and curvy, bare midriff, arms and legs, sweat and river water on her skin, and a fierce, knowing look with a weapon or tool in her hand, never helpless or frightened. Each woman has an individual face, hair colour and cut, build and complexion of her own, dark-haired as often as fair, hair cropped, tied back, loose and wet or pinned up. Men are rugged and unshaven, in sweat-stained work clothes or a stained linen suit, and secondary to her. Everyone else in frame is an individual in the work clothes of 1958. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals; her clothes are opaque, and anything wet is a swimsuit or heavy cotton, never see-through."
space = [
  "from a seaplane's float across the brown river to a paddle steamer rounding the bend",
  "across a rope bridge over a gorge to cliff-face ruins on the far side",
  "from an expedition camp's lantern-lit tents to the black wall of the jungle and a fire on the ridge",
  "down a river town's jetty past the hotel veranda to the steamer at the landing",
  "from a grass airstrip past a parked transport plane to mountains in cloud",
  "along a sandbar on the crocodile river to the green wall of the mangroves",
  "up a temple stair choked with roots to the canopy and the sky above it",
  "from a smugglers' camp on a gravel bar across the rapids into the mouth of the gorge",
]

# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# Southern California beach-party coast of 1963: surf breaks, a pier, a beach
# shack with a jukebox, bonfires, wood-panelled wagons, a lifeguard tower, the
# dance on the boardwalk, a rival motorcycle club and a surf contest. Painted
# as a 1960s beach-party movie poster in flat, bright gouache (turquoise,
# coral, sunshine yellow, white) with some halftone and a sun-faded,
# sand-scuffed print. The one carefree, sunny style in the set: trouble is
# mischief, rivalry and big surf, never crime or menace, which is the line
# against [paperback] (same coast, 1955, noir). Kept apart from [smokeshow]
# (airbrushed 1970s drive-in poster) by flat cut-paper colour areas, a brush
# outline and a cleaner, paler print. The marker is a grown woman surfer or
# beach-party star, board under her arm, mid-laugh or mid-dance.
# The genre was teen-coded; here everyone is a grown adult on their own time,
# and schools, teenagers, children and anyone's rules are written out (and
# left unnamed, since a named thing turns up). No outfit menu: swimwear is
# chosen per situation, and the palette's sky and sun colours stay out of the
# clothes. Sunsets are kept out of every light band, since a beach charter
# defaults to one. No artist, film, actor, studio or brand names.
# Revised after sweep pr-malibu: night prompts rendered as blue day (the
# suffix's sunny palette won), six of eight women had the same dark wavy hair
# and laugh, five wore blue or red one-pieces, and the paint was glossy
# pin-up rather than flat poster. The suffix now flattens the paint, gives
# night its own sky, and suffix_figures varies hair, expression and suit.
[malibu.world]
era = "The Southern California coast in the summer of 1963, the best summer anyone remembers: a surf town with a pier, a coast highway along the bluffs, beach houses on stilts, a board shack, and coves you can only reach on foot. Technology is the long wooden surfboard, the wood-panelled station wagon, the motorcycle, the jukebox and the transistor radio, and all of it is for fun."
materials = "Sun-warm skin, wet sand and salt water first, then waxed wood and fibreglass boards, varnished wagon panels, weathered shack planks, canvas umbrellas, terry towels, cotton and nylon swimwear, chrome, soda-bottle glass and driftwood."
physics = "The sun runs everything: hard blue days, white light on the water, sand too hot to stand on. Waves are bigger, bluer and more perfect than anywhere real, and a good surfer can ride one further than physics would allow; a wipeout sends a board flying and the surfer comes up laughing. At night the only light is the bonfire, the shack's string of bulbs or the boardwalk lights, and nothing glows of its own accord. Nobody is ever really hurt."
society = "A summer society of surfers, lifeguards, the shack owner who runs the jukebox and the grill, a combo band that plays the boardwalk, a pompous developer who wants the beach for a hotel, and a motorcycle club from inland who think the beach is theirs. Days here are surf sessions, volleyball, dances, bonfire nights, a big contest and lazy afternoons on a towel, and almost nobody works more than they have to."
weather = "The coast's whole range: a hard blue noon, a grey June morning with the surf coming out of the fog, a hot offshore wind blowing spray back off the waves, a south swell under high thin haze, a summer squall that clears the beach, a big winter swell under a cold clear sky, a warm night round the fire. Pick what the day calls for; the hour of the day changes from frame to frame."
inhabitants = "Grown women at the centre, in their twenties and thirties: surfers, a lifeguard, the singer with the combo, the woman who shapes boards in the back of the shack, a photographer for a surf magazine, a dancer who wins every contest on the boardwalk, each with her own face, hair and swimsuit; grown men who surf, lifeguard, play in the band or ride with the motorcycle club, the club's leader played for laughs, and the developer in a suit on the sand; pelicans, sea lions and sand crabs. Nobody in this world is a child or a teenager. They are as often dancing, swimming, flirting or asleep on a towel as surfing."
strangeness = "The strange is goofy and sunny: a dog that surfs better than anyone, a sea lion that turns up at the dance, a wave that seems to wait for one surfer, a jukebox that plays the right song before anyone picks it. People laugh and paddle back out."
numinous = "The sacred is the ocean itself, with a body you can touch: the big swell that comes once a summer, a sea cave at the point, a carved driftwood figure the surfers pat for luck before they paddle out. Painted in the same flat poster colour as everything else, never a beam or an aura."
dread = "This world at its darkest is the sea and the rivals: a wipeout on the reef, a board snapped in two, a storm swell flattening the shack's deck, a riptide, the motorcycle club roaring in to break up the bonfire, the developer's bulldozer at the edge of the dunes. Rowdy and loud, never violent and never a crime, and the frame does not take sides."
favoured_actors = "Grown women alone, in pairs or in a crowd, close enough to fill much of the frame: a surfer running into the shorebreak with her board, a woman riding the nose of a wave, two friends laughing on a wagon's tailgate, a dancer mid-twist on the boardwalk, a lifeguard on watch, a woman flipping a rival's board over as a prank. Surfers, the band, the shack owner and the motorcycle club round them out. A woman on a towel posing for the viewer is this genre's most worn image and should not be the default, and neither is the same woman with a board facing the viewer in every frame."
myth = "The Hawaiian tradition of wave-riding and its sea gods, Southern California surf lore (the secret break, the once-a-summer swell, the wave nobody rode), the Pacific's sailor and mermaid stories, the Western showdown replayed as a contest, and the rock-and-roll and surf-guitar songs of summer love, rivalry and the last day before the season ends."
highlight = "The thing the eye finds first: a moment of nerve, fun or glamour caught at its peak, or the sea doing something too good to be true. Today's kind of wrongness is given with this definition. Painted as flatly and brightly as everything else."
highlight_modes = [
  "a wave bigger, bluer or more perfect than the day allows",
  "a prank or a stunt frozen at its peak",
  "something from the sea come ashore where it does not belong",
  "an entrance that stops the whole party",
  "a board, a wagon or a motorcycle doing something it cannot",
]

[malibu.brief]
signature = "SIGNATURE — at least one thing marks this as the 1963 Southern California beach-party coast, named explicitly: a long wooden surfboard, a wood-panelled station wagon with boards on the roof, a beach shack with a jukebox, a lifeguard tower, or surf breaking at a rocky point. It may be the highlight or the actor. No more than one of pier or lifeguard tower per frame. A frame that could be any modern beach, or any crime or noir scene in the sun, is a failed response."
allure = "ALLURE — the subject is always a woman, a grown adult. Whenever people are in frame, the lead figure is a sun-tanned grown woman painted with this poster's glamour, showing plenty of skin: in the water or on the sand she is in a swimsuit (a one-piece as often as a two-piece, its cut and colour her own and never blue, turquoise or the sun's yellow), at the shack or the dance in something just as bare, shorts and a swimsuit top, a short shift, an open shirt over a swimsuit. Bare shoulders, legs and midriff, wet skin and wet or wind-tossed hair, her hair worn her own way. She is laughing, dancing, paddling, running or riding a wave rather than holding a pose for the viewer. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of fully covered, plain or faceless figures, is a failed response."
mischief = "MISCHIEF — trouble here is weather, surf and rivals: a wipeout, a dunking, a race, a prank, a dance-off, a showdown at the contest, a storm on the beach. Nobody carries a weapon, nobody bleeds, nobody is in real danger, and the mood is carefree even on a hard day. A frame with a gun, a knife, blood, a body, a crime or real menace is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: a beach charter falls into sunset on every mid band and a moon on
# every night. mid keeps the sun high on one side; lo keeps the night lit by
# the party, not the sky. hi keeps the global full-day line.
[malibu.light]
lo = "Night on the beach: the light comes from a bonfire, the shack's string of bulbs or the boardwalk lights, never from the sky, with at least half the frame dark sand, dark water and dark sky. A sunset, or a frame lit evenly, is a failed response."
mid = "Morning or afternoon sun from one side, high enough that the sky stays blue, white with haze or grey with fog, throwing clear shadows across sand, boards and bodies. A setting sun, a sun on the horizon, or an orange or pink sky is a failed response."

