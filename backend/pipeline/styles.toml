# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): a
# sibling of [funk] moved out of the city to the 1970s rural South of the
# drive-in moonshine-and-car-chase pictures: trailer parks, honky-tonks, dirt
# tracks, lakes and county roads, with knockout women at the centre who run
# the shine, drive the cars and win the fights. The frame loves these people
# and never sneers at them. Glamour is pin-up, never explicit, and every
# woman is a grown adult. The sheriff chasing a car is demoted, and the
# palette is sun-bleached so it does not read as funk's night-neon.
[smokeshow.world]
era = "The back country of the American South in 1977, hotter and wilder than it ever really was: county roads, trailer parks, honky-tonks, bait shops, dirt tracks, a drive-in at the edge of town and a lake where everybody ends up. Technology is the V8, the CB radio, the eight-track, the pickup, the copper still and the shotgun, and everybody knows how to fix all of it."
materials = "Sun-browned skin, chrome and candy paint first, then faded denim, cutoffs and tied-up flannel, cowboy boots, aluminium siding, rust, red dirt, cheap beer cans, mason jars and lake water."
physics = "Cars are the law of nature here: a car can jump a creek, a bridge, a barn or a roadblock and land running, and nothing on four wheels ever runs out of gas in a chase. Heat is a presence: haze off the blacktop, sweat on every face. Light is sun, sunset, headlights, a bonfire, a porch bulb or a neon beer sign, and nothing glows of its own accord. Fights are wild and funny, never gore."
society = "Families and feuds, moonshiners and the revenuers after them, a crooked county boss and his deputies, truckers on the CB, mechanics, waitresses, preachers and bands. Days here are lake days, fish fries, county fairs, demolition derbies, tent revivals, Saturday-night dances and drive-in double features as much as the run."
weather = "The whole Southern sky: a white-hot noon, a thunderhead rolling over a field, a tornado on the horizon, a muggy night full of bugs round the porch light, rain on a tin roof, a red sunset over the lake, fog in the hollow at dawn. Pick what the day calls for."
inhabitants = "Gorgeous grown women at the centre: moonshine runners, mechanics, waitresses, roller-rink queens, singers, sharpshooters and sisters out for payback, each with her own face; the good old boys who ride with them, truckers, preachers and a bluegrass band; and against them the county boss, his deputies and the revenuers. Hound dogs, gators, catfish and a pet raccoon round them out. They are as often swimming, dancing, drinking or laid out on a car hood in the sun as running from the law."
strangeness = "The strange is drive-in excess nobody questions: a car flying over a river, a bar fight that clears the county, a woman who outdrives the whole state patrol. People crack another beer and holler."
numinous = "The sacred has a body and a loud voice: a tent revival preacher with a snake held high, a gospel choir under a big top, a roadside cross with plastic flowers, a baptism in the river. Never an aura or a beam."
dread = "This world at its darkest is the bust and the feud: a still blown up in the woods, a car upside down in a ditch, a trailer burning, a shotgun on the porch at night, the boss's men at the door. Fast and rowdy, never gore, and the frame does not take sides."
favoured_actors = "Knockout grown women alone, in pairs or in a crew, close enough to fill much of the frame: a runner leaning on her car at a gas pump, sisters on a dock with their feet in the lake, a mechanic under a hood, a singer on a honky-tonk stage, a crew piling into a pickup. Friends, bands, crowds at the fair and hound dogs round them out. A sheriff's car chasing a hot rod is this genre's most worn image and should not be the default, and neither is the same girl in a bikini facing the viewer in every frame."
myth = "Appalachian and Southern folklore and its outlaws, the moonshine and bootlegging legends, tall tales, Southern Baptist and Pentecostal revival, country, bluegrass and Southern rock ballads of love and cheating, and the drive-in revenge picture."
highlight = "The thing the eye finds first: a moment of nerve, glamour or payback at its peak, or something gloriously impossible done with a car. Today's kind of wrongness is given with this definition. Painted as boldly and brightly as everything else."
highlight_modes = [
  "a car in mid-air where no car should be",
  "an entrance that stops a whole honky-tonk",
  "a fight or a stunt frozen at its peak",
  "an everyday object turned into a getaway or a weapon",
  "the revival's spirit made flesh",
]

