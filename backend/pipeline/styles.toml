[cabaret.registers]
"botanical" = "Plants as luxury: an orchid on a dressing-table, a hothouse of palms in a hotel lobby, a gangster's funeral lilies. Its highlight: a flower worn as a threat."
"bodily and anatomical" = "The body as the show: a bare back at a dressing-room mirror, a stockinged leg on a stair, a boxer's taped fists, lipstick on a glass. Never gore."
"fungal and decaying" = "Decay as the morning after: a wilted corsage, crushed feathers on a dance floor, a revue palace's dusty velvet seats."
"animal and creaturely" = "Animals of the rich night: a lapdog in a jewelled collar, a pet monkey on the bar, swans on the lake, a white fox stole with its glass eyes."
"geological" = "Stone as the city's luxury and weight: marble baths and staircases, granite embankments on the Spree, the white sand of the lido."
"metallic and ore" = "Metal kept bright and close: a gold cigarette case, a silver powder compact, a chrome bar rail, a pistol with a mother-of-pearl grip."
"glass and ceramic" = "Glass of the bar and the dressing room: a tower of champagne coupes, a mirror ringed with bulbs, a crystal decanter, a smashed shop window."
"architectural" = "The deco city: a revue palace's mirrored staircase, a cellar club down six steps, a grand hotel's marble hall, a rooftop terrace over the lit boulevard."
"domestic interior" = "Rooms of the night people: a dressing room strewn with costumes, a hotel suite with an unmade bed at noon, a boss's office with a safe behind a painting."
"mechanical" = "Machines of speed and noise: an open roadster, a taxi, a gramophone, an electric fan, a revolving stage."
"industrial and infrastructural" = "The city's guts at the edge of the party: the elevated railway on iron columns, a gasworks by the canal, a radio mast over the roofs."
"agricultural and cultivated" = "Country at the city's edge: allotment gardens with summer huts, a beer garden under chestnuts, a market wagon of cut flowers at dawn."
"aquatic" = "Water as play: the Wannsee in summer, a hotel pool, a bath run for a hangover, rain in the gutter outside the club."
"atmospheric" = "City air: cigarette smoke under a lampshade, a spotlight beam through haze, fog off the Spree, steam off a bath."
"glacial and frozen" = "Berlin winter: ice on the canal, snow on a fur collar, breath in the cold outside a club, ice in a champagne bucket."
"fire and ember" = "Fire as light and as ruin: a match cupped for a cigarette, flaming crêpes at a supper club, a cellar club burning, love letters in a stove."
"textile and fiber" = "Clothes as the costume of the night: sequins, silk stockings and garters, an ostrich-feather fan, a fur over a slip, a satin robe."
"ritual object" = "The sacred and the superstitious: a carnival mask, a fortune teller's cards, a club's silver loving cup, a horseshoe over a dressing-room door."
"paper and inscription" = "Paper as leftover and as evidence: old inflation notes as confetti, a pawn ticket, a love letter in a handbag. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and the night's accounts: a saxophone, a white piano, a drum kit, a roulette wheel, a jeweller's loupe on a stolen necklace."

[cabaret]
label = "Berlin Cabaret"
suffix_base = "A lush painted 1920s Berlin revue and film poster in rich gouache and oil: luminous modelled skin with soft blended shading, satin, sequins and feathers painted close enough to feel, deep velvety blacks, and metallic gold and silver inks that catch the light. Art deco geometry shapes the composition (sunburst rays, stepped arches, fans and chevrons in gold behind the figures). A palette of deep black, silver, oxblood and lipstick red, emerald, peacock blue, powder pink and ivory, with gold kept for the deco geometry, the light fittings and the champagne rather than every gown. Warm theatrical light from one side, spotlight or lamplight, with sparkling highlights. The picture fills the frame edge to edge as the poster itself, on lithographic paper with a fine grain and a soft printed sheen. Not photographic, not digital and not flat graphic shapes. No text, title, letters or numbers anywhere, including on signs and posters inside the scene."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties with an adult face and figure, painted as a glamorous 1920s pin-up with a knowing, heavy-lidded look, rouged lips and glowing skin, each woman with her own face, build and outfit; her hair colour and cut are the ones the brief gives her, platinum, black, chestnut, honey-blonde or dark as often as red, and auburn finger waves are not the default. Men are sleek in evening clothes and secondary to her. Glamour is decadent and suggestive, never explicit, with no exposed breasts or genitals. People are painted with affection, never caricatured or grotesque."
