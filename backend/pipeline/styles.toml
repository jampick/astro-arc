[calendario.registers]
"botanical" = "The valley's plants as ornament and as offering: a blue-grey maguey taller than a person, a heap of dahlias on a market mat. The valley's flowers are dahlias, water lilies, cosmos, zinnias and morning glory; marigolds are never in this valley. Flowers are painted brighter and more perfect than any real field. Its highlight: a bloom out of its season."
"bodily and anatomical" = "The body as the calendar's ideal: a shoulder and throat catching the sun, a warrior's arm on a spear. Each face individual and each body grown, never a type. Never gore."
"fungal and decaying" = "Decay as the legend's sorrow: an abandoned temple taken by vines, a fallen idol half in the lake. Even ruin is painted clean and bright."
"animal and creaturely" = "Animals as omens and companions: a heron lifting from the canal, a deer stepping out of the pines. They arrive at the moment the story needs them."
"geological" = "Volcanic ground: a black lava field with flowers in its cracks, a cliff of red stone above the lake. Its highlight: a lava field still warm underfoot."
"metallic and ore" = "Gold and copper of the court: a gold collar, copper bells on an ankle, a hammered disc on a warrior's chest. Polished, never tarnished."
"glass and ceramic" = "Obsidian and clay: an obsidian mirror, a painted cup of chocolate, a polished black bowl."
"architectural" = "The legendary city and the painters' countryside: stepped pyramids with temples on top, the canals and their bridges, a ranch's white arches with a bell tower."
"domestic interior" = "A house open to the sun: a reed mat and a hearth with a clay griddle, a loom in a courtyard, flowers in a jar in a doorway."
"mechanical" = "The few machines of this world: a backstrap loom, a spear-thrower, the scales at the market, a mill's water wheel."
"industrial and infrastructural" = "The works that hold the lake city up: causeways, the aqueduct from the hills, the dike against the flood, the landings at the market."
"agricultural and cultivated" = "Fields shaped by hand: floating gardens heaped with flowers and squash, terraces of corn up a slope, a maguey field in straight rows to the hills."
"aquatic" = "The lake and its canals: still water holding the whole sky, a spring under a cypress, reeds bending over a canal."
"atmospheric" = "The high valley's air: towering white cloud, smoke rising from the temple braziers, dust raised by a procession on the causeway."
"glacial and frozen" = "Cold in a warm valley: hail heaped white in the gardens after a summer storm, frost on the corn at dawn, ice carried down from the heights in reed baskets for the market."
"fire and ember" = "Fire as sacred and as warning: a brazier on top of a pyramid, the New Fire carried by torch along the causeway."
"textile and fiber" = "Cloth as glamour and as wealth: a cape of green feathers, a sash woven in the pattern of her town."
"ritual object" = "The sacred made by hand: a carved serpent's head, a rain god's jar, a mask of jade."
"paper and inscription" = "Painted books folded like screens, glyphs carved on a stele, a tribute list on bark paper. Writing appears as marks and pictures, never a readable sentence."
"instrument and measure" = "Music and the count of days: a conch trumpet, a slit drum, clay flutes, a guitar hung by a doorway, the great carved stone of the calendar."

[calendario]
label = "Calendario"
suffix_base = "The painted picture from a 1940s Mexican printer's calendar, cropped to the image alone with no calendar pad below it: a smooth, idealised oil painting, soft sculpted modelling with no visible brushstrokes, saturated cobalt, emerald, crimson, golden yellow and terracotta at full strength, heroic and sentimental. The printed surface shows: a fine four-colour halftone dot rosette visible in the skin and sky, slight cyan and magenta misregistration fringing at the edges of shapes, ink sitting flat and a little chalky on a warm cream uncoated stock, a faint fold line or pinhole at the top edge. Not photographic and not digital. No text, numerals, lettering or imprint."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties, painted with idealised calendar glamour, warm glowing skin and a knowing or faraway look, each woman with an individual face, skin tone, build, hair and dress of her own, never a type or a costume; her hair worn her own way (braided with coloured ribbon, wound up on her head, or loose); her dress shows her off (bare shoulders, a plunging neckline, a high slit) and is thick dyed cotton that stays fully opaque, wet or dry, nothing visible through the cloth. Men are secondary to her: warriors, traders, musicians. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals. People are painted with affection and dignity, never caricatured."
space = [
  "through a crowded lakeside market to the boat landing",
  "across a temple courtyard to a doorway hung with feathers",
  "along a causeway thronged with traders to the city gate",
  "along a canal between floating gardens to a stone bridge",
  "from a canoe on still water to the far shore's pyramids",
  "down a straight row of maguey to a whitewashed chapel on the next rise",
  "up a terraced hillside of corn to a shrine at the top",
]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): East
# Los Angeles in 1979, the car clubs and the Sunday-night cruise on Whittier
# Boulevard, the backyard garages, the concrete river channel, the rented
# halls. The medium is the scene itself: every picture is an airbrushed
# candy-paint mural on a hood or trunk lid, with the bodywork's swell, panel
# lip, chrome trim and pinstripes showing at the edges. Smoke Show's urban
# cousin. The glamour is the period's own commercial art (1970s hood murals
# and van art), never exoticism, and her clothes are 1979 clothes, never a
# feathered costume. Glamour is pin-up, never explicit, and every woman is a
# grown adult. The halls are booked for weddings, anniversaries and club
# dances only: the fifteenth-birthday party, families with kids, the public
# pool and anything school-aged are written out of this world on purpose,
# since the word alone pulls a figure young. The Virgin and the saints are
# painted with reverence and never get the glamour treatment. No artist,
# film, studio or club names, since whatever a charter names turns up.
#
# Revised 2026-10-13 after review: La Llorona cut (her story is drowned
# children; muertos keeps her in its myth line); the volcano lovers cut and
# demoted, since they are the stock hood mural and Calendario's demoted image;
# Day of the Dead cut back to one home ofrenda so it stays muertos'
# territory; sunset cut to one mention, last in weather; the car-draped pose
# cut to one rest verb and one favoured-actor example; hard verbs pointed at
# the law, the freeway and the machine instead of a gang stereotype; the
# fixed face kit and the fixed men's kit replaced with individuals; the
# palette base and reflections left to the scene so noon and rain keep their
# light; the hood's swell, centre ridge and panel gap written into the
# suffix; registers cut to two examples and repeated nouns deduped. The man
# in a white T-shirt beside a hopping car and the warrior carrying a sleeping
# woman before two volcanoes are both demoted.
[lowrider.world]
era = "East Los Angeles in 1979, the year the sheriff started closing Whittier Boulevard to the cruise: car clubs, a boulevard full of slow cars on a Sunday night, backyard garages, a concrete river channel, freeways over the neighbourhood and rented banquet halls. Technology is the hydraulic pump and the switch box, the airbrush, the AM radio and the cassette in the dash, and it is all built and painted by hand in somebody's garage."
materials = "Candy paint over metalflake, chrome and gold plate first, then crushed velvet and tuck-and-roll upholstery, wire wheels and thin whitewalls, satin and creased khaki, stucco, chain-link, poured concrete, palm trunks and hand-painted signs."
physics = "A car on hydraulics is a body that can dance: it can rise, drop, lean, hop higher than a man and stand on its rear bumper, and the crowd treats that as weather. Nothing here moves fast; the cruise is low and slow. Light is noon glare, streetlamps, storefront neon, headlights, sodium lamps on the freeway, a helicopter's searchlight or a candle, and nothing glows of its own accord, though candy paint and metalflake catch every one of them. Violence is menace and aftermath, never gore."
society = "Couples, cousins, aunts and grandparents and car clubs, each club with its own colours and its own rules; painters, upholsterers, chrome platers and the people who build the pumps; panaderías, record shops, a boxing gym, a funeral home and the church on the corner; the sheriff's deputies who want the boulevard empty. Days here are car shows in the park, Sunday waxing in the driveway, backyard cookouts, weddings and anniversary dances at the hall, oldies on the radio and the slow drive past everyone you know as much as the work in the garage."
weather = "The whole Los Angeles sky: a white-hot August noon, Santa Ana wind blowing grit down the street, the grey of a June morning, a rare winter rain filling the gutters, a warm night with the freeway humming, a smog sunset gone orange. Pick what the day calls for."
inhabitants = "Gorgeous grown women at the centre: car club presidents, airbrush painters, mechanics who build the pumps, upholsterers, singers who work the hall dances, waitresses at the burger stand, boxers and women out to settle something, each with her own face, build, hair and style, never a type or a costume. Around them their club brothers, grown cousins, grandmothers at the window, old men at dominoes, musicians and the deputies. Pigeons, roosters and coyotes keep to the edges. Nobody in this world is a child. They are as often dancing, eating, waxing the car or fanning themselves on a porch as working."
strangeness = "The strange is the cruise's own excess and nobody blinks: a car that stands on its back bumper all night, a painted woman on a hood who has turned her head since you last looked, a boulevard so packed it moves at walking pace for a mile. People turn the radio up and keep rolling."
numinous = "The sacred has a body and a candle: the Virgin of Guadalupe painted on a garage wall with roses at her feet, robed and serene as on a home altar, one ofrenda of photographs and candles on a living-room dresser, an Aztec warrior stepping off a painted garage door, a woman in white seen on the riverbank at night who is gone when the headlights reach her. Painted in the same candy colour and airbrush glow as everything else, never a beam or an aura, and never a glamour figure."
dread = "This world at its darkest is the boulevard shut down and the night going wrong: sheriff's barricades across the street, a helicopter's searchlight pinning a car, a car burning under the bridge, a wake at the funeral home with the club parked outside, a bulldozer at a house in the freeway's path. Menace and aftermath, never gore, and the frame does not take sides."
favoured_actors = "Knockout grown women alone, in pairs or in a crew, close enough to fill much of the frame: a club president leaning on her fender at a car show, a painter masking a hood in her garage, a singer at the hall mic, a woman dealing lotería at a kitchen table, a crew rolling three-wheeled down the boulevard. Club brothers, couples, grown cousins at a cookout and old men at dominoes round them out. A car hopping beside a man in a white T-shirt is this world's most worn image and should not be the default, and the warrior carrying a sleeping woman before two volcanoes, the hood mural's most copied picture, should not be the default either; neither is the same woman in a swimsuit draped over a hood facing the viewer in every frame."
myth = "Mexica myth, the Fifth Sun and the feathered serpent; Aztlán, the homeland the Chicano movement claimed; Our Lady of Guadalupe; the corrido; the soul and doo-wop love ballads the boulevard calls oldies; and the glamour of 1970s hood murals and van art."
highlight = "The thing the eye finds first: a moment of style, nerve or devotion at its peak, or something gloriously impossible done by a car or by paint. Today's kind of wrongness is given with this definition. Painted as smoothly and brightly as everything else."
highlight_modes = [
  "a car doing what no pump should let it",
  "a painted figure halfway out of the paint",
  "an entrance that stops the whole boulevard",
  "a reflection in the chrome that shows another night",
  "a standoff held at its tightest moment",
]

[lowrider.brief]
signature = "SIGNATURE — at least one thing marks this as East Los Angeles in 1979, named explicitly: a lowered car with candy paint, wire wheels and thin whitewalls, a car raised high on its hydraulics, a satin club jacket or a chain steering wheel, or the concrete river channel under the freeway. It may be the highlight or the actor. A frame that could be any modern city, or the 1970s Southern back country, is a failed response."
bodywork = "BODYWORK — the frame itself is a painted car panel: the scene is an airbrushed mural on a hood or trunk lid, and at least one edge of the frame shows that panel's curve, its rolled lip and panel gap, a strip of chrome trim or a pinstriped border. This is the surface the picture is painted on, not a car standing in the scene. Inside the mural, cars appear as cars on the street, never as another painted panel. A flat painting with no bodywork at its edges is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

