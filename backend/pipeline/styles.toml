signature = "SIGNATURE — at least one thing marks this as the 1970s Southern back country, named explicitly: a candy-painted muscle car or jacked-up pickup, a trailer with a porch, a honky-tonk sign, a mason jar of shine, or a CB radio handset. It may be the highlight or the actor. A frame that could be any modern small town, or the 1970s city, is a failed response."
