[malibu.registers]
"botanical" = "Plants of a sunny coast: ice plant blooming on the dunes, palms along the coast road, eucalyptus on the bluff. Its highlight: a plant doing something only a perfect summer could make it do."
"bodily and anatomical" = "The body as sun and play: salt drying on a shoulder, a tan line, a laugh mid-dance, a scraped knee from the reef. Never gore."
"fungal and decaying" = "Decay as beach wear: pier pilings furred with mussels and weed, a sun-rotted dory in the dunes, kelp drying on the sand."
"animal and creaturely" = "Creatures of the coast: pelicans skimming the swell, sea lions on a buoy, a dog digging at the tideline, sand crabs in the backwash."
"geological" = "The coast's rock and sand: a rocky point where the surf breaks, tide pools, a sea arch, sandstone bluffs over the cove."
"metallic and ore" = "Chrome and brass of a summer: a motorcycle's tank and pipes, a wagon's bumper, a lifeguard's whistle, a bottle opener nailed to the shack."
"glass and ceramic" = "Glass of the shack and the sea: soda bottles sweating in a cooler, sea glass in the sand, sunglasses pushed up into her hair, a green glass float in the shorebreak."
"architectural" = "The built beach: a weathered board shack on stilts, the pier and its bait house, the boardwalk dance pavilion, a beach house of glass and redwood on the bluff."
"domestic interior" = "The beach house inside, open to the sea: boards stacked in the hall, a sandy rug, a record player on a crate, swimsuits drying over a chair."
"mechanical" = "Machines of fun: a wood-panelled station wagon, a motorcycle, the jukebox, a transistor radio, an outboard on a dory."
"industrial and infrastructural" = "What the coast runs on: the coast highway on its bluff, a breakwater of piled rock, a storm drain out onto the sand, the developer's bulldozer at the dunes."
"agricultural and cultivated" = "Food and gardens by the sea: an avocado grove up the canyon, a fruit stand on the coast highway, a fish fry on the sand, a lemon tree in a beach-house yard."
"aquatic" = "Water as the whole point: the swell at the point, the shorebreak, a glassy morning wave, a tide pool, a rip current along the point."
"atmospheric" = "Coastal air: June fog, offshore wind blowing spray back off a wave, sea haze, spray hanging over the point."
"glacial and frozen" = "Cold as relief and as winter: ice in a cooler, a snow cone at the shack, a cold winter swell, goosebumps after a dawn session."
"fire and ember" = "Fire as the night's party: a bonfire ring, hot dogs on sticks, a lantern on the shack porch, a grill on the sand."
"textile and fiber" = "Cloth for sun and water: a towel spread on the sand, a striped umbrella, an open shirt over a swimsuit, a leather jacket on a biker, trunks drying on the rail."
"ritual object" = "Lucky and sacred things: the carved driftwood figure at the point, a lucky fin kept from an old board, the contest trophy, a shell necklace."
"paper and inscription" = "Paper of the summer: the contest entry sheet pinned to the shack, a postcard, a snapshot. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and the surf's measures: an electric guitar and its amp, bongos, a tide chart, the contest judge's stopwatch."

[malibu]
label = "Malibu 1963"
suffix_base = "The painted picture of a 1960s beach-party movie poster, the art alone filling the frame edge to edge, seen flat and straight on, with no border, title block or blank panel. Gouache laid in big flat, posterised areas of colour with crisp painted edges and a loose dark brush outline, two-tone modelling with almost no blending, skin in two or three flat tones rather than glossy rendering, figures in lively mid-action poses. By day a sunny palette of turquoise, coral, sunshine yellow and clean white with sand beige; shadows are flat cool blue, never black. When the scene is at night the sky is flat deep navy and the warm light of the fire or the bulbs is the only bright colour. Coarse halftone dots show in the sky, the sand and the shadows on skin. The print is sun-faded unevenly, paler toward one edge, with fine scuffs and grit scratches from sand across the surface. Cheerful, not noir, not airbrushed, not photographic, not digital and not 3D-shaded. No text, title, credits or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties with an adult face and figure, painted as a 1960s beach-party poster star, sun-tanned, laughing, dancing or riding a wave rather than posing, with sun on bare shoulders and legs and wet skin; in 1963 swimwear or beach clothes cut to show her off and chosen for where she is, each woman with an individual face, build, skin tone and expression of her own (a grin, a sly look, fierce concentration, a shout); her hair changes from woman to woman in colour, length and style, fair, red or dark, cropped short as often as long, tied up as often as loose; her swimsuit's cut and colour are picked fresh for her, a two-piece as often as a one-piece, and never blue, turquoise or plain red; men are rangy grown surfers or leather-jacketed bikers played for laughs. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals."
space = [
  "from the board shack's open deck across the sand to the surf line and the point",
  "down the length of the pier to surfers waiting on the swell beyond it",
  "from the top of a lifeguard tower along a curving beach of towels and umbrellas to the headland",
  "along the coast highway above the cove to wagons parked on the bluff",
  "from inside the curl of a breaking wave out to the beach",
  "across the boardwalk dance floor to the sea beyond the railings",
  "from a rocky point across the cove to a bonfire ring on the sand",
  "through a wagon's open tailgate down the dunes to the shorebreak",
]
