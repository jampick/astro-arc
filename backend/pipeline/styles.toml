  "from a rooftop garden terrace with lanterns over the chimneys and domes of the city at night",
]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Reno in
# 1977, the casinos, a boxing card, motels on the old highway, and the
# interstate out to the desert and the cold high-desert night, printed as a
# pinball backglass: flat inks screen-printed in reverse on glass and lit from
# behind, hot where hidden bulbs sit, flaking at the edges. The marker is light
# coming through the picture rather than falling on it. The casino is one
# setting among several, so this world stays apart from [havana]; the motel
# pool and the lounge belong to [paperback] and are kept to one field each.
# Glamour goes as far as [smokeshow] and [floating] and no further: pin-up and
# suggestive, never explicit, and every woman is a grown adult. Showgirls wear
# fully covered costumes. Nobody in this world is a child, on purpose. The
# chorus line kicking on stage is demoted. No artist, film or studio names,
# since whatever a charter names turns up in the picture.
#
# v2, 2026-10-13, after review: garments out of suffix_figures and allure
# (the smokeshow v1 outfit-menu failure), feathers, fishnet and rhinestones
# left in the textile register only; showgirl costume rule added; physics now
# light and speed, not luck; havana and paperback verbs and nouns replaced;
# each example noun (craps table, slot machine, diving board, dice, pool) kept
# to one field; GLASS rewritten so hot spots are pools in the ink, never drawn
# bulbs or a halo; suffix_base loses "stained glass", the reflection and the
# pinball furniture; mid band no longer a sunset; Paiute myth dropped.
#
# v3, 2026-10-13, after sweep pr-backglass: the showgirl wore the same sequinned
# leotard and plumes in 7 of 8 frames, even where the prompt said out of
# costume, so the costume rule now applies on stage only; three frames turned
# her back to the viewer, so that pose is demoted; one frame put bruises on her
# bare legs, so injury now belongs to the fighters and never to her body.
[backglass.world]
era = "Reno, Nevada in 1977, louder and faster than it ever really was: casinos open all night along the main street, the river running through downtown, wedding chapels, pawnshops and motels strung along the old highway, a boxing card at the arena, and the interstate running east into the desert past the lakes and the old silver-mining towns in the hills. Technology is the slot machine, the marquee of chasing bulbs, the convertible, the CB radio and the pay phone, and everybody believes they have a system."
materials = "Bulb glass, chrome, neon tube and green felt first, then clay chips, velvet rope, mirrored ceilings, turquoise pool tile, vinyl, sequins, sagebrush, alkali dust and white desert rock."
physics = "Speed and light are the laws here: a car can outrun the dawn across the flats, a punch can lift a fighter off the canvas, and every lit thing burns brightest at its centre and fades toward its edges. Light comes through things rather than off them: marquees, neon, headlights, the ring lamps, the desert sun through a windshield. Nothing glows without a bulb, a flame or the sun behind it. Nobody flies. Violence is menace and aftermath, never gore."
society = "A town that never closes and lives on other people's weekends: the casinos and the men who own them, pit bosses, dealers, cocktail waitresses, the showroom company, fight promoters, pawnbrokers, wedding-chapel ministers, motel managers, Basque boarding houses with long family-style tables, cowboys in from the ranches and the house's muscle. Days here are summer days on the river, the rodeo, the air races, all-you-can-eat buffets at four in the morning, a drive up to the lake, a wedding on a whim and a good night at the tables as much as the hustle."
weather = "The high desert's whole range: a white-hot noon on the highway, a thunderstorm walking across the sagebrush, a dust storm on the interstate, a cold clear night with every bulb on the street burning, snow on the casino roofs and the mountains, a grey snow-light afternoon on the main street, a hot wind off the dry lakebed. Pick what the day calls for."
inhabitants = "Gorgeous grown women at the centre, in their twenties to their forties: showgirls, dealers, cocktail waitresses, lounge singers, keno runners, cardsharps, divorcées waiting out their six weeks, a fight manager and a getaway driver, each with her own face; the men around them, high rollers, pit bosses, fighters, cowboys, sheepherders and the boss's muscle; wild horses, coyotes, jackrabbits, white pelicans on the desert lake and the casino cat; and the ghosts of the silver rush up in the old mining town. Nobody in this world is a child: it is a town for grown-ups after dark, and the families stay home. They are as often swimming, driving, dancing or asleep in the sun as working."
strangeness = "The strange is excess that nobody questions: a fighter who gets up at the count of nine every round, a motel sign that lights itself for one guest, a highway that runs one mile longer at night. People light another cigarette and order another round."
numinous = "The sacred has a body: Lady Luck as a woman in silver standing at the end of the bar whom nobody saw come in, a plaster angel over a wedding-chapel door, a neon cowboy on a casino roof who has turned his head by morning, the bell of the mining-town church on the hill. Printed in the same flat inks and lit from behind like everything else, never a beam or an aura."
dread = "This world at its darkest is the bust and the long drive: a marker called in by two men in the parking lot, a fighter down under the ring lamps, a car idling in the desert at night with its headlights off, a pawnshop window full of other people's guitars, the marquee going dark bulb by bulb, a woman's last chip on the table. Menace and aftermath, never gore, and the frame does not take sides."
favoured_actors = "Knockout grown women alone, in pairs or with one man at the edge of the frame, close enough to fill much of it, a different kind of woman at the centre from frame to frame: a showgirl between shows lighting a cigarette at the stage door, a dealer fanning a deck, a woman in a swimsuit sunning on a casino rooftop deck, a keno runner crossing the floor with a fistful of tickets, a high roller in a plunging gown in the front row on fight night, a getaway driver at the wheel on the desert highway. Fighters, cowboys, pit bosses and the crowd round them out. A chorus line of matching dancers kicking on a stage is this genre's most worn image and should not be the default, and neither is the same woman facing the viewer in every frame, nor a woman seen from behind looking back over her shoulder."
myth = "Western tall tales and the legends of the silver rush, gamblers' luck lore (Lady Luck, the hot hand, the jinx, the system that cannot lose), the prizefight's rise and fall, the Western showdown, and the lounge ballad of the big night and the morning after."
highlight = "The thing the eye finds first: a moment of speed, glamour or menace at its peak, burning brightest where a hidden bulb sits behind the glass. Today's kind of wrongness is given with this definition. Printed in the same flat inks as everything else."
highlight_modes = [
  "one bulb behind the glass gone dark exactly where something should be",
  "a figure printed on the glass who has turned to look out through it",
  "the desert coming indoors (sagebrush, dust or a wild horse among the tables)",
  "a miner from the silver rush taking his seat at the table",
  "a jackpot paying out in something that is not money",
]

[backglass.brief]
signature = "SIGNATURE — at least one thing marks this as Reno in 1977, named explicitly: a slot machine's chrome handle, a marquee of chasing bulbs, a craps table, or a wild horse herd crossing the interstate in headlights. It may be the highlight or the actor. Marquees and signs are patterns of bulbs and arrows, never letters. A frame that could be any modern casino, the 1970s city or the Southern back country is a failed response."
allure = "ALLURE — the subject is always a woman, a grown adult. Whenever people are in frame, the lead figure is a knockout grown woman painted with this genre's glamour, dressed for where she is (the showroom, the pool, the tables or the road), with bare shoulders, long legs and a knowing look, in a pose of play, nerve or ease rather than one held for the viewer, and not turned away showing her back. On stage a showgirl wears a fully covered rhinestone costume or a sequinned leotard, never pasties or a bare chest; off stage she is in her own clothes for where she is, never the stage costume, plumes or headdress. Her skin is unmarked: bruises, cuts and split lips belong to the fighters, never to her. If the actor named below is a man, paint a woman in the same role instead. Always clothed; never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain or faceless figures, is a failed response."
glass = "GLASS — the picture is lit from behind: the ink itself brightens in at least three soft, uneven pools where hidden bulbs sit, with no bulb, disc, ring, flare or orb drawn in the picture. The brightest pool sits off-centre, behind the highlight or beside the lead figure, never centred behind a head. Shadow is darker ink, never a shadow cast by those pools. A frame lit evenly from the front, or one with a halo behind a figure's head, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global high-exposure line asks for light even across the frame,
# which a backlit glass with hot spots cannot hold. Every band keeps the hot
# spots; exposure changes the scene's own light around them. The mid band is
# kept off sunsets on purpose (the smokeshow v1 sunset-strip failure).
[backglass.light]
lo = "Night on the strip or out in the desert. At least two thirds of the frame is dark ink, and the only light is the scene's own (marquee bulbs, neon, headlights, the ring lamps) burning through the glass. A frame that is mostly well lit is a failed response."
mid = "Inside the casino, the showroom, the arena or a motel room, or outdoors under cloud, storm or snow light: lit and dark areas both substantial, with the hot spots behind the glass doing most of the work. A sunset sky is a failed response unless the weather calls for one, and so is a frame in flat, even light."
hi = "Hard desert daylight on the river, on the highway or at an outdoor fight: bright flat colour over most of the frame and short dark shadows, with the hot spots behind the glass still brighter than the sky. A frame that is mostly dark, or lit by a setting sun, is a failed response."

