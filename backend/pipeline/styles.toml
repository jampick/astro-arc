[velvet.registers]
"botanical" = "Flowers and palms as ornament and shade: a hibiscus worn in the hair, a frond black against a red sunset. Petals take the light more brightly than anything near them."
"bodily and anatomical" = "The body as the warm centre of the dark: a shoulder, a hand, a face sculpted by one light. Calm and individual, never a type."
"fungal and decaying" = "Rot as the tropics' fast turn: a fallen breadfruit in the dark, a wreck's timbers going soft on the reef. Quiet and warm, never foul."
"animal and creaturely" = "Animals as neighbours and quarry: a crab crossing the lamplit sand, a turtle in black water. They come into the light and leave it."
"geological" = "Volcanic islands at night: a black basalt peak against a red sky, wet lava rock along the shore."
"metallic and ore" = "Metal as what the ships brought: a brass lamp, a ship's bell at the wharf, a fish hook catching a glint."
"glass and ceramic" = "Glass from the traders and the sea: a hurricane lamp's chimney, a green glass float washed up in the dark."
"architectural" = "Thatched houses, the pastor's church and the wharf sheds, mostly in shadow: a doorway with a lamp, a church gable caught by the moon."
"domestic interior" = "The inside of a thatched house at night, open to the dark: a mat and a lamp, a sleeper and a guitar against the wall."
"mechanical" = "The few machines that reached the islands: a schooner's winch, a phonograph on a porch, an old car's headlamps on the coast road."
"industrial and infrastructural" = "The copra trade and the port: copra drying on racks by firelight, a steamer at the wharf with one light lit."
"agricultural and cultivated" = "Gardens of taro, breadfruit and vanilla, cut out of the dark by a lamp: a basket of fruit, rows of taro in black water."
"aquatic" = "The lagoon, the reef and the open sea at night: moonlight on still water, surf white on the reef."
"atmospheric" = "Night air thick with heat and weather: a squall line over the sea, smoke from an earth oven across the moon."
"glacial and frozen" = "Cold as the islands know it: rain on a night canoe, the chill of the deep sea, ice in a trader's bar glass. Never snow."
"fire and ember" = "Fire as the only light that matters: a beach bonfire, torches over the reef, embers in an earth oven."
"textile and fiber" = "Cloth and fibre held by the light: a printed pareu, tapa cloth, a pandanus mat, a flower crown being strung."
"ritual object" = "Carved and sacred things: a tiki on its platform, a canoe prow, a garland left on a stone."
"paper and inscription" = "Paper from outside: a letter from a ship, a hymn book in church, a trader's ledger by lamplight. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and the sea's measures: a ukulele and a slit drum, a navigator's shell chart, a ship's compass in its binnacle."

[velvet]
label = "Black Velvet"
suffix_base = "A mid-century oil painting on black velvet in the manner of Edgar Leeteg's Tahitian paintings. One warm light from the side, like firelight or moonlight; whatever turns away from it dissolves completely into the black velvet. Lit forms glow in layered amber, copper and bronze glazes with crisp bright highlights, sculpted and lit from within. Saturated reds and yellows against deep black. The soft nap of the velvet shows across the whole image, with the paint sitting on top of the fibres. Restrained composition, a 1940s Polynesian fine-art painting. No text or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, with realistic anatomy and an individual face rather than a generic type, a calm, absorbed or slightly melancholy expression, skin in warm amber and bronze with crisp highlights on cheekbone, collarbone and shoulder, the shadow side melting into the black."
