# Art-style presets for Stage 2's prompt suffix. Each generation appends
# whichever preset is selected in the widget's Style dropdown to Stage 2's
# imagery, the same way the old fixed style.toml suffix always did — only
# now there's more than one to pick from.
#
# "symbolist" was the one that stuck from Phase 3's original style review
# and stayed the default. Curated down to 5 on 2026-09-07 (cut artdeco,
# dystopianwwii, surreal — see CHANGELOG.md for the review method and
# reasoning) after a batch of test renders across all 8 originals made
# clear which ones were redundant or too generic to keep, then grew back
# to 7 the same day with ukiyoe/illuminated (sourced from a user-supplied
# reference guide, see CHANGELOG.md). Add more presets here freely — each
# needs a "label" (shown in the dropdown), a "suffix"
# (appended verbatim to every Stage 2 prompt),
# and a "guidance" (below) — a one-line description of what kind of
# imagery this style can actually depict, fed to Stage 2 itself so it
# doesn't invent imagery the style has no vocabulary for (e.g. a
# grounded/representational style being asked to render "a body made of
# pure sound-wave energy" — added 2026-09-07, see CHANGELOG.md; every
# preset needs one, not just the representational ones, since it's what
# tells Stage 2 abstraction is *allowed* for the visionary styles too).


# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4, approved by Garrett): Varo and Carrington's concrete dream-world: inner things built as outer ones; glowing orbs and abstraction ruled out by physics.
# Brief is SIGNATURE + TEMPER (THE IMPOSSIBLE and OPENNESS no longer apply;
# space recipes replace OPENNESS). The suffix is untouched, as Prompt 4 asks
# for the four technique styles. Research: verification/charter-symbolist/research.md.
[symbolist.world]
era = "No single era: the dream-world of the Symbolist and Surrealist painters, where towers, vehicles and kitchens from old Europe and old Mexico house rites nobody explains. Its technology is handmade and impossible, like a bicycle that weaves as it rides or a tower that spins thread."
materials = "Wood grain, threadwork, feathers, stone, glass and cloth, painted finely with visible texture; bodies merge with these materials at their edges. Everything is solid enough to touch."
physics = "Inner things are built as outer ones: a feeling is a tower, a memory is a room. Things change into each other at their edges, slowly and in plain sight. Light comes from a window, a candle or a lamp, and nothing glows of its own accord."
society = "Small closed communities, like a household of women or a tower of scholars, keeping rites and crafts that are never explained. Days here are rites, meals, journeys and games as much as work."
weather = "Weather is a mood made physical: a sky with the grain of wood, a still yellow dusk. Pick what the day calls for."
inhabitants = "Elongated cloaked people with heart-shaped faces, hybrid animal-women, scholars, weavers and travellers; owls and white horses; and beings who are partly furniture or partly plant."
strangeness = "Strangeness is the medium: nothing here is ordinary and nobody is surprised. The rule is that every strange thing is a concrete thing doing something, never a symbol floating free."
numinous = "The numinous is a craft practised in plain sight: the world's mantle being woven in a tower, a star caught in a cage and fed. It has a body and a workplace, never a glow, an aura or pure abstraction."
dread = "This world at its darkest is enclosure: a room with no door, a figure slowly turning into furniture, an island of the dead approached by boat. Calm and exact, never gory."
favoured_actors = "Pairs and households sharing one rite or craft, hybrid figures, animals with purposes, and the numinous at work. A lone figure gazing into the distance is this tradition's most worn image and should not be the default."
myth = "Alchemy and Hermeticism, Celtic and Mexican folklore, Theosophy, and Greek myth as the Symbolists painted it: the work of transformation, the descent to the underworld, the weaving of fate."
highlight = "The thing the eye finds first: an inner state built as a concrete apparatus, room or body. Today's kind of wrongness is given with this definition. It is solid, finely painted and lit like everything else."
highlight_modes = [
  "a person partly become an object",
  "an apparatus that does an impossible job",
  "a room that is also a body",
  "an animal performing a rite",
  "a small thing at the scale of a building",
]

[symbolist.brief]
signature = "SIGNATURE — at least one impossible apparatus, or a body partly turned into something else, is named explicitly and doing something. It may be the highlight. A scene that could be an ordinary painting of an ordinary room is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[symbolist.verbs]
process_hard = ["dissolving", "petrifying", "unspooling", "hardening", "devouring", "fracturing", "entangling", "sealing over", "wilting", "consuming", "strangling", "liquefying", "ossifying", "crumbling", "tightening", "closing in", "bleeding into", "caging", "spreading like a stain", "tarnishing"]
process_soft = ["opening like a flower", "transforming", "merging", "floating", "weaving itself", "breathing", "singing softly", "growing feathers", "melting into", "branching into", "twining", "brooding", "pouring slowly", "hovering", "paling", "maturing", "echoing", "doubling", "sleeping", "unwinding"]
actor_hard.work = ["spinning", "grinding", "stirring", "sewing shut", "pruning back", "winding", "pushing against"]
actor_hard.rest = ["hiding inside", "waiting within", "curled asleep in"]
actor_hard.play = ["playing chess against", "riding a strange vehicle round", "dancing with"]
actor_hard.ritual = ["performing a rite over", "anointing", "reading aloud from"]
actor_hard.travel = ["pedalling through", "sailing across", "climbing toward", "descending into", "crossing"]
actor_soft.work = ["weaving", "embroidering", "distilling", "gardening", "weighing", "spinning wool"]
actor_soft.rest = ["sleeping in", "reclining on", "taking tea with", "dreaming in"]
actor_soft.play = ["playing music for", "playing cards with", "telling stories to", "feeding birds at"]
actor_soft.ritual = ["lighting candles for", "pouring a libation over", "consecrating"]
actor_soft.travel = ["riding through", "rowing toward", "walking in procession to", "setting out from", "gliding toward"]

[symbolist.registers]
"botanical" = "Plants that are half something else: a flower with a face, a tree whose branches are threads. Growth here is slow transformation."
"bodily and anatomical" = "The body as a place things happen: hair that becomes a road, a chest that opens like a cabinet. Calm and exact, never gore."
"fungal and decaying" = "Decay as alchemy's first stage: a still-life going black and soft, mould spreading like a map across a wall."
"animal and creaturely" = "Animals as companions in the rite: an owl reading over a shoulder, a white horse standing indoors. They have their own purposes."
"geological" = "Stone as a dreamed landscape: a desert of smooth rock, a cliff carved into a stair that goes nowhere."
"metallic and ore" = "Metal as the alchemist's work: a lead weight turning gold at one edge, a brass apparatus of rings and cogs."
"glass and ceramic" = "Glass as vessel and lens: a bell jar holding a small weather, a lens through which another room is seen."
"architectural" = "Towers, cloisters and halls that are also instruments: a tower that spins thread from its windows, a corridor of doors that open onto skies."
"domestic interior" = "Kitchens and bedrooms as laboratories of the soul: a kitchen where the stew is a sky, a bed that is a boat. Always opens onto a window or a door."
"mechanical" = "Machines made of wood, cloth and feathers that do impossible jobs: a vehicle pedalled through a forest, a loom that weaves light into cloth."
"industrial and infrastructural" = "Works on a dream's scale: a mill grinding stars into flour, a water channel running uphill."
"agricultural and cultivated" = "Strange husbandry: a garden of glass flowers tended with tweezers, a field ploughed by a hybrid."
"aquatic" = "Water as passage and mirror: a boat crossing a still sea to an island of dark trees, a still lake holding a different sky."
"atmospheric" = "Air with texture: a sky like wood grain, a wind made of threads."
"glacial and frozen" = "Cold as stillness: a figure frozen mid-gesture in a block of clear ice, frost growing like lace across a window."
"fire and ember" = "Fire as transformation: an athanor's slow fire, a candle whose flame is a small figure."
"textile and fiber" = "Thread as the world's substance: the mantle of the world being embroidered, a tapestry whose figures step out."
"ritual object" = "Instruments of a private rite: a cage for a star, a chalice that pours light. Each is concrete, handled and used."
"paper and inscription" = "Books and diagrams that are alive: a book whose pages are birds, a chart unrolling into a road. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Instruments of the inner world: a scale weighing a heart against a feather, a clock with hands of branches."

[symbolist]
label = "Symbolist / Visionary"
suffix = "painterly, visionary symbolist painting in the tradition of Odilon Redon, Remedios Varo, Leonora Carrington, and Hilma af Klint's illuminated visions — strange, hand-painted, not digital or photographic"
# guidance removed 2026-10-10: superseded by the charter above. In git.
space = [
  "through a tower window onto a desert plain",
  "down a long vaulted corridor of doors",
  "across a still sea to an island of dark trees",
  "up a spiral stair to an observatory",
  "along a road that becomes a woman's hair",
  "through an open kitchen onto a moonlit garden",
  "across a plaza with a single strange vehicle",
  "from a balcony over a city of towers",
]


# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4, approved by Garrett): natural philosophy's engraved universe; the star chart runs from the edges into the world (physics + SIGNATURE), which is the look Garrett wanted kept. Revert point: verification/charter-engraving-before.
# Brief is SIGNATURE + TEMPER (THE IMPOSSIBLE and OPENNESS no longer apply;
# space recipes replace OPENNESS). The suffix is untouched, as Prompt 4 asks
# for the four technique styles. Research: verification/charter-engraving/research.md.
[engraving.world]
era = "The engraved universe of the natural philosophers, from the first star atlases to the encyclopaedias: a world measured, labelled and cut open to show how it works, where the heavens are drawn as figures over the stars and the earth is drawn in section."
materials = "Copper-plate line: everything is hatching, stipple and outline, and every material is known by its texture of lines. Brass instruments, stone, timber, sailcloth and paper are the common stuff, and the sky is a field of numbered stars."
physics = "The star chart is part of the world, not only its frame: constellation figures, graticule lines and labelled stars run around the edges of the image and into it, merging with the land, the sea and the things in them. Cutaways open hills and bodies to show what is inside. Nothing glows; light is the white of the paper between the lines."
society = "Observatories, workshops, ships, gardens and lecture halls, where people measure, collect and make. Days are not all work: a crowd gathers for an eclipse, travellers stop at an inn, a family walks out to see a comet."
weather = "Weather is drawn both as diagram and as event: wind as a puffing head at a map's corner, a storm as massed hatching over a sea. Eclipses, comets and aurorae are weather here."
inhabitants = "Astronomers, instrument makers, voyagers, gardeners and the curious public; animals as specimens and as living things in the plate; and the constellation figures themselves, who step half out of the chart into the scene."
strangeness = "The cabinet of curiosities made true: a sea monster from a map's margin swimming in the real sea, a mountain cut open to show its fires. Nobody in the plate is surprised; it has been catalogued."
numinous = "The constellations are the numinous: heroes and beasts drawn in line over the stars, with bodies that can enter the world, like the Bear walking the horizon or the Ship riding a real sea. They are drawn exactly like everything else, in hatching, never as a glow."
dread = "This world at its darkest is the plate of catastrophe: an eclipse over a plague town, a prison of endless stairs. It is recorded, labelled and precise, and the precision is what makes it cold."
favoured_actors = "Crews and companies working one instrument or one voyage, specimens and creatures, and constellation figures in the world. A lone scholar at a desk is the most worn image here and should not be the default."
myth = "The Greco-Roman myths behind the constellations, Perseus and the sea monster among them, and the emblem books of the Hermetic philosophers, where the world above mirrors the world below."
highlight = "The thing the eye finds first, drawn as a specimen or a demonstration: a creature, a constellation figure or a working of the world shown whole, labelled or cut open. Today's kind of wrongness is given with this definition. It is drawn in the same line as everything else."
highlight_modes = [
  "a constellation figure stepped down into the world",
  "a creature from a map's margin, here in life",
  "a thing shown in cutaway while it is still in use",
  "far too large for its kind, with a measuring line beside it",
  "a diagram's geometry built as a real structure",
]

[engraving.brief]
signature = "SIGNATURE — the star chart is in the world: at least one named element of celestial cartography (a constellation figure, numbered stars, a graticule line, a cartouche) runs from the edge of the image into the scene and merges with it. A plate that could be any old etching is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[engraving.verbs]
process_hard = ["erupting", "collapsing inward", "quaking", "plunging", "blazing", "keeling over", "foundering", "caving in", "rending", "unravelling", "blackening", "overflowing its banks", "raining down", "withering", "careening", "breaching", "spewing smoke", "crumbling to rubble", "smashing", "sundering", "gushing", "tilting off its axis"]
process_soft = ["rotating", "revolving", "ticking", "swinging", "setting", "waxing", "waning", "branching", "spiralling", "flowing", "ebbing", "blossoming", "throwing a shadow", "balancing", "aligning", "crystallising", "mirroring", "germinating", "seeding", "floating on the tide", "unrolling", "converging"]
actor_hard.work = ["winding a capstan", "hoisting", "sounding the depth", "chiselling", "quarrying", "harpooning", "felling", "dragging a net", "forging", "rowing hard against"]
actor_hard.rest = ["waiting out the eclipse beside", "huddling at", "lying low under"]
actor_hard.play = ["wrestling for sport", "fencing", "skating"]
actor_hard.ritual = ["carrying relics in procession", "lighting beacon fires on", "taking an oath before"]
actor_hard.travel = ["riding post toward", "sailing close-hauled past", "climbing the rigging of", "crossing on foot", "marching toward"]
actor_soft.work = ["measuring", "grinding a lens", "engraving a plate", "pressing flowers", "cataloguing", "potting", "weaving"]
actor_soft.rest = ["reading beside", "taking supper at", "resting on", "smoking a pipe at"]
actor_soft.play = ["playing a viol at", "stargazing from", "feeding swans at", "dancing on"]
actor_soft.ritual = ["laying flowers at", "keeping a feast at", "blessing"]
actor_soft.travel = ["promenading along", "riding out to", "rowing across", "arriving by coach at", "walking out to"]

[engraving.registers]
"botanical" = "Plants as the herbalist and the gardener drew them: a specimen shown root, leaf and seed at once, a formal garden laid out in beds. Every plant is identifiable and could be labelled."
"bodily and anatomical" = "The body as the anatomist's plate: a figure with its muscles lifted like a cloak, a skeleton leaning on a spade. Exact and calm, a demonstration, never gore."
"fungal and decaying" = "Rot recorded with the same care as growth: a toadstool ring drawn as a specimen, a timber eaten into galleries by worms. Decay here is a subject of study."
"animal and creaturely" = "Animals as the naturalist's specimens and the traveller's wonders: a rhinoceros drawn from a description, a whale on a beach with a crowd around it. Exotic and ordinary animals get the same line."
"geological" = "The earth in section: a mountain cut open to show its veins and fires, strata drawn like the pages of a book. Stone is something to measure and to look inside."
"metallic and ore" = "Metal as mine and instrument: a mine's shafts and windlasses in cutaway, brass rings of an armillary sphere. Metal is worked, measured and named."
"glass and ceramic" = "Glass as the instrument of seeing: a telescope's lenses, the alembics of a laboratory. Glass makes the distant near and the small large."
"architectural" = "Buildings drawn as elevations, plans and ruins: an observatory dome opened to the sky, a colonnade in perspective. Architecture shows its geometry."
"domestic interior" = "A room as a study or a cabinet: shelves of specimens, a globe by the window. It always opens onto the world through a window or a door."
"mechanical" = "Machines shown working and in exploded view: a mill's gears, a clock's escapement. Every part is drawn as if it could be built from the plate."
"industrial and infrastructural" = "Works drawn as the encyclopaedia drew trades: a glassworks with its furnaces in section, an aqueduct striding across a valley. Each shows how it is done."
"agricultural and cultivated" = "Husbandry as instruction: a field ploughed in demonstration, an orchard's grafting shown step by step. The subject is the method and the yield."
"aquatic" = "Water as the cartographer and the engineer drew it: a coastline with its soundings, a fountain's pipes in section. Seas carry ships and monsters alike."
"atmospheric" = "Air as diagram and as event: a comet's tail across a town, a storm's winds drawn as lines. The sky is charted as carefully as the land."
"glacial and frozen" = "Ice as the polar voyagers drew it: a ship locked in a frozen sea, snowflakes drawn as six-sided specimens."
"fire and ember" = "Fire as furnace and as catastrophe: a volcano's eruption in section, an alchemist's athanor. Fire is a force to be shown at work."
"textile and fiber" = "Cloth as sail and as trade: a loom in exploded view, a ship's canvas full of wind. Fibre is drawn by its weave."
"ritual object" = "The emblems and instruments of the Hermetic philosophers: a sigil engraved on a plate, an orrery used as an altar. Ritual objects are drawn like instruments."
"paper and inscription" = "Paper as the plate's own world: banners, cartouches and labels that carry the names of things, a book open on a lectern. Lettering is ornamental and partly legible, never a sentence."
"instrument and measure" = "Measure is this world's heart: quadrants, astrolabes, rulers and graticules. To measure is to make the world readable."

[engraving]
label = "Antique Engraving"
suffix = "antique astronomical engraving, fine linework, star atlas illustration, sepia and ink tones, detailed etching"
# guidance removed 2026-10-10: superseded by the charter above. In git.
space = [
  "a landscape in section, the cutaway ground in front and the country running back behind",
  "across a harbour to a horizon ruled with latitude lines",
  "from an observatory platform up into a figured sky",
  "down a long hall of specimens and instruments",
  "a bird's-eye plan of a town tilting into a view",
  "along a voyage's coastline toward a cartouche-framed sea",
  "up a stair of endless arches",
  "through a demonstration's frame onto open country",
]

# CHARTER, 2026-10-10 (STYLE-OVERHAUL Prompt 4), from one grilling session
# with Garrett. The decisions, so the reasoning survives the prose:
#   - A BLEND (Q1 c): the mythic sky built the space-art way. Constellations
#     are physical beings at planetary scale, lit by a real star, which keeps
#     the rule every charter shares that the strange has a body.
#   - 1970s SPACE ART, leaning on ROGER DEAN: floating islands with water
#     falling off their edges, rock eroded into flowing contours, grown pod
#     dwellings, serpent creatures; Foss hulls for hardware; Bonestell and
#     McCall around them. Out: franchise designs, modern CGI gloss, NASA
#     photo-realism. Dean's look is described, not just named, because the
#     image model follows described outcomes better than artist names.
#   - Dean's CONTENT (islands, dwellings, serpents) lives in the charter and
#     his RENDERING in the suffix, so the suffix cannot force islands into
#     every register (the cottage-kitchen collapse).
#   - SIGNATURE: the land visibly hangs in space, plus one thing at celestial
#     scale. TEMPER carries the dial's wonderTone, as in cyberpunk. THE
#     IMPOSSIBLE and OPENNESS are not used; space recipes replace OPENNESS.
#   - No motifs ruled out yet (Q2): too little testing to be tired of any.
#     favoured_actors still demotes the lone suited figure facing the stars.
# Research notes: verification/charter-cosmic/research.md.
[cosmic.world]
era = "The space age as 1970s paperback covers painted it: people living on rock that hangs in open sky and working among hulls someone else built. Technology is heavy, hand-flown and painted in hazard stripes, never sleek and never a touchscreen."
materials = "Rock eroded into smooth, flowing, rounded contours; hull plate in banded colours; dwellings grown rather than built, shaped like gourds or seed pods with round windows. Everything is opaque and solid, and even ice and gas have a surface the light can find."
physics = "Space with weather. Islands of rock float in open sky, water falls off their edges into nothing, and gravity is light enough for long leaps and slow falls. One star lights everything from one side and the far side is black. Nothing glows of its own accord except stars, fire and a craft's working lights, and nothing is translucent."
society = "Scattered settlements on islands and stations, joined by small craft. People are known by the craft they fly and the island they come from. Authority is far away aboard something larger; the void and the star are close. Derelicts nobody now living built are salvaged, lived in, and visited as shrines."
weather = "The sky is the weather, and it runs the whole range: an airbrushed band from warm orange to violet, a dust tide rolling in, an eclipse, a planet rising. Choose what the day calls for; black and starry is one choice among many, never the default."
inhabitants = "People who fly, mine, farm, herd and keep watch on the islands and stations, in heavy suits worn like work clothes; and creatures shaped by low gravity and open sky, from flocks roosting under island overhangs to beasts of burden in harness."
strangeness = "What would be impossible on a planet is ordinary here: land with no ground under it, two shadows from two suns. Nobody looks up at it, and it is lit like everything else."
numinous = "The constellations are beings with bodies at the scale of worlds, and the stars' stories still happen to them. A star-being is physical — hull, rock, ice or hide — lit by a real star on one side and black on the other: the Hunter a derelict the size of a moon, the Silver River an actual ring of ice and dust. People leave offerings at their feet, mine their edges and steer by them. Never a glow, an outline of light or a translucent figure."
dread = "This world at its darkest is the void being indifferent. Anything that keeps people alive out here can fail, and the large things do not notice: a tether parting with someone on the wrong end, a star swelling until it strips the world it lights. Shown by scale and distance, never by a face asking the viewer to grieve."
favoured_actors = "This world is richest in crews working one craft together, the creatures of the islands and the updrafts, and constellation-beings in their bodies. A lone suited figure seen from behind, facing the stars, is this genre's most worn image and should not be the default."
myth = "The sky myths of many peoples, in which the stars are beings and their stories are still happening: heroes and animals set among the stars, and the sky as a goddess's body with the sun's boat crossing it each night."
highlight = "The thing the eye finds first, and it belongs to the sky: a constellation-being's body or a piece of one, or something made at celestial scale. It is solid, lit from one side by the star and black on the other; it does not glow or turn translucent. Today's kind of wrongness is given with this definition. Where its wrongness is size, choose a scale comparison native to this scene, never the same one twice, and put part of it in shot rather than shrinking it."
highlight_modes = [
  "a body the size of a world",
  "a piece of a constellation fallen to the ground",
  "awake when it should be inert",
  "in the wrong orbit or the wrong sky",
  "being used for a job it was never built for",
]

[cosmic.brief]
signature = "SIGNATURE — the land visibly hangs in space: a horizon or an island edge drops away into black void or a gradient sky, and at least one thing at celestial scale (a planet, a ring, a star-being) is in frame and named. A scene that could be taking place on Earth is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[cosmic.verbs]
process_hard = ["drifting loose", "tearing free", "cracking apart", "venting into the void", "tumbling", "crumbling off the edge", "freezing solid", "boiling off", "searing", "shearing", "decompressing", "spinning out", "colliding with", "splintering", "sublimating", "burying under dust", "flaring", "sinking into the gulf", "engulfing", "splitting along its seam", "slipping its orbit", "eclipsing"]
process_soft = ["orbiting", "turning slowly", "pouring off the edge", "trailing spray", "lifting", "sinking slowly", "frosting over", "glinting", "coasting", "unfolding", "thawing", "budding", "tilting toward the star", "casting long shadows", "wheeling", "cresting the horizon", "shedding frost", "rocking at anchor", "circling", "gathering dust", "breathing out vapour", "falling into step"]
actor_hard.work = ["winching in", "clamping onto", "cranking shut", "towing", "boarding", "jacking open", "lashing down", "propping", "salvaging", "drilling into", "hooking a tether onto", "fending off"]
actor_hard.rest = ["sleeping strapped into", "holding still behind", "sheltering in the lee of"]
actor_hard.play = ["leaping between", "racing skiffs past", "daring the edge of"]
