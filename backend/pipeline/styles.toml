[havana.registers]
"botanical" = "Plants of the island as wealth and ornament: tobacco under shade cloth, a royal palm over a courtyard, a jasmine flower in the hair. Its highlight: a leaf or a flower doing what only luck could make it do."
"bodily and anatomical" = "The body as glamour and nerve: a dancer's turn, a roller's quick hands. Never gore."
"fungal and decaying" = "Decay as the salt air's slow work: stucco flaking off a palace, a balcony rusted through, a mansion given over to tenants, mildew on a ballroom mirror."
"animal and creaturely" = "Creatures of the harbour, the street and the farm: a pelican on a piling, a lizard on a hot wall, a stray cat in a doorway, an ox at the plough in the tobacco country."
"geological" = "Stone of the coast and the valleys: the coral limestone of the old walls, the reef rock along the shore, the steep green limestone hills of the tobacco country."
"metallic and ore" = "Metal worn and driven: a car's chrome grille, a bracelet on a dancer's wrist, a cigarette case snapping shut, the brass rail of a bar."
"glass and ceramic" = "Glass of the night: a chandelier, a cut-glass tumbler of rum, a hotel's curved window over the sea, painted tiles in an old courtyard."
"architectural" = "The two cities of 1957: Old Havana's baroque churches and courtyard palaces, and the new hotel towers, casinos and open-air clubs along the seafront."
"domestic interior" = "Rooms of the casino years: a hotel suite with the shutters open on the sea, a tenement room with a saint's picture and a radio, a dressing room behind the stage."
"mechanical" = "Machines of pleasure and speed: a finned convertible, a jukebox, a ceiling fan, a launch's outboard, the tumbling wheel of the house."
"industrial and infrastructural" = "What feeds the party: the harbour with its freighters and ferry, the sugar warehouses on the docks, the coast road, the rail line to the tobacco country."
"agricultural and cultivated" = "The tobacco country: fields of leaf under white shade cloth, steep-roofed curing barns hung with drying leaf, ox carts, a farmhouse with a palm-thatch roof."
"aquatic" = "The sea as the city's other half: the harbour at night, a hotel pool, a beach east of the city, a sudden flood in the street."
"atmospheric" = "Havana's air: cigar smoke, salt spray, steam rising after a downpour, the haze of a hot night, a thunderhead over the Gulf."
"glacial and frozen" = "Cold as luxury in the heat: crushed ice in a daiquiri, a frosted bottle in a bucket, a chilled hotel lobby, a winter norther's grey sea."
"fire and ember" = "Fire as pleasure and as ruin: the coal of a cigar, carnival torches, a burning car or barn."
"textile and fiber" = "Clothes as costume, cut for the heat and the night: a gown cut low at the back, white linen. Its highlight: a garment doing what luck makes it do."
"ritual object" = "The sacred and the lucky: an orisha's beads in their colours, a candle for the Virgin, a coconut shell for divination, a lucky chip kept in a garter."
"paper and inscription" = "Papers of the trade and the plot: a stack of banknotes, a marker for a gambling debt, a ferry ticket. Writing appears as marks, never a readable word."
"instrument and measure" = "Music and money: conga and bongo drums, a trumpet, maracas, a cashier's adding machine, a pocket watch, a weighing scale for tobacco."

[havana]
label = "Havana Label"
suffix_base = "A printed paper label made as a chromolithograph: the scene sits in a cartouche framed by embossed gold borders of raised scrollwork, laurel and beaded edges, with gold rosettes, sunbursts and laurel bosses in the corners, with no heads, ribbons, banners, scrolls or coin rims. The image is the label itself, flat and edge to edge, the print rather than an object in a room. The surface is a flat printed sheet seen square on and filling the frame: fine stipple and crayon-grain lithographic texture in every tone, flat layered inks with slight registration offsets, gold printed as burnished bronze powder with a fine metallic grain, embossing shown only as a thin highlight on one edge of each raised line and a thin shadow on the other, and a soft overall varnish sheen. Inside the cartouche the colours are Caribbean turquoise, royal blue, leaf green, carmine, ivory and tobacco brown. Not photographic, not digital and not 3D-rendered. No text, words, numbers, monograms, banners, ribbons or lettering anywhere, not even unreadable marks."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties, painted in the label's glamorous chromolithograph manner with stippled skin, a warm glow on cheekbone, shoulder and collarbone, glossy 1950s hair and a confident, knowing look, with an individual face, build and complexion of her own rather than a type. She is a woman of 1957 in the period's own clothes, never a classical goddess in drapery or a gold-painted statue. Men are dapper in white linen or dinner jackets and secondary to her. Glamour is pin-up and suggestive, never explicit, with no exposed breasts or genitals. Her clothes are opaque even when wet: no sheer, wet-through or see-through fabric, and no body showing through cloth."
