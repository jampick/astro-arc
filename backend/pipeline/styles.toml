[bosch.registers]
"botanical" = "Plants as temptation and feast: a strawberry carried off on a pole by four people, a thistle grown into a gateway. Fruit is always ripe and always too large, and it is picked, carried, ridden or fought over, not lived in."
"bodily and anatomical" = "The body as a building and a vessel: a giant ear that is also a cart, a torso hollowed into a room. Seams are clean and the mood is calm, never gore."
"fungal and decaying" = "Rot as the sin made visible: a feast spoiling on the table, a tavern sign gone soft and black. Decay is quiet and exact."
"animal and creaturely" = "Animals as companions, mounts and messengers: an owl watching from a hollow, a fish ridden like a horse. Some are half something else."
"geological" = "Rock as dreamed landscape: pink stone grown into towers with pods and spikes, blue crags fading into the distance."
"metallic and ore" = "Metal as the instrument of punishment and trade: a knife between two ears, a cauldron, a coin purse that eats its owner."
"glass and ceramic" = "Glass as a lovers' house and a trap: a glass globe with a couple inside, a pitcher with legs. Fragile things hold people."
"architectural" = "Towns, inns, mills and ruined chapels seen from above, some of them alive: a tower with a face in its wall, an inn with a swan on its sign."
"domestic interior" = "The inn, the kitchen and the bedchamber, opened up to the landscape: a table spread for a feast under the open sky, a bed tipped toward a window."
"mechanical" = "The contraptions of a world before machines: a mill that grinds people, a wheel of knives turned by a demon, a cart with legs."
"industrial and infrastructural" = "The works of the Low Countries, crowded and strange: a dyke with a crowd on top, a lock gate with a mouth, a mill race through a town."
"agricultural and cultivated" = "The field and the garden of delights: haymaking under a giant haywain, an orchard where the fruit is larger than the pickers."
"aquatic" = "Water as pleasure and as trap: a lake crowded with bathers, a boat of fools, a moat round a pink fountain."
"atmospheric" = "Air full of things: flying fish and riders on birds in a pale sky, smoke drifting from a burning town."
"glacial and frozen" = "Ice as the cold hell and the winter fair: skaters on a frozen lake, a sinner frozen into a pond while others skate past."
"fire and ember" = "Fire as the Judgment's light: a town burning at night on the horizon, a furnace under a cauldron, sparks against black water."
"textile and fiber" = "Cloth and wicker as shelter and disguise: a friar's habit worn by a pig, a wicker cage carried by a hybrid, a tent made of a giant leaf."
"ritual object" = "The apparatus of the late-medieval church and its parodies: a reliquary carried in procession, an altar set in a hollow tree, a funnel worn as a hat."
"paper and inscription" = "Books, letters and indulgences that are alive or misused: a book sung from by a pig, a letter sealed with a thumb. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Musical instruments at the scale of buildings, and the tools of the quack: a harp a person is strung on, a lute ridden like a mount, a hurdy-gurdy turned by a hybrid."

[bosch]
label = "Hieronymus Bosch"
suffix_base = "An oil painting on oak panel in the manner of Hieronymus Bosch around 1500. A high viewpoint over a deep landscape that fades through bands of brown, green and pale blue to a low, misty horizon. Thin glassy glazes over a pale ground, crisp contours, small precise forms with fine dot highlights and little cast shadow. Pale pinks and flesh tones, pond-water greens and cool blues against warm browns; any fire is hot orange against black. A smooth panel surface with fine craquelure, not digital or photographic. No text or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: people are small and slender, with pale skin, simple oval faces and calm, absorbed expressions, painted with the same crisp outline and thin glaze as everything else."
space = [
  "a high bird's-eye view over a garden of pools and fountains to blue hills",
  "across a marsh crowded with small figures to a town burning at night",
  "along a river road past an inn and a mill to a far walled town",
  "from a hermit's ruined chapel across a plain to a pale horizon",
  "down a lake crowded with bathers to the fountain in its middle",
  "past a haywain and the crowd round it toward a far town",
  "across a frozen lake of skaters to a dark city",
  "over a sea of small boats to an island town",
]


# CHARTER, 2026-10-12 (new style, written to docs/charter-schema.md): the
# atomic retro-future after the bombs: a 1950s America that kept going for a
# century on the atom, then the wasteland its survivors rebuild from scrap.
# No franchise names anywhere, since whatever a charter names turns up in the
# image. The lone armoured wanderer silhouetted against ruins is demoted.
[atomic.world]
era = "An America that kept the 1950s for a hundred years, with the atom running everything, and then lost it in one afternoon of bombs. The world after is the old future's leftovers: big, rounded, vacuum-tube technology built to last forever and now kept going by survivors with scrap, tape and know-how."
materials = "Enamelled sheet steel in faded mint, cream and cherry red, chrome trim, bakelite and cracked concrete first, then sun-bleached wood, canvas, corrugated iron and sand. Old things are factory-made and rounded; new things are cobbled together from the old."
physics = "Radiation is real and shows only in what it has done: animals grown huge or doubled, plants twisted, people scarred, ground cratered. Everything strange has a scientific cause, usually a bad one; there is no magic. Light comes from the sun, fire, bulbs, neon and the sickly green of anything hot with radiation, and nothing else glows."
society = "Small settlements built from salvage around a water pump or a wrecked vehicle, trading caravans with pack beasts, sealed underground shelters whose people come up blinking, raider camps and makeshift town councils. Days here are trading, cooking, card games, dances to an old record, weddings and long walks between towns as much as scavenging and fighting."
weather = "The whole range: hard desert sun, a dust storm, a green-tinged radiation storm full of lightning, rain on rusted roofs, a cold clear night of stars, a sunset turned blood red by dust. Pick what the day calls for."
inhabitants = "Settlers, traders and scavengers; people from the sealed shelters in matching jumpsuits; household robots still at the chores they were built for; survivors whose skin radiation has burned away; and animals grown huge or doubled. They are as often off work as on it."
strangeness = "Strangeness is science's fallout and nobody remarks on it: a giant insect crossing the road is a traffic problem, and a robot still laying a table for a family long dead is just part of the house."
numinous = "The sacred is the bomb and what is left of the old world: a congregation kneeling before an unexploded warhead, a roadside shrine of advertising mascots and bottle caps, a preacher on a reactor dome. It has a body and a congregation, never a halo or an aura."
dread = "This world at its darkest is the end coming again: a mushroom cloud rising on the horizon, a shelter whose door never opened, a town picked clean, a radiation storm rolling in. Bright and matter-of-fact, and the frame does not take sides."
favoured_actors = "Travellers in pairs and caravans, settlers at shared work, robots, mutated animals and swarms of them. A lone armoured wanderer silhouetted against the ruins is this genre's most worn image and should not be the default."
myth = "The American mid-century myth: the frontier and the Western, the atomic age's promise of a gleaming tomorrow and its duck-and-cover fear, the B-movie monster, Cold War doomsday prophecy, and the Book of Revelation as the radio preachers tell it."
highlight = "The thing the eye finds first: something the bomb made, or something the old future left behind, still going about its business. Today's kind of wrongness is given with this definition. Painted as cleanly and brightly as everything else."
highlight_modes = [
  "an animal mutated far past its kind",
  "a machine still doing the job it was made for in a world that no longer needs it",
  "a pre-war advertising mascot at monstrous scale",
  "a person changed by radiation going about an ordinary day",
  "something radioactive treated as a household convenience",
]

[atomic.brief]
signature = "SIGNATURE — at least one thing marks this as the atomic retro-future after the bombs, named explicitly: rounded chrome-and-fin 1950s design run on atomic power, a vacuum-tube robot, a mutated creature, or a cheerful pre-war advertisement standing among ruins. It may be the highlight. A frame that could be any modern ruin or any desert is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

[atomic.verbs]
process_hard = ["rusting to lace", "crackling with static", "melting down", "collapsing in a cloud of dust", "short-circuiting", "sandblasting", "leaking coolant", "crashing down", "mutating", "detonating", "warping in the heat", "sinking into the sand", "flaring green", "rattling apart", "blowing over", "contaminating", "spitting sparks", "tipping over", "burning out", "irradiating"]
process_soft = ["ticking like a Geiger counter", "whistling", "warming up", "sputtering", "bubbling green", "glinting chrome", "spinning slowly", "hissing", "flickering on", "blooming through the rubble", "sprouting", "creaking", "swinging on a sign chain", "rolling across the sand", "puffing steam", "playing on the radio", "shimmering in the heat", "glowing faintly green", "drifting on the wind", "settling into dust"]
actor_hard.work = ["scavenging", "barricading", "patching", "shooting at", "jury-rigging", "digging out of the rubble", "towing with a winch"]
actor_hard.rest = ["sheltering in", "hiding out in", "keeping watch from"]
actor_hard.play = ["arm-wrestling", "gambling bottle caps on", "racing jalopies"]
actor_hard.ritual = ["praying to", "burying the dead at", "swearing an oath on"]
actor_hard.travel = ["trekking across", "fleeing", "pushing a stalled car across", "driving a caravan through", "fording a radioactive creek"]
actor_soft.work = ["trading at", "cooking over", "tinkering with", "farming", "repairing", "fishing in"]
actor_soft.rest = ["lounging on", "napping in", "sipping a soda at", "listening to an old radio in"]
actor_soft.play = ["dancing to a jukebox at", "pitching horseshoes beside", "telling stories round", "playing poker on"]
actor_soft.ritual = ["toasting at", "holding a wedding in", "singing hymns to"]
actor_soft.travel = ["strolling along", "riding a pack beast toward", "hitching a ride on", "heading out from", "rolling into"]

[atomic.registers]
"botanical" = "Plants that survived the bombs by changing: a cactus grown into a grove, a garden of tough mutated vegetables behind a scrap fence. Its highlight: a plant that has become something more."
"bodily and anatomical" = "The body after radiation: skin burned away to the muscle on a cheerful shopkeeper, a second head on a pack animal. Treated as ordinary, never gore."
"fungal and decaying" = "Decay as the old world going soft: a supermarket gone to mould, a dinner left on a table for a century, fungus grown in a shelter's damp."
"animal and creaturely" = "Animals the atom made: insects the size of cars, a cow with two heads, a dog that is the last loyal thing in town."
"geological" = "Desert country: mesas, canyons, dry lake beds and a crater glassed by the blast."
"metallic and ore" = "Steel and chrome from the old world, rusting and polished back up: a car body as a house wall, a robot's dented shell."
"glass and ceramic" = "Vacuum tubes, soda bottles, diner crockery and the windows of the old world, many of them broken: a bottle tree, a glowing tube in a repaired radio."
"architectural" = "Googie diners, ranch houses, gas stations and office towers of the atomic age, standing ruined or patched into new use."
"domestic interior" = "The 1950s home, a century on: a kitchen of rounded appliances still waiting for its family, a living room with a television and a hole in the roof onto the sky."
"mechanical" = "Atomic-age machines: rounded robots, cars with tail fins and a reactor where the engine should be, a vending machine that still works. Most have been repaired many times."
"industrial and infrastructural" = "The big works of the old future: a dam, a cooling tower, a monorail on its pylons, a highway overpass with a town built under it."
"agricultural and cultivated" = "Farming the wasteland: rows of tough crops in irradiated soil, a herd of two-headed cattle, a greenhouse made of old car windows."
"aquatic" = "Water as the most precious thing: a pump at the centre of a town, a radioactive pool, a drowned downtown, a flooded crater lake."
"atmospheric" = "The sky after the bombs: dust storms, a green radiation storm with lightning, a red sunset over ruins, a clear night full of stars."
"glacial and frozen" = "Cold and preservation: a cryogenic pod, a frozen shelter, a winter wasteland with snow on the wrecks."
"fire and ember" = "Fire as campfire and as the end: a barrel fire in a settlement, a burning wreck on a highway, a mushroom cloud on the horizon."
"textile and fiber" = "Clothing patched together from what is left: shelter jumpsuits, scavenged leather, a flag stitched from old signs."
"ritual object" = "The relics and rites of the new world: an unexploded warhead as an altar, a shrine of mascots, a jukebox treated as an oracle."
"paper and inscription" = "The paperwork and propaganda of the old world: civil defence posters, comic books, magazines and advertisements, faded and weathered. Writing appears as marks, never a readable sentence."
"instrument and measure" = "The instruments of survival: a clicking Geiger counter, a wrist computer, a radio, a dial thermometer on a shelter door."

[atomic]
label = "Atomic Retro-Future"
suffix_base = "A mid-century American illustration in the manner of 1950s magazine advertising and pulp paperback covers, painted in gouache: clean, confident shapes, simplified modelling with soft airbrushed gradients, and bright optimistic colour (mint, cream, turquoise, cherry red, polished chrome) set against dusty ochre and rust brown. Hard warm sunlight with crisp shadows. A slight halftone grain and printed-paper texture. Not photographic and not a modern 3D render. Any lettering appears as marks, never readable words."
suffix_figures = " Only if a person is explicitly part of the scene described above: people are drawn as mid-century illustration figures, with clean simplified faces, expressive posture and clothes with crisp folds, painted with the same flat confidence as everything else, never photographic."
space = [
  "down a cracked highway past a fallen billboard to red mesas",
  "from a shelter door in a hillside over a ruined suburb",
  "across a dry lake bed to a skyline of broken towers",
  "along a rail line to a water tower and a patched-up town",
  "through a diner's shattered window onto the desert",
  "from a rooftop across a drowned downtown",
  "past a row of rusted tail-finned cars to the horizon",
  "along a canyon to a great concrete dam",
]


# CHARTER, 2026-10-12 (new style, written to docs/charter-schema.md): Frazetta's
# sword and sorcery as his 1960s and 1970s paperback covers painted it: muscle,
# steel, monsters and decadent sorcery in deep shadow, with his frank
# sensuality kept at the level of those covers (partly draped, never explicit).
# No character or franchise names, since whatever a charter names turns up in
# the image. The barbarian on a heap of bodies with a woman at his feet is demoted.
[frazetta.world]
era = "A savage age that never was, after an older world drowned and before history began: barbarian hills and frozen north, jungles, deserts, and decadent walled cities ruled by sorcerer-kings. Steel and muscle settle most things, and sorcery is old, costly city magic that barbarians fear and despise."
materials = "Muscle, sweat-lit skin, fur and hide first, then rough iron and bronze, bone and leather; in the cities gold, silk, jewels and crumbling cyclopean stone; everywhere smoke, mud and swamp water."
physics = "Bodies are heroic, with impossible strength and endurance, but they are flesh and they bleed. Sorcery is real and rare, worked with smoke, blood and idols, and always costs its worker something. Monsters are old, huge and solitary. Light comes from a storm-torn sky, a low red sun, fire and torches; a sorcerer's fire may burn a sickly colour, and nothing else glows."
society = "Barbarian tribes, mercenary companies, thieves' quarters, pirate crews, slave markets and the courts of decadent queens and sorcerer-kings. Days here are feasts, drinking, brawls for sport, dancing, love, rest by a fire and long rides as much as battle."
weather = "The whole range: a sky boiling with orange and violet cloud, a blood-red sunset over a battlefield, black jungle night, a blizzard on a mountain pass, smoky gold dusk over a city. Pick what the day calls for."
inhabitants = "Barbarian warriors and warrior women, mercenaries, thieves, pirates, queens and temple dancers, sorcerers and their priests; war-cats, wolves, great apes and serpents far larger than life; and the ancient things that lair under the cities. They are as often feasting, resting or in love as fighting."
strangeness = "Strangeness is a threat to be met with steel: monsters and sorcery are real, and nobody here is surprised by them, only ready."
numinous = "The sacred is an idol with a body and an appetite: a serpent god coiled round a temple column, a bronze idol with smoke rising from its mouth, a demon dragged up from a pit. It is solid and painted in the same dark oils as everything else, never an aura or a beam."
dread = "This world at its darkest is the last stand on a hill of the dead, a sacrifice on an altar, a city falling to fire, a beast dragging someone down into the swamp. Painted with the same heroic energy as a feast; blood is shown, mutilation is not, and the frame does not take sides."
favoured_actors = "A woman at the centre of every frame: a warrior woman, a queen, a temple dancer, a sorceress, a thief or a pirate captain, alone, with a companion, leading a warband or locked in struggle with a beast. Men, crowds and animals can share the frame around her, never in her place. A woman clinging to a barbarian's leg is this painter's most worn image and should never appear; here she is the one standing."
myth = "Pulp sword and sorcery and the myths it borrowed: Norse sagas and the berserker, Atlantis and other drowned kingdoms, the serpent and beast gods of Mesopotamia and Egypt, the thieves and djinn of the Arabian Nights, and the elder things of Lovecraft."
highlight = "The thing the eye finds first: force or sorcery at its peak, a body or a beast at full strain, or a god or monster in its body. Today's kind of wrongness is given with this definition. Painted in the same loose, dark oils as everything else."
highlight_modes = [
  "a beast far larger and older than its kind",
  "a sorcery visibly costing the one who works it",
  "an idol or god that has begun to move",
  "a body at the very limit of its strength",
  "a relic of a drowned elder kingdom still at work",
]

[frazetta.brief]
signature = "SIGNATURE — at least one thing marks this as savage sword and sorcery, named explicitly: an axe or broadsword in a powerful hand, a fur-clad barbarian, a sorcerer's idol, or a primeval beast. It may be the highlight or the actor. A scene that could be any fantasy illustration or any historical battle is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a woman painted with this artist's frank sensuality: a powerful, partly bare body in fur, hide, silk or jewellery, skin catching the warm light, in a pose of strength, effort or ease rather than one held for the viewer. If the actor named below is a man, paint a woman in the same role instead. Men may appear beside her, never as the subject. Bodies are always partly draped or armoured; never full nudity and never a sexual act. A frame whose lead figure is a man, or a frame of fully clothed, sexless figures, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global "full, even daylight" for high exposure cannot hold in a
# painter whose frames are half lost in shadow.
[frazetta.light]
lo = "It is night, a cave or a temple's depths. At least two thirds of the frame is dark, lit only by fire, torches or a sorcerer's flame. A frame that is mostly well lit is a failed response."
mid = "Dusk, storm light or firelight: a strong warm key light from one side, with lit and shadowed areas both substantial. A frame in flat light is a failed response."
hi = "A hot low sun or a storm-split sky blazing on the scene: a strong warm key light raking across it, with at least a third of the frame still in deep shadow. Flat, even daylight is a failed response."

[frazetta.verbs]
process_hard = ["falling with a crash", "erupting from below", "splintering under the blow", "spurting", "collapsing in flames", "breaking like a skull", "ripping free", "thundering", "writhing", "constricting", "sinking into the swamp", "bleeding", "rending flesh", "exploding into smoke", "giving way", "swallowing whole", "smashing open", "roaring", "boiling up from the pit", "toppling from the heights"]
