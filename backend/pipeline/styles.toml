]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Berlin
# in 1928 as its own revue and film posters sold it: revue palaces and cellar
# cabarets, the Ringverein crime clubs in dinner jackets, the Wannsee lido in
# summer, the inflation's old paper money as a leftover, and jazz. The most
# decadent of the set and still never explicit. The central figure is always
# a grown woman, and the ADULTS rule makes anything that reads young a
# failure. The revue's nude tableaux, the chorus line billed as "girls",
# exotic revue costumes and any children are written out of this world on
# purpose, and so are party flags, banners, uniforms and emblems of every
# kind, because 1928 Berlin had them on the streets and a poster style would
# happily print them. No artist, film, play or venue names, since whatever a
# charter names turns up in the picture.
#
# REVISION 2, 2026-10-13: review pass. Figure suffix cut to technique and
# rules; anti-caricature and ADULTS failures; signature rebuilt from
# Berlin-only, text-free things; verbs shared with siblings swapped.
#
# REVISION 3, 2026-10-13: after sweep pr-cabaret. A train on an iron bridge
# was in 6 of 8 frames and the same black finger-waved bob in 7 of 8.
#
# REVISION 4, 2026-10-13 (rework): user verdict on pr-cabaret-v2 was "no
# good, sex it up and align with the other themes". The flat-ink silhouette
# lithograph read as graphic design, cool and distant, and the women as
# shapes. The technique is now a lush painted revue and film poster (gouache
# and oil, modelled luminous skin, gold and silver inks, deep blacks, deco
# geometry) to sit beside funk, velvet, smokeshow, paperback, giallo and
# havana. The SILHOUETTE rule is gone; GLITTER and PARTY replace it. The
# masked Death mode is cut and the dread is the party's danger, not grief.
# Space recipes are now venues (one per run), so the venue changes frame to
# frame; ALLURE ties the outfit to the venue so the costume changes too.
# Rail is out of the default world: one verb and one register keep it.
#
# REVISION 5, 2026-10-13: after pr-cabaret-v3 (6 of 8 rendered before the
# OpenAI spend limit hit). Painted, lush and sexy as asked, but all six leads
# had the same auburn finger waves and five wore gold sequins. ALLURE now ties
# hair and gown colour to the venue (drawn per run from space), the figure
# suffix defers hair to the brief, and gold moves off the gowns onto the deco
# geometry. Not swept yet. Rev 4 as swept is drafts/cabaret-rev4-swept-v3.toml.
[cabaret.world]
era = "Berlin in 1928, for a few years the fastest, richest-feeling and least sleepy city in Europe: revue palaces with a thousand seats and a staircase of light, cellar cabarets down six steps, speakeasy bars behind a tailor's shop, grand hotels with marble baths, dance halls and tea rooms, the Kurfürstendamm lit all night, lakes and beaches to the west. Technology is the electric sign, the spotlight, the gramophone and the radio, the open touring car and the taxi, the table telephone and the pistol in a fur muff, and everybody uses all of it as if the party might end tomorrow."
materials = "Sequins and bugle beads, gold and silver lamé, black satin, silk stockings and lace garters, ostrich and egret feathers, white fox and mink first, then champagne in crystal coupes, mirror glass and chrome, lacquered black and ivory, pearls by the yard, cigarette smoke and powder, wet cobbles outside."
physics = "Light comes from footlights, a spotlight, a ring of bulbs round a mirror, a chandelier, electric signs, a match flaring or a white summer sun on the lake, and it pools warm on skin and throws sparks off sequins; nothing glows of its own accord. Everything is a performance: a woman on a stage can hold a thousand people still, and a crime boss's funeral stops the traffic. Nobody flies, and violence is a shape at the edge of the party, never gore."
society = "A city that works all night and plays harder: revue stars and showgirls, cabaret singers, dance hostesses who partner strangers for a ticket, bandleaders, film extras, heiresses slumming it, newspaper women, cocaine sold in paper twists in the washrooms, and the Ringvereine, criminal clubs registered as sporting and savings societies, whose members wear dinner jackets to their balls and keep their girlfriends in furs. Days here are tea dances, boxing nights, Sunday swims at the Wannsee lido, champagne breakfasts at noon, cafés until dawn and long, lazy hangovers in hotel beds as much as the hustle. No revue number dresses anyone as an exotic or a native; the jazz musicians are working professionals in evening clothes. No party flags, banners, armbands, uniforms or emblems appear anywhere in this world."
weather = "Every Berlin season: drizzle on the cobbles at four in the morning, a white summer noon on the lake, a heat wave that empties the city onto the beaches, fog off the Spree, snow on a fur collar outside a club, a sulphur-yellow winter dusk at three in the afternoon, a thunderstorm over a beer garden. Pick what the day calls for."
inhabitants = "Grown women at the centre, each with her own face and her own angle: revue stars and showgirls, a singer who owns the room, dancers between numbers, a dance hostess, a gangster's moll, a pickpocket in pearls, an heiress on a bender, a swimmer on the lido, a woman who drives her own roadster; the men around them, Ringverein bosses in bowlers, a doorman in a greatcoat, a bandleader, waiters and the plain-clothes detective who wants them all; a lapdog in a jewelled collar, a pet monkey on a bar, swans on the Wannsee. Nobody in this world is a child. They are as often dancing, swimming, drinking or asleep at noon as working an angle."
strangeness = "The strange is decadence nobody blinks at: a banknote for a billion marks, kept from the inflation, used to light a cigarette, a bath run with champagne, a taxi fare paid in pearls, a swimmer who walks out of the Wannsee in full evening dress. People order another bottle."
numinous = "The sacred here wears costume: a spotlight that finds one face in a dark hall, the cathedral dome over the river at dawn after an all-night party, a fortune teller's crystal at a fairground booth, a dancer's gilded mask hung above a bar like an icon. Never a halo or an aura."
dread = "This world at its darkest is the party's danger, seen from inside the party: a pistol laid on the card table among the champagne, a police raid's whistles on the stairs while the band plays on, a gangster's hand on a bare shoulder, a debt collected in pearls, a knife glinting in a garter, a club on fire with the dancers spilling into the snow in their feathers. The woman stays glamorous and in the middle of it; the menace sits behind or beside her. Never gore, never grief alone, and the frame does not take sides."
favoured_actors = "Grown women alone, in pairs or with one man, close enough to fill much of the frame: a showgirl fixing a garter in the wings, a singer stretched along a piano lid, a moll in a fur over a satin slip, two friends in bathing costumes on the Wannsee jetty, a star in her bath between shows, an heiress dancing on a table. Ringverein men, musicians and party crowds round them out. A chorus line kicking in unison and a singer astride a chair in a top hat are this genre's most worn images and should not be the default; a woman in a monocle and a man's evening clothes is just as worn, and neither is the same woman facing the viewer in every frame."
myth = "German folklore and the Romantic tale (the doppelgänger, the bargain with the devil, the river siren who lures men in), the street ballad and the murder ballad sung at fairs, the underworld legends of the Ringvereine and their code of honour, jazz and the blues as they arrived from America, and the Berlin wit that jokes at the edge of ruin."
highlight = "The thing the eye finds first: a figure or a gesture at its most daring, or the night's decadence carried one step too far. Today's kind of wrongness is given with this definition. Painted with the same glamour as everything else."
highlight_modes = [
  "a performance that has not stopped when it should have, a showgirl still dancing on the bar at noon with the chairs up",
  "money and luxury treated as worthless: banknotes as confetti, champagne poured over the floor, pearls thrown to the band",
  "a face that might be a mask, or a gilded mask that might be a face",
  "a whole room turned toward one woman, the music stopped mid-bar",
  "a luxury in the wrong place: a grand piano on the beach, a fur coat floating in a pool, a bath of champagne on a stage",
]

[cabaret.brief]
signature = "SIGNATURE — at least one thing marks this as Berlin in 1928, named explicitly: hooded wicker beach chairs on the Wannsee sand, a Ringverein gangster in a bowler and dinner jacket, a drift of old inflation banknotes, the cathedral dome over the Spree, a revue staircase of light with feathered showgirls, or a cellar cabaret's little table lamps and table telephones. It may be the highlight or a secondary figure. Trains, railway bridges and the U-Bahn stay out of frame unless the scene is about them. A frame that could be any 1920s party, any jazz-age city or any modern nightclub is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly glamorous grown woman painted as a 1920s revue pin-up, the most decadent figure of the night, with bare shoulders, back or legs in every frame and a knowing look. Her outfit and her hair belong to where she is: on stage, a silver-white feathered showgirl costume with silk stockings and garters, or top hat and tails over bare legs, with platinum marcel waves; in the dressing room, a peach silk robe slipping off one shoulder over a lace slip and stockings, chestnut hair half pinned; at the speakeasy, a black or emerald sequinned backless gown with a glossy black shingle bob; at the after-party, a short peacock-blue beaded fringe dress with a honey-blonde Eton crop; in the hotel suite, an oxblood satin slip under an open white fox, or a champagne bath with foam to the shoulders, dark hair pinned up under a jewelled band; on the beach, a striped 1920s bathing costume with bare arms and legs and a sun-streaked bob. Auburn finger waves and a gold sequinned gown are one choice among many, never the default. In a pose of performance, ease, play or nerve, cigarette holder or glass in hand, rather than one held for the viewer. If the actor named below is a man, paint a woman in the same role instead. Always dressed or covered; never nudity and never a sexual act. A frame where the women are distorted, satirical or ugly is a failed response, and so is a frame whose lead figure is a man, or a frame of plain, buttoned-up, dowdy or faceless figures."
adults = "ADULTS — every woman in frame is a grown adult in her twenties or thirties with an adult face and figure. A figure who reads as a teenager is a failed response."
glitter = "GLITTER — the frame is lush and painted: the lead woman's skin is fully modelled in warm light with rouge, lipstick and a highlight on shoulder and cheekbone, at least one shape shines in metallic gold or silver (a gown, a fan of feathers, a deco sunburst, a champagne bucket, a mirror frame), and the deepest shadows are true black. A frame of flat poster shapes, cut-out silhouettes or a figure seen only as an outline is a failed response."
party = "PARTY — the mood is hedonistic and dangerous fun, even on a hard day: the hard day shows as danger near her (a pistol, a raid, a rival, a debt) while she keeps her nerve and her glamour. A frame of a woman alone weeping, slumped or grieving among wreckage, or of an empty dark room with no party left in it, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

