[muertos.registers]
"botanical" = "Flowers as the road home: cempasúchil marigolds strewn as a path or crushed underfoot, purple cockscomb on a grave, an agave field in the dark. Its highlight: petals that lead somewhere nobody living walked."
"bodily and anatomical" = "The body as what the dead had and the living still have: a pulse at a bare wrist, calavera paint over a cheekbone, a dead man's cold hand on a living woman's back. Skin and paint, never bones or gore."
"fungal and decaying" = "Decay as the grave nobody tends: a sunken headstone, a wreath gone brown from last year, an ofrenda left to the mice. Sad rather than foul."
"animal and creaturely" = "Animals of the night and the crossing: a hairless dog at the cemetery gate, monarch butterflies on the marigolds, an owl on a cross, a black cat under the ofrenda."
"geological" = "Stone and earth of the valley: whitewashed tombs, fresh-turned graves, the volcanoes over the capital, the dry hills of Oaxaca."
"metallic and ore" = "Brass and silver of the night: a revolver on a table, a silver milagro pinned to a saint's robe, a tin candle sconce, the bell of a trumpet."
"glass and ceramic" = "Glass and clay of the vigil: a mezcal bottle and two glasses, a black clay jug, a glass votive, a cracked mirror on the ofrenda."
"architectural" = "City and village after dark: the cemetery wall and its iron gate, an adobe house with its door left open for the dead, a cabaret's back entrance, a cantina's swinging doors, a church tower over the graves."
"domestic interior" = "The room with the ofrenda: a table of tiers under marigolds, photographs and candles, a chair kept for the dead, a bed and a crucifix, a radio on a shelf, shutters half closed on the street."
"mechanical" = "The few machines of the night: a radio in a back room, a taxi idling at the cemetery gate, the last trolley, a jukebox, a box camera on a tripod among the graves."
"industrial and infrastructural" = "What carries people to the dead: a second-class bus loaded with flowers, a railway halt, the trolley line, the canals with their flat boats, the market stalls by the cemetery gate."
"agricultural and cultivated" = "The fields that feed the vigil: agave rows, marigold fields picked bare for the night, a maize plot, a horse turning the mezcal stone."
"aquatic" = "Water as the border of the dead: the river the souls cross, candles floating on a canal, rain pooling on graves and cobbles, a well in a courtyard."
"atmospheric" = "Air of the night: copal smoke hanging under a lamp, rain slanting through a streetlamp's light, cold mist on the canals."
"glacial and frozen" = "Cold as the highlands know it: frost on a headstone in the small hours, breath steaming at the vigil, a dead man's chill in a dancing partner's hand. Never snow."
"fire and ember" = "Fire as welcome and as danger: candles by the thousand, a brazier of coals, a bonfire by the cemetery wall, an ofrenda catching alight."
"textile and fiber" = "Cloth for both worlds: black lace and wet satin, a mantilla slipping off, a dead man's evening suit kept in a trunk for this one night, an altar cloth with cut-work edges, never initials."
"ritual object" = "Things laid out for the dead: a photograph in a frame, a rosary, a glass of water for the thirsty dead, a pack of the dead man's cigarettes, a cup of his mezcal."
"paper and inscription" = "Paper kept and hidden: a photograph, a love letter tucked under a candle, a pawn ticket, a playing card left on a grave. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music and time running out: a trumpet, a guitar, a violin, a pocket watch counting down to dawn, a church bell."

[muertos]
label = "Muertos Noir"
suffix_base = "A Mexican cinema poster of about 1950, painted by hand in gouache and oil and printed in rich lithograph colour: lush, confident painting, faces and skin modelled near-photographic, everything else loosened into broad wet strokes and deep shadow. Noir chiaroscuro: one hard light source from the scene, a candle, a lantern, a streetlamp or a doorway, and everything it does not reach falls into black; smoke, rain or mist catches the light. Saturated marigold orange and blood red against deep black, with warm skin and touches of bone white. Worn poster paper: soft fold lines, faint creases, a little edge wear, colour slightly faded. The painting fills the frame edge to edge: no border, no margin, no blank title panel. The scene stays indoors when it is indoors, the only lights are the ones the scene names, and no moon unless the scene names one. Not photographic, not digital and not 3D-rendered. No text, title, credits, monogram, initials, numerals or lettering."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a living woman, a grown adult in her twenties to forties, with a sultry, individual face, and her own build, hair and gown; her skin warm in the light with crisp highlights on cheekbone, collarbone and shoulder, the shadow side sinking into black; any calavera paint on her is elegant sculpted makeup over her own features, never a mask. Men wear pressed suits and hats and stand half in shadow. The dead look as they did in life at their best, pale and elegant in evening clothes, known by calavera paint on their faces or the shadow they stand in, never as bare skeletons or skulls. Glamour is poster-sensual and suggestive, never explicit, with no exposed breasts or genitals."
space = [
  "down a candlelit path between tombs to an iron gate in the cemetery wall",
  "from a cantina table through cigarette smoke to swinging doors onto the rain",
  "from an ofrenda in a dark room through the open door to the street",
  "past candles floating on a black canal toward a village cemetery",
  "across a cabaret floor through smoke to a lit stage",
  "down a rain-slick avenue under streetlamps behind a candle procession",
  "from a chapel's rack of candles down the dark nave to the open night door",
  "through a courtyard arch past a well to a lit upstairs window",
]

# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): the
# gothic horror world English studios made in 1965, a mountain village under
# a castle somewhere between the Carpathians and Bavaria, painted as the
# film's own British one-sheet: lurid saturated gouache, blood red and sickly
# green against black, the menace drawn huge behind a heroine in peril, the
# poster folded in eighths and its varnish cracked. The heroine is the point
# of the style. Glamour is film-poster sensual (candlelit nightgowns,
# ballgowns, laced bodices, bare shoulders), never explicit, and every woman
# is a grown adult: maidens, village girls and children are written out of
# this world on purpose, and the word "girl" is not used. Menace, never gore:
# no bite, no wound, no blood on skin, and the monster never touches her.
# The castle on its crag against a full moon is demoted, the moon kept out of
# the light colours, and the poster's red and green kept off her clothes.
# Kept apart from [giallo] (coloured light from gelled lamps in a modern
# city) because here the red and green are the poster painter's pigment over
# candle, torch and lightning, and from [frazetta] (heroic fantasy) by its
# coaching inns, crypts and laboratories and its period dress.
# Revised after sweep pr-hammer (8/8, no refusals, medium right in every
# frame): the meaning call lifted favoured_actors' first example whole, so
# all eight were a barmaid climbing the inn stair with a candle; actors are
# now roles with no place attached and the candlelit stair is demoted. Seven
# of eight had a band of red sky across the top, and red candle wax read as
# blood drips in one, so the red moves off the sky and never runs.
# Revised again after sweep pr-hammer-v2 (8/8, no refusals; NOT re-swept):
# the actor became the inhabitants' first item with its place ("stranded at
# the inn", 8/8 at the inn) and seven of eight dresses were the ivory or
# midnight blue named as examples in ALLURE, so both examples are gone and
# hair is told not to default to dark.
# Before sweep pr-hammer-v3: label changed from the studio name to "Gothic
# One-Sheet" (Stage 2 sees the label), and suffix_base moves the red off the
# top band of sky, which held in 7 of 8 frames in both earlier sweeps.
# After sweep pr-hammer-v3 (8/8, no refusals; NOT re-swept): the red sky
# band is gone and hair and rooms vary, but five of eight dresses were the
# poster's green, so suffix_figures now rules green and crimson off her
# dress; a coffin's torn red lining read as gore once, so LOOM covers it.
# No studio, film, actor, character or artist names, since whatever a
# charter names turns up.
[hammer.world]
era = "A mountain country somewhere between the Carpathians and Bavaria in the middle of the nineteenth century, as an English studio imagined it in 1965: a village of timber and plaster huddled under a castle, a coaching inn on the pass, a burgomaster, a church and a graveyard, and a forest road the coach takes too late in the day. Technology is the coach and four, the oil lamp, the candelabrum, the flintlock, the wooden stake and the scientist's crackling apparatus, and the villagers trust the crucifix and the garlic more than any of it."
materials = "Candle wax, black velvet and cold stone first, then dark oak panelling, damask, tarnished silver, crystal goblets, leaded windows, iron grilles, straw and wet earth, glass retorts and copper coils, cobwebs and the fog that comes in under the doors."
physics = "Light comes from candles, torches, oil lamps, hearths, a laboratory's arcing coils and lightning; at night the moon is usually hidden behind cloud. Nothing glows of its own accord except the eyes of the undead, which shine red. The undead cast no reflection, cannot cross running water and shrink from the cross; a creature built in the laboratory walks, but nobody flies except bats. Danger is told by a looming shadow, bared fangs, a door creaking open or a hand at the window, never by a wound."
society = "A frightened village and the gentry above it: the count or the baron in the castle, the burgomaster, the innkeeper and his wife, the priest, the doctor who reads too much, a gamekeeper, coachmen who refuse to go further after dark, and travellers who will not listen. Days here are harvest fairs, inn suppers with singing, a wedding in the church, a hunt, a ball at the castle and gossip by the well as much as fear."
weather = "The whole range of the mountain year: fog lying in the forest, a thunderstorm over the castle, driving rain on the coach road, first snow on the graveyard, a grey still morning after a bad night, a hot thundery evening with the windows open, a wind that bangs the shutters. The full moon is one choice among many and usually not the right one. Pick what the day calls for."
inhabitants = "Grown women at the centre, in their twenties, thirties and forties, each with her own face, hair and nerve: a traveller's wife, a barmaid, a countess, a doctor's assistant, a lady's companion at the castle, a widow keeping the burgomaster's house, a woman who has started to sleepwalk. Around them the men: a count with a long cloak, a baron in his laboratory, a vampire hunter with a bag of stakes, a priest, a sceptical doctor, a hunchbacked servant. And the creatures: wolves, bats, black horses, a raven on the gate, a creature brought to life in the laboratory, a woman of the undead in a white shroud. Everyone in this world is a grown adult. They are as often dancing, drinking, eating or asleep as afraid."
strangeness = "The village knows exactly what lives up at the castle and has rules for it: garlic over the doors, shutters closed at dusk, nobody on the road after the bell. Travellers laugh at the rules; the villagers bolt the door and say nothing."
numinous = "The sacred has a body and real power: a crucifix held up that makes the undead fall back, holy water in a stoppered flask, a church at the edge of the graveyard, a wayside shrine on the forest road with a candle in it. Painted in the same lurid gouache as everything else, never a beam or an aura."
dread = "This world at its darkest is the night something gets in: a window blown open with the curtains streaming into a bedchamber, an empty coffin with its lid pushed aside, a carriage overturned on the forest road with its lamps still burning, a mob with torches at the castle gate, the laboratory on fire. Menace and aftermath, never a wound and never gore, and the frame does not take sides."
favoured_actors = "Beautiful grown women alone, in pairs or with the menace looming behind them, close enough to fill much of the frame: a countess, a traveller stranded by the weather, a doctor's assistant, a widow, a lady's companion, a barmaid, two women who share a secret. Her role is who she is, never where she is: the place comes from the day's material, so an actor is named without a room, a stair or a road attached. Counts, barons, hunters and villagers round them out. The castle on its crag against a full moon is this genre's most worn image and should not be the default, and neither is a woman climbing a staircase with a candle, nor the same woman lying asleep in a canopied bed."
myth = "Central European folklore of the vampire and the werewolf, the restless dead and the evil eye, the Gothic novel and its castles, the scientist who defies God to make life, Christian relics and the power of the cross, and the village witch hunt."
highlight = "The thing the eye finds first: the moment of peril, the menace looming over a woman who has not yet turned, or the sign that something has already got in. Today's kind of wrongness is given with this definition. Painted in the same lurid gouache as everything else."
highlight_modes = [
  "a figure in a mirror who is not in the room, or a room with someone missing from its mirror",
  "red eyes shining in the dark where no one should be",
  "a shadow on the wall far larger than whoever casts it",
  "something laid to rest that is no longer where it was left",
  "a cross, a garland of garlic or a bolted shutter that has been turned aside",
]

[hammer.brief]
signature = "SIGNATURE — at least one thing marks this as the gothic mountain village of 1965 horror, named explicitly: a candelabrum carried through a dark corridor, a cloaked figure with a high collar, a coach and black horses on a forest road, a crypt with a stone coffin, a laboratory of glass retorts and arcing coils, a garland of garlic on a bolted shutter, or a crucifix held up against the dark. It may be the highlight or the actor. Most frames are inside (the inn, a bedchamber, the crypt, the laboratory, the ballroom, the church) or in the village and the forest, and the castle on its crag is not the default backdrop. A frame that could be any modern horror film, any fantasy castle or any Halloween card is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly beautiful grown woman painted with this poster's glamour, dressed for where she is and what she is doing and never in the same thing two days running: a ballgown off the shoulders at the castle, a laced bodice and a low blouse at the inn, a riding habit open at the throat on the road, a fitted dress with a low square neckline in the laboratory or the church, a candlelit nightgown with bare shoulders only when she is in a bedchamber or sleepwalking. A plunging neckline, bare shoulders or a bare back in every frame, her own hair colour (fair, auburn or grey-streaked as often as dark) and her own hairstyle (pinned up as often as loose), and a dress colour chosen fresh for her each day, no colour being the default, never the red or green of the poster's light or sky. No folk costume. No one role is the default: change who she is with the place. In a pose of nerve, flight, wary listening or uneasy trance, her eyes on the danger or turning toward it, not on the viewer. If the actor named below is a man, paint a woman in the same role instead. Never nudity and never a sexual act. A frame whose lead figure is a man, or a frame of plain, buttoned-up or faceless figures, is a failed response."
loom = "LOOM — when the menace is in frame it is painted larger than life behind or above her, the way a poster does it: a cloaked figure, a monstrous shadow, a pair of red eyes, a clawed hand at the window. It is close but never touches her: no bite, no hand on her throat, no grip on her arm, and she is never bound, carried or held. Red never runs or drips: no red streaks down a wall, a stair, a candle or a hand, since a painted drip reads as blood. Torn red cloth heaped in a coffin or on a floor reads as gore too, so linings and spills stay plain. A wound, blood anywhere, a corpse shown in detail or any gore is a failed response."
pigment = "PIGMENT — the poster's crimson and sickly green are the painter's colour in the sky, the shadows, the fog and the drapery, laid over candle, torch and lightning light; red covers at least a fifth of the frame and green at least a tenth, against large areas of black. The red lives in the drapery, a cloak, a wall, the fog or the firelight first; a red sky is the exception, and where sky shows it is as often black, storm grey or green fog. A band of red sky across the top of the frame is not the default. A frame in natural colour, or a frame without both red and green, is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global hi line asks for full, even daylight, which a 1960s horror
# poster cannot hold. Every band stays dark; exposure only changes how much of
# the frame the light reaches. No band defaults to a full moon or a sunset.
[hammer.light]
lo = "Deep night inside or out: at least two thirds of the frame is black, lit by one candle, a lantern or a torch. The moon is hidden or absent. A frame with an evenly lit area, or a full moon in the sky, is a failed response."
mid = "Dusk, storm or a lit interior at night: candles, a hearth, torches or lightning from one side, with lit and black areas both substantial. A frame in flat or natural daylight is a failed response."
hi = "A ballroom blazing with candelabra, a lightning flash that whites out the sky, a laboratory lit by arcing coils, a mob's torches or a grey morning after a bad night: bright, but still with deep black shadow in at least a third of the frame. A blue daytime sky, a sunny landscape or a full moon is a failed response."

