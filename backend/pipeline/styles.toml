[masala.registers]
"botanical" = "Plants of the hot coast as luxury: jasmine and tuberose strung in a woman's hair, palms bent over a pool, bougainvillea over a bungalow gate. Its highlight: flowers in a quantity no garden could hold."
"bodily and anatomical" = "The body at ease and admired: a bare back in a low-cut blouse, a swimmer's shoulders out of the water, a hand with rings resting on a rail. Sensual, never wounded."
"fungal and decaying" = "Decay as the monsoon's slow, handsome work: green mould softening a sea wall, an old Gothic bungalow gone to creepers, a wooden dhow silvered by salt."
"animal and creaturely" = "City and sea creatures: crows on a terrace rail, a pair of greyhounds by a pool, egrets on the mudflats, pomfret silver in a basket."
"geological" = "The island's rock: black basalt sea walls, a rocky cove up the coast, the hill above the bay, wet sand at low tide."
"metallic and ore" = "Gold and brass: a smuggled bar warm in a hand, brass lamps, a wristwatch, the chrome on a convertible. Its highlight: gold where gold cannot be."
"glass and ceramic" = "Glass of the evening: a cocktail glass sweating on a rail, a chandelier over a hotel ballroom, a fogged picture window over the sea, blue-and-white tiles round a pool."
"architectural" = "The 1970s city: cream Art Deco blocks along the bay, a hill bungalow with a deep veranda, a palace hotel by the harbour, the stone gateway on the water."
"domestic interior" = "Inside a film star's flat or bungalow: a teak record cabinet, a marble floor and a bar trolley, cane blinds, a dressing table of perfume bottles, a ceiling fan turning."
"mechanical" = "Machines of the day: a black-and-yellow taxi, a long convertible, a record player, a launch with a big outboard, a reel-to-reel turning in a recording room."
"industrial and infrastructural" = "The working harbour seen at its most handsome: dock cranes against a violet sky, the lit station's iron roof, a lighthouse, the customs jetty at night."
"agricultural and cultivated" = "Where the city's luxuries come from: salt pans silver at the island's edge, a coconut grove up the coast, a mango orchard behind a beach house."
"aquatic" = "The sea as pleasure and secret: the bay at night, a pool lit from below, a dhow in open water under a big moon, warm rain on a flooded lane."
"atmospheric" = "Coast air: monsoon cloud over the bay, sea mist, cigarette smoke under club lights, the haze of a hot afternoon."
"glacial and frozen" = "Cold as luxury: ice in a glass on a terrace, an ice-cream cart on the sea face, the chill of an air-conditioned lounge against a hot window."
"fire and ember" = "Fire as evening: oil lamps along a balcony rail, candles on a supper table, fireworks over the bay, lamps floated on the sea."
"textile and fiber" = "Clothes as pleasure: chiffon in the sea wind, a sequinned evening gown, a silk scarf over a convertible's seat, cane and rattan woven into a lounger."
"ritual object" = "The sacred and the lucky: a jasmine garland, a brass lamp at a sea shrine, a lime and chillies hung for luck, a coconut broken before a voyage."
"paper and inscription" = "Papers of the trade: a ship's manifest, a contract on a producer's desk, a sheet of song lyrics, a cinema ticket. Writing appears as marks, never a readable sentence."
"instrument and measure" = "Music above all: a grand piano in a supper club, a trumpet, a sitar laid on a divan, a tabla pair, and a jeweller's scale for the gold."

[masala]
label = "Bombay Silk"
suffix_base = "A polished 1970s Indian film-magazine glamour painting in airbrushed gouache and oil, seen whole: the painting fills the frame edge to edge with no border. The surface is perfectly smooth: silky, seamless gradients, no visible brushstrokes, no hard outlines, forms modelled in soft light and deep velvety shadow, with a gentle glow blooming around every lamp, highlight and reflection on wet surfaces. One consistent scale and perspective, composed like a single cinematic camera shot. Skies and light follow the scene's hour and weather: deep blue and violet for night with warm lamplight, pearl grey and green for monsoon rain, clear gold for a hot afternoon, rose and amber only at dusk. Colour is rich and luminous rather than loud, set by the scene's own light, with the figures' clothes in colours that stand out against it. Not photographic, not digital and not 3D-rendered. No text, title, credits or lettering; where a title would go there is more painted background."
suffix_figures = " Only if a person is explicitly part of the scene described above: the central figure is a woman, a grown adult in her twenties or thirties, painted with the smooth, luminous glamour of a 1970s film-magazine cover: glowing skin in warm browns, never lightened, soft highlights on cheekbones, shoulders and lips, kohl-lined eyes and a calm, knowing, unhurried expression, never mugging, wide-eyed, crying or shouting. Each woman has an individual face, complexion, build, hairstyle and outfit of her own, in 1970s Bombay clothes cut to show her off, in dry, solid, fully opaque cloth, never sheer, wet or see-through. Men have sideburns, moustaches and wide collars. Glamour is suggestive, never explicit, with no exposed breasts or genitals. People are painted with affection, never caricatured or exoticised."
space = [
  "from a hotel terrace over the sea at night across the black water to the lit curve of the bay",
  "from the deck of a dhow at anchor across a moonlit cove to the dark headland",
  "from a hill bungalow's veranda down a garden of palms and bougainvillea to the gate",
  "across a sea-face pool and its loungers to the cabanas and a band under a striped awning",
  "down a rain-wet lane of Art Deco shopfronts and parked taxis to a lit cinema",
  "down a basement club past the band and the tables to a doorway onto the wet night",
  "along a causeway at low tide to a white shrine on the water",
  "across a recording studio's glass booth and mixing desk to the musicians beyond",
]
conditions = ["newly made", "kept and cared for", "polished by long use", "softened by sea air"]


# CHARTER, 2026-10-13 (new style, written to docs/charter-schema.md): Mexico
# as the printers' calendars of the 1940s painted it, the ones hung in every
# tortillería, barbershop and kitchen: Mexica legends played as romance in the
# lake city, among maguey fields, pyramids, canals and chinampas, painted in oil
# and printed offset in saturated four-colour. The closest sibling of [velvet]
# (same era, same sentiment), but luminous at every hour, and that is the line
# between them. The central figure is a grown woman, a heroine painted with the
# calendar's idealised glamour; men are her warriors, traders and musicians,
# never the subject. Her dress is what a woman of her rank and trade would
# wear, and her face is her own: never a type or a costume. Words that pull a
# figure young (maiden, girl, daughter, school) are kept out on purpose, and the
# world has no children in it. Glamour is pin-up and film poster, never
# explicit, and cloth stays opaque. No artist, printer, film or studio names,
# since whatever a charter names turns up in the picture.
#
# REVISION 1, 2026-10-13 (review): volcanoes cut to era (on clear days) and the
# last signature item; outfit menu taken out of suffix_figures; sheer and wet
# cloth removed; the volcano-lovers legend and the dead woman removed; content
# taken out of suffix_base, which now describes an offset halftone print rather
# than Havana's chromolithograph; golden hour no longer the default; DAYLIGHT
# renamed LUMINOUS and fitted to night; marigolds, the altar for the dead, the
# nine levels, the hairless dog and candles removed to keep clear of Muertos;
# canoe down to three mentions; charro and hacienda down to one each; the
# eagle on the cactus removed; "ruler's daughter" replaced.
#
# REVISION 2, 2026-10-13 (sweep pr-calendario): a wading woman's wet white
# shift went see-through, so bathing and wading are out of the verbs and
# inhabitants, cloth is named as thick dyed cotton in strong colour, and
# suffix_figures says it stays opaque wet or dry. Stage 2 put marigolds in three
# of eight frames, so the flower lists now name the valley's own and marigolds
# are ruled out. Every woman knelt with the same loose black hair, so allure and
# suffix_figures now vary pose and hair.
[calendario.world]
era = "The Valley of Mexico as the calendars of the 1940s imagined it: the lake city of the Mexica on its causeways, temple pyramids with smoking braziers on top, flat-bottomed boats among floating gardens, maguey and corn on the slopes, and on clear days two snow-capped volcanoes stand over the valley. The legend's age and the painters' own century sit in one bright valley, so a hacienda's white walls and a charro on horseback can now and then share a hillside with a feathered warrior. Technology is the dugout, the obsidian blade, the spear-thrower, the loom, the stone metate and the conch trumpet, and everyone in the picture handles theirs like a hero."
materials = "Sunlit skin, quetzal feathers and jade first, then gold, embroidered cotton, obsidian, carved and painted stone, woven reed, cut flowers, lake water and cotton armour. Everything is clean and newly finished, as a calendar would have it."
physics = "Light is the sun, the moon, a brazier on a temple or a torch on the water, and nothing glows of its own accord. Gods and omens are real and show themselves in the sky, the water and the animals rather than as beams or halos. Wounds are a dark stain on cloth at most, never gore."
society = "A court and a countryside at once: rulers and priests, eagle and jaguar warriors, ball players, featherworkers, potters, chinampa farmers, boat traders, healers, and the market at the lake's edge; in the painters' present, ranch hands, women selling flowers at the canal landings and musicians in the plaza. Days here are feasts, flower festivals, ball games, market days, courtship on the temple steps and evenings of music as much as war and work."
weather = "The whole range of the high valley: a cobalt noon with towering white clouds, a bright morning after rain with the canals full, a cool clear afternoon with the wind in the corn, a full moon on the lake, a summer storm sweeping rain across the chinampas. Pick what the day calls for, and paint it at its most luminous."
inhabitants = "Grown women at the centre, in their twenties and thirties, each with her own face, build and colouring across the range of real Mexican women: a noblewoman of the court, a priestess, a featherworker, a healer, a woman warrior, a flower seller on the canals, a rider on the ranch lands. Around them, warriors in eagle and jaguar regalia, priests, traders, farmers and musicians; jaguars, spider monkeys, parrots in the market and axolotls in the canals; and the gods walking in human shape. Nobody in this world is a child. They are as often swimming the lake, singing, feasting, courting or gambling at the ball court as at war."
strangeness = "The marvellous is ordinary weather here: a god disguised as a traveller at the market, a hummingbird that carries a dead warrior's soul, a carved idol that answers back. People bow, make an offering and carry on with their day."
numinous = "The sacred has a body of stone, feather and flesh: the plumed serpent's head carved on a temple stair, the rain god's jars tipping in the clouds, the flower goddess walking a field in bloom, the old fire god sitting in a brazier's smoke. Painted in the same clear colour as everything else, never as a beam or an aura."
dread = "This world at its darkest is the omen and the loss: a comet in the daytime sky, strange ships on the far coast, the lake rising over the gardens, an empty altar at the top of the stairs. Painted with the same heroic calm and the same saturated colour as a feast, never gore, and the frame does not take sides."
favoured_actors = "A grown woman alone, with a lover or with other women, close enough to fill much of the frame: the ruler's widow on a temple stair above the city, a flower seller at a canal landing, a priestess at a brazier, a healer gathering herbs at the field's edge, a rider on a ridge above the corn. Warriors, lovers, rivals, musicians and animals share the frame, never as the subject. A muscular warrior carrying a sleeping woman in his arms before the mountains is this genre's most worn image and is never painted here, and neither is the same woman facing the viewer in every frame."
myth = "Mexica and wider Mesoamerican tradition: the Nahua songs of flowers and war, the calendar of feasts, the gods of rain, flowers and the morning star, the ball game and its cosmology; and the romance the 1940s laid over them, of star-crossed lovers, noble warriors and a homeland's beauty."
highlight = "The thing the eye finds first: something mythic happening in plain, glorious light, as if the legend is still going on. Today's kind of wrongness is given with this definition. Painted in the same smooth, saturated finish as everything else."
highlight_modes = [
  "the weather answering a prayer on the spot",
  "an animal arriving as an omen at exactly the right moment",
  "a god walking among people in human shape",
  "flowers blooming where nothing should grow",
  "a carved stone figure that has moved since morning",
]

[calendario.brief]
signature = "SIGNATURE — at least one thing marks this as the calendar's legendary Mexico, named explicitly: a temple pyramid, a field of blue-grey maguey, a canoe among floating gardens, a warrior's crest of quetzal feathers, or a snow-capped volcano on a clear day. It may be the highlight or the actor. The volcanoes are optional; a frame that is a landscape with mountains and a small figure is a failed response. A frame that could be any tropical landscape, any ancient ruin or any modern Mexican street is a failed response."
allure = "ALLURE — the subject is always a woman. Whenever people are in frame, the lead figure is a strikingly beautiful grown woman painted with this genre's idealised glamour: a wrap of dyed cloth tied at the hip or a tunic belted tight, loose hair, a knowing or faraway look, in a pose of ease, ritual, travel or courtship rather than one held for the viewer; she stands, strides, rides, poles a boat or sits high on a stair at least as often as she kneels. Her clothes and jewellery are what a woman of her rank and trade would wear, not a costume. Her cloth is thick cotton dyed in strong colour, crimson, cobalt, emerald or saffron more often than white, and it is opaque, wet or dry. If the actor named below is a man, paint a woman in the same role instead. Always clothed; never nudity and never a sexual act. A frame where she kneels on the ground in the foreground every time is a failed response, and so is a frame whose lead figure is a man, or a frame of plain, faceless or shapeless figures, is a failed response."
luminous = "LUMINOUS — whatever the hour, colours are clear and saturated and the figures are clearly lit, and open sky or open water is visible. A frame that is murky, grey, muddy or mostly black is a failed response."
temper = "TEMPER — the highlight, and anything numinous in the frame, is in this temper: {wonderTone}"

# LIGHT: the global lines put the low-exposure band two thirds in the dark and
# allow flat overcast at the high end. Calendar art does neither: its nights
# are luminous blue and its days are never grey. It is not a sunset genre
# either, so warm low sun is ruled out of the mid band. The lo band has no
# candles or firelight, which keeps dark days clear of [muertos].
[calendario.light]
lo = "A luminous blue hour or a moonlit night painted the calendar way: a deep cobalt and violet sky with no red or orange in it, a full moon, and the figures clearly lit by moonlight and the glow of the sky. No candles. At most half the frame is dark. A frame that is mostly black, or a red or orange sky, is a failed response."
mid = "A clear morning or afternoon sun from one side, at least forty degrees up: crisp shadows, local colour at full strength. Sunset, sunrise or an orange cast over the whole frame is a failed response."
hi = "A brilliant high sun in a saturated cobalt sky with towering white clouds, every colour at full saturation, figures modelled by clear light. A frame under flat grey overcast is a failed response."

